<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F766E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<title>轻学英语</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230F766E'/%3E%3Ctext x='16' y='22' font-size='16' text-anchor='middle' fill='%23FBFCFA' font-family='Georgia,serif' font-style='italic'%3EL%3C/text%3E%3C/svg%3E">
<style>
/* ===== 基础：窄屏优先（375px 起） ===== */
:root{
  --bg:#F6F7F5;
  --surface:#FFFFFF;
  --ink:#1C2628;
  --muted:#5E6B6C;
  --faint:#78857F;
  --hair:#E2E6E3;
  --accent:#0F766E;
  --accent-soft:#E0EFEC;
  --danger:#A2443C;
  --radius:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  font-size:15px;line-height:1.6;
  min-height:100vh;
}
a{color:var(--accent);text-decoration:none}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:none;background:none;color:inherit}
input{font-family:inherit;font-size:16px}
a,button{-webkit-tap-highlight-color:transparent;touch-action:manipulation}

/* ===== 顶栏 ===== */
.topbar{
  position:sticky;top:0;z-index:20;
  background:rgba(246,247,245,.94);backdrop-filter:blur(6px);
  border-bottom:1px solid var(--hair);
}
.topbar-inner{
  max-width:960px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top)) 16px;
  display:flex;align-items:center;gap:12px;min-height:52px;
}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:17px;letter-spacing:.5px}
.brand-mark{
  width:26px;height:26px;border-radius:7px;background:var(--accent);color:#fff;
  display:flex;align-items:center;justify-content:center;
  font-family:Georgia,serif;font-style:italic;font-size:16px;
}
.topbar .spacer{flex:1}
.navlink{
  min-height:44px;display:inline-flex;align-items:center;gap:5px;
  color:var(--muted);font-size:14px;padding:0 10px;border-radius:8px;
}
.navlink:hover{background:var(--accent-soft);color:var(--accent)}
/* 手机：顶栏链接多了一个「商务」，允许横向滚动，窄屏也不会挤成两行 */
@media (max-width:600px){
  .topbar-inner{gap:5px;padding-left:10px;padding-right:10px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .topbar-inner::-webkit-scrollbar{display:none}
  .topbar .navlink{padding:0 6px;font-size:13px;white-space:nowrap}
  .topbar .brand{font-size:15px;gap:5px;white-space:nowrap}
  .topbar .brand-mark{width:22px;height:22px;font-size:14px}
}

/* ===== 布局容器 ===== */
.wrap{max-width:960px;margin:0 auto;padding:20px 16px calc(64px + env(safe-area-inset-bottom))}

/* ===== 首页：总览 ===== */
.hero{padding:8px 0 20px}
.hero h1{font-size:24px;font-weight:700;letter-spacing:.5px}
.hero p{color:var(--muted);margin-top:6px;font-size:14px}
.overall{
  margin:14px 0 26px;padding:14px 16px;background:var(--surface);
  border:1px solid var(--hair);border-radius:var(--radius);
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;
}
.overall .big{font-size:22px;font-weight:700;color:var(--accent)}
.overall .meta{color:var(--muted);font-size:13px;flex:1;min-width:120px}
.pbar{flex-basis:100%;height:6px;background:var(--hair);border-radius:3px;overflow:hidden}
.pbar>i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .25s}

.sect-title{
  font-size:13px;color:var(--faint);letter-spacing:2px;margin:22px 0 10px;
  display:flex;align-items:center;gap:10px;
}
.sect-title::after{content:"";flex:1;height:1px;background:var(--hair)}
.sect-note{font-size:12.5px;color:var(--faint);line-height:1.7;margin:-4px 0 10px}
/* 双语流里的「导读 / 备注」段：不加粗，读起来像正文 */
.hsep.h9{font-size:13.5px;font-weight:400;color:var(--muted);line-height:1.85;border-top:none;padding:6px 4px 4px;margin-top:4px}

/* 专题卡片：编辑式列表行 */
.card{
  background:var(--surface);border:1px solid var(--hair);border-radius:var(--radius);
  padding:14px 16px;margin-bottom:10px;display:block;width:100%;text-align:left;
  transition:border-color .15s;min-height:64px;
}
.card:hover{border-color:var(--accent)}
.card .row1{display:flex;align-items:baseline;gap:10px}
.card .t{font-size:16px;font-weight:600;flex:1;min-width:0}
.card .n{font-size:13px;color:var(--faint);white-space:nowrap}
.card .sub{font-size:12.5px;color:var(--muted);margin-top:3px}
.card .pbar{margin-top:9px;height:5px}
.badge-imp{
  display:inline-block;font-size:11px;color:var(--accent);background:var(--accent-soft);
  border-radius:4px;padding:1px 6px;margin-left:6px;vertical-align:1px;
}

/* ===== 单词学习页 ===== */
.study-head{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.study-head .title{font-size:17px;font-weight:700;flex:1;min-width:0}
.mini-btn{
  min-height:36px;padding:0 12px;border:1px solid var(--hair);border-radius:8px;
  background:var(--surface);font-size:13px;color:var(--muted);
}
.mini-btn:hover{border-color:var(--accent);color:var(--accent)}
.mini-btn.danger{color:var(--danger)}
.prog-foot{
  margin-top:26px;padding-top:14px;border-top:1px dashed var(--hair);
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  font-size:12px;color:var(--faint);
}
.backup-row{display:flex;gap:8px;flex-wrap:wrap}
.backup-hint{width:100%;line-height:1.5}

.searchbox{margin-bottom:14px}
.searchbox input{
  width:100%;padding:10px 12px;border:1px solid var(--hair);border-radius:8px;
  background:var(--surface);outline:none;
}
.searchbox input:focus{border-color:var(--accent)}
.search-results{margin:6px 0 14px;max-height:220px;overflow:auto}
.search-results button{
  display:block;width:100%;text-align:left;padding:9px 10px;border-bottom:1px solid var(--hair);
  min-height:44px;
}
.search-results button:hover{background:var(--accent-soft)}
.search-results .def{font-size:12.5px;color:var(--muted)}

.flashcard{
  background:var(--surface);border:1px solid var(--hair);border-radius:14px;
  padding:36px 22px 30px;text-align:center;position:relative;
}
/* 换卡时轻微淡入上移，让「翻页」看起来是一次过渡而不是闪一下 */
@keyframes cardIn{from{opacity:.55;transform:translateY(3px)}to{opacity:1;transform:none}}
.flashcard.anim{animation:cardIn .16s ease-out}
@media (prefers-reduced-motion: reduce){ .flashcard.anim{animation:none} }
.flashcard .pos{font-size:12.5px;color:var(--faint);letter-spacing:1px}
.flashcard .word{
  font-family:Georgia,"Times New Roman",serif;
  font-size:44px;line-height:1.15;font-weight:600;margin:10px 0 4px;
  word-break:break-word;
}
.flashcard .ph{color:var(--muted);font-size:15px;font-family:Georgia,serif}
.flashcard .def{
  margin-top:18px;padding-top:16px;border-top:1px solid var(--hair);
  font-size:16px;line-height:1.7;text-align:left;
}
.flashcard .word.big-sentence{font-size:30px;line-height:1.35;margin:14px 0 6px}
.flashcard .word.big-phrase{font-size:38px}
.flashcard .grp{
  display:inline-block;margin-top:10px;font-size:12px;color:var(--accent);
  background:var(--accent-soft);border-radius:5px;padding:2px 9px;
}
.flashcard .ex{
  margin-top:14px;padding:12px 14px;background:#F4F7F6;border-radius:8px;text-align:left;
}
.flashcard .ex-en{font-size:14.5px;line-height:1.6;color:var(--ink)}
.flashcard .ex-cn{font-size:13.5px;color:var(--muted);margin-top:4px}
.done-mark{
  position:absolute;top:14px;right:14px;font-size:12px;color:var(--accent);
  background:var(--accent-soft);border-radius:5px;padding:2px 8px;
}
.controls{display:flex;gap:10px;margin-top:16px}
.controls button{
  flex:1;min-height:48px;border-radius:10px;font-size:15px;font-weight:600;
}
.btn-nav{background:var(--surface);border:1px solid var(--hair);color:var(--ink)}
.btn-nav:hover{border-color:var(--accent)}
.btn-mark{background:var(--accent);color:#fff}
.btn-mark.off{background:var(--surface);border:1px solid var(--accent);color:var(--accent)}
.hint{text-align:center;color:var(--faint);font-size:12px;margin-top:12px}

/* ===== 播客列表 ===== */
.ep{
  display:flex;align-items:flex-start;gap:10px;background:var(--surface);
  border:1px solid var(--hair);border-radius:var(--radius);
  padding:11px 12px;margin-bottom:8px;
}
.ep .chk{
  flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--hair);
  display:flex;align-items:center;justify-content:center;margin-top:2px;color:#fff;
}
.ep.heard .chk{background:var(--accent);border-color:var(--accent)}
.ep .body{flex:1;min-width:0}
.ep .tt{font-size:14.5px;line-height:1.45;display:block}
.ep.heard .tt{color:var(--faint);text-decoration:line-through}
.ep .meta{font-size:12px;color:var(--faint);margin-top:3px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tag{display:inline-block;font-size:11px;padding:0 6px;border-radius:4px;background:var(--accent-soft);color:var(--accent)}
.tag.gray{background:#EEF0EE;color:var(--muted)}

/* ===== 页脚 / 提示 ===== */
footer{
  margin-top:48px;padding-top:18px;border-top:1px solid var(--hair);
  color:var(--faint);font-size:12px;text-align:center;line-height:1.8;
}
.toast{
  position:fixed;left:50%;bottom:28px;transform:translateX(-50%);
  background:var(--ink);color:#fff;padding:9px 16px;border-radius:8px;font-size:13px;
  opacity:0;pointer-events:none;transition:opacity .2s;z-index:50;
}
.toast.show{opacity:.94}
.storage-warn{
  background:#FBF3E4;color:#7A5B1E;border:1px solid #EAD9AE;border-radius:8px;
  padding:8px 12px;font-size:12.5px;margin-bottom:12px;
}
.empty{color:var(--faint);text-align:center;padding:40px 0;font-size:14px}

/* ===== APEC 章节学习流 ===== */
.flow{margin:4px 0 8px}
.hsep{padding:16px 4px 8px;border-top:1px solid var(--hair);margin-top:14px}
.hsep.h1{font-size:19px;font-weight:700;margin-top:22px;color:var(--accent)}
.hsep.h2{font-size:16px;font-weight:700}
.hsep.h3{font-size:14.5px;font-weight:600}
.hsep.h4{font-size:13.5px;font-weight:600;color:var(--muted)}
.hsep .hen{display:block;font-size:12px;color:var(--faint);font-weight:400;margin-top:2px}
.biling{
  position:relative;background:var(--surface);border:1px solid var(--hair);
  border-radius:var(--radius);padding:14px 16px;margin:10px 0;
  cursor:pointer;transition:border-color .15s,box-shadow .15s,background .15s;
  -webkit-tap-highlight-color:transparent;   /* 点「朗读」时不再整句闪高亮 */
}
.biling.active{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.biling.done{background:#F3F6F5}
.b-cn{font-size:15.5px;line-height:1.6;font-weight:500}
.b-en{font-size:14px;line-height:1.6;color:var(--muted);margin-top:6px}
.biling.done .b-cn, .biling.done .b-en{color:var(--faint)}

/* ===== 复习队列 / 难词本 ===== */
.subbar{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}
.chip-btn{
  min-height:34px;padding:0 12px;border:1px solid var(--hair);border-radius:999px;
  background:var(--surface);font-size:12.5px;color:var(--muted);
  display:inline-flex;align-items:center;gap:5px;
}
.chip-btn:hover{border-color:var(--accent);color:var(--accent)}
.chip-btn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.chip-btn .num{font-weight:700}
.chip-btn .dot{width:6px;height:6px;border-radius:50%;background:var(--accent)}
.mini-btn.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.rev-controls{display:flex;gap:10px;margin-top:16px}
.rev-controls button{flex:1;min-height:48px;border-radius:10px;font-size:15px;font-weight:600}
.btn-forgot{background:var(--surface);border:1px solid var(--hair);color:var(--danger)}
.btn-forgot:hover{border-color:var(--danger)}
.btn-reveal{background:var(--surface);border:1px solid var(--accent);color:var(--accent)}
.btn-remember{background:var(--accent);color:#fff}
.rev-meta{text-align:center;font-size:12px;color:var(--faint);margin-top:10px}
.hard-row{
  display:flex;align-items:center;gap:10px;background:var(--surface);
  border:1px solid var(--hair);border-radius:var(--radius);padding:10px 12px;margin-bottom:8px;
}
.hard-row .hw{flex:1;min-width:0}
.hard-row .hw b{font-family:Georgia,serif;font-size:16px;font-weight:600;word-break:break-word}
.hard-row .hw span{display:block;font-size:12.5px;color:var(--muted);margin-top:3px}
.hard-row .src{font-size:11px;color:var(--faint);background:var(--bg);border-radius:4px;padding:1px 6px;white-space:nowrap}
.hard-row .kill{border:none;background:none;color:var(--faint);font-size:16px;padding:6px;cursor:pointer}
.hard-row .kill:hover{color:var(--danger)}

/* ===== 通用文本弹窗（替代 prompt） ===== */
.tm-mask{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:center;justify-content:center;z-index:120;padding:16px}
.tm-panel{
  background:var(--surface);border-radius:14px;padding:16px;width:100%;max-width:560px;
  box-sizing:border-box;box-shadow:0 10px 40px rgba(0,0,0,.18);max-height:86vh;
  display:flex;flex-direction:column;gap:8px;
}
.tm-title{font-size:15px;font-weight:700}
.tm-hint{font-size:12px;color:var(--muted);line-height:1.6}
.tm-area{
  width:100%;box-sizing:border-box;min-height:150px;max-height:46vh;border:1px solid var(--hair);
  border-radius:10px;padding:10px;font-size:16px;line-height:1.5;font-family:inherit;
  resize:vertical;outline:none;background:var(--surface);color:var(--ink);
}
.tm-area:focus{border-color:var(--accent)}
.tm-actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.tm-ok{background:var(--accent);color:#fff;border:none;border-radius:9px;padding:9px 16px;font-weight:600;font-size:14px}
.tm-cancel{background:var(--surface);border:1px solid var(--hair);border-radius:9px;padding:9px 16px;font-size:14px;color:var(--ink)}
.backup-warn{
  background:#FBF3E4;color:#7A5B1E;border:1px solid #EAD9AE;border-radius:8px;
  padding:9px 12px;font-size:12.5px;margin-bottom:12px;line-height:1.6;
}
.backup-warn button{
  margin-left:8px;border:1px solid #D9C48C;background:#fff;color:#7A5B1E;
  border-radius:6px;padding:2px 8px;font-size:12px;
}
.bk-grid{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.bk-line{font-size:12.5px;color:var(--muted)}
.bk-line b{color:var(--ink)}

/* ===== 桌面扩展 ===== */
@media (min-width:768px){
  .wrap{padding:28px 24px 80px}
  .hero h1{font-size:30px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
  .flashcard .word{font-size:60px}
  .flashcard .word.big-sentence{font-size:38px}
  .flashcard .word.big-phrase{font-size:48px}
  .flashcard{padding:48px 40px 38px}
  .flashcard .def{font-size:17px}
}
</style>
</head>

var APEC_BOOKS=[{"bookId":"b2","title":"公务人员实用英语手册","chapters":[{"cid":"b2-p1-n1","title":"APEC基础认知篇","blocks":[[1,"Part 1 APEC背景知识","Part 1 About APEC"],[2,"APEC基础认知篇","APEC Fundamentals"],[0,"1. APEC的全称是什么？","1. What is the full name of APEC?"],[0,"全称Asia-Pacific Economic Cooperation，中文译“亚太经合组织”，是亚太层级最高、领域最广、最具影响力的经济合作机制。","The full name is Asia-Pacific Economic Cooperation. It is the premier economic cooperation mechanism in the Asia-Pacific region, recognized for its highest-level dialogue, broadest scope, and most significant influence."],[0,"2. APEC是哪一年成立的？","2. In which year was APEC established?"],[0,"1989年11月5日至7日，澳大利亚、美国、日本、韩国、新西兰、加拿大及当时的东盟六国在澳大利亚首都堪培拉举行APEC首届部长级会议，标志APEC正式成立。","From November 5 to 7, 1989, Australia, the United States, Japan, the Republic of Korea, New Zealand, Canada, and the then six ASEAN countries held the first APEC Ministerial Meeting in Canberra, the capital of Australia, marking the official establishment of APEC."],[0,"3. APEC的主要宗旨是什么？","3. What is the primary goal of APEC?"],[0,"支持亚太区域经济可持续增长和繁荣，建设活力和谐的亚太大家庭，捍卫自由开放的贸易和投资，加速区域经济一体化进程，鼓励经济技术合作，保障人民安全，促进建设良好和可持续的商业环境。","The primary goal of APEC is to support sustainable economic growth and prosperity in the Asia-Pacific region. APEC is united in a drive to build a dynamic and harmonious Asia-Pacific community by championing free and open trade and investment, promoting and accelerating regional economic integration, encouraging economic and technical cooperation, enhancing human security, and facilitating a favorable and sustainable business environment."],[0,"4. APEC为什么重要？","4. Why is APEC important?"],[0,"APEC成员投资总额约占全球70%","APEC member economies account for approximately 70% of global investment"],[0,"经济总量约占全球60%","60% of global GDP"],[0,"贸易总量占全球50%","50% of global trade"],[0,"人口总量约占全球40%","40% of the world’s population"],[0,"5. APEC现有成员和观察员分别有哪些？","5. Who are the current member economies and observers of APEC?"],[0,"APEC现有21个成员，分别是澳大利亚、文莱、加拿大、智利、中国、中国香港、印度尼西亚、日本、韩国、墨西哥、马来西亚、新西兰、巴布亚新几内亚、秘鲁、菲律宾、俄罗斯、新加坡、中国台北、泰国、美国和越南。此外，APEC还有3个观察员，分别是东盟秘书处、太平洋经济合作理事会、太平洋岛国论坛秘书处。","APEC currently has 21 member economies: Australia; Brunei Darussalam; Canada; Chile; the People's Republic of China; Hong Kong, China; Indonesia; Japan; the Republic of Korea; Mexico; Malaysia; New Zealand; Papua New Guinea; Peru; the Philippines; Russia; Singapore; Chinese Taipei; Thailand; the United States; and Viet Nam. It also has three official observers: the ASEAN Secretariat, the Pacific Economic Cooperation Council, and the Pacific Islands Forum Secretariat."],[0,"6. APEC秘书处是如何设立的？","6. How was the APEC Secretariat established?"],[0,"APEC秘书处于1993年1月在新加坡设立，为APEC各层次的活动提供支持与服务。秘书处负责人为执行主任，2010年起设固定任期，任期三年。现任执行主任为爱德华多·佩德罗萨（Eduardo Pedrosa，菲律宾籍），于2025年1月就任，任期至2027年12月31日。","The APEC Secretariat was established in Singapore in January 1993 to provide support and services for APEC activities at all levels. The head of the Secretariat is the Executive Director, and since 2010, the position has had a fixed term of three years. The current Executive Director is Eduardo Pedrosa (Philippine nationality), who took office in January 2025 for a term ending on December 31, 2027."],[0,"7. APEC会议为什么是“非正式”的?","7. Why are APEC meetings described as \"informal\"?"],[0,"会议采取自主自愿和协商一致的合作方式。所作决定须经各成员一致同意。会议成果文件不具法律约束力，但各成员在政治上和道义上有责任尽力予以实施。","The meetings operate on the basis of voluntary participation and consensus-building. Decisions must be made with the agreement of all members. The resulting documents are not legally binding, but members have a political and moral responsibility to implement them to the best of their ability."],[0,"8. APEC会议的倡议成果都有哪些类型?","8. What types of outcomes or initiatives result from APEC meetings?"],[0,"包括“经济体领导人宣言”“部长级会议联合声明”等，以及具体倡议、行动计划和工作组报告。","These include the \"Economic Leaders' Declaration,\" \"Joint Ministerial Statements,\" as well as specific initiatives, action plans, and working group reports."]]},{"cid":"b2-p1-n2","title":"中国与APEC篇","blocks":[[2,"中国与APEC篇","China and APEC"],[0,"1. 中国是哪一年加入APEC的？","1. In which year did China join APEC?"],[0,"1991年11月，中国以主权国家身份、中国台北和香港（1997年7月1日起改为“中国香港”）以地区经济体名义，正式加入亚太经合组织。","China joined APEC in November 1991, along with Hong Kong and Chinese Taipei. China joined as a sovereign state, while Hong Kong (renamed \"Hong Kong, China\" since July 1, 1997) and Chinese Taipei joined as regional economies."],[0,"2. 中国加入APEC以来，担任过几次东道主？","2. Since joining APEC, how many times has China served as the host?"],[0,"2026年是第三次，前两次为 2001年上海、2014年北京。","2026 marks the third time. After Shanghai in 2001 and Beijing in 2014 ."]]},{"cid":"b2-p1-n3","title":"APEC深圳篇","blocks":[[2,"APEC深圳篇","APEC Shenzhen"],[0,"1. 2026年APEC领导人非正式会议将在哪个城市举行？","1. Where will the 2026 APEC Economic Leaders' Meeting be held?"],[0,"深圳","Shenzhen"],[0,"2. 2026年APEC领导人非正式会议将在什么时候举行？","2. When will the 2026 APEC Economic Leaders' Meeting be held?"],[0,"2026年11月18-19日，会议将同步举办多项配套活动。","It will be held on November 18-19, 2026, and the conference will concurrently host multiple supporting events."],[0,"3. 2026 APEC“中国年”会标有什么含义？","3. What is the meaning of the APEC China 2026 logo?"],[0,"会标主体由21根交织的羽翼共同构成展翅高飞的大鹏的形态，寓意着乘大势、共翱翔。会标生动阐释了APEC的精神，21个成员各具特色，但又相互依存、相互合作，也象征着亚太经济体携手构建亚太共同体的深远意义。","The logo features 21 interwoven feathers that take the form of a great roc spreading its wings and soaring into the sky, symbolizing the idea of seizing the momentum and flying together. The logo vividly captures the spirit of APEC — the 21 members, each unique in their own way, are mutually dependent and cooperative. It also signifies the profound meaning of Asia-Pacific economies working hand in hand to build an Asia-Pacific community."],[0,"4. 2026年APEC会议的主题是什么？","4. What is the theme of APEC 2026?"],[0,"会议主题为“构建亚太共同体、促进共同繁荣”，聚焦“开放、创新、合作”三大优先领域。","Themed \"Building an Asia-Pacific Community to Prosper Together,\" APEC 2026 will focus on three priorities: openness, innovation, and cooperation."]]},{"cid":"b2-p1-n4","title":"APEC经贸篇","blocks":[[2,"APEC经贸篇","APEC Economy and Trade"],[0,"1. APEC商务旅行卡是什么？","1. What is the APEC Business Travel Card?"],[0,"APEC商务旅行卡（以下简称“旅行卡”）是亚太经合组织为促进亚太地区贸易投资便利化所作的一项多边签证便利政策。申请人一次申办，五年有效，可多次入境，每次入境至少可停留60天。各经济体普遍为持卡人提供出如境通关便利。","The APEC Business Travel Card is a multilateral visa facilitation policy launched by APEC to boost trade and investment facilitation in the Asia-Pacific region. Applicants only need to submit one application for a five-year valid card that allows multiple entries, with a minimum stay of 60 days for each entry. All member economies generally provide entry and exit customs clearance conveniences for cardholders."],[0,"2. 使用APEC商务旅行卡可用于哪些活动？","2. What activities can the APEC Business Travel Card be used for?"],[0,"原则上只适用于以商务活动为目的的国际旅行，不能用于旅游、探亲、访友、看病等非商务目的的活动。","In principle, the card is intended for international business travel only and not for non-business purposes such as tourism, visiting family or friends, or medical purposes."]]},{"cid":"b2-p2-n1","title":"（一）城市简介","blocks":[[1,"Part 2 深圳介绍","Part 2 About Shenzhen"],[2,"（一）城市简介","Introduction to the City"],[0,"深圳，总面积1997.47平方公里，常住人口1798.95万人，平均年龄32.5岁。","Shenzhen covers a total area of 1,997.47 square kilometers and has a permanent population of 17.9895 million, with an average age of 32.5 years."],[0,"深圳2025年经济总量达38731.8亿元，位居全国第三，2025年进出口总额达4.55万亿元人民币，居中国内地城市首位。","In 2025, Shenzhen's total economic output reached 3.87318 trillion yuan, ranking third in the country. In 2025, the city's total import and export volume reached 4.55 trillion yuan, the highest among all cities on the Chinese mainland."],[0,"深圳拥有国家高新技术企业2.5万家，国家级专精特新“小巨人”企业1333家，数量居全国城市首位。","Shenzhen is home to 25,000 national high-tech enterprises and 1,333 national-level specialized and sophisticated “little giant” enterprises—the highest number among Chinese cities."],[0,"深圳的PCT国际专利申请量连续22年居中国城市首位。","The city has topped all Chinese cities in PCT international patent applications for 22 consecutive years."],[0,"深圳拥有全球第四大集装箱港、亚洲最大综合性口岸、中国第三大航空港（按货邮吞吐量），与全球100多个国家和地区的300多个港口有贸易往来。","Shenzhen boasts the world's fourth-largest container port, Asia's largest comprehensive land port, and China's third-largest aviation hub (by cargo and mail throughput). It maintains trade links with over 300 ports from more than 100 countries and regions worldwide."],[0,"深圳机场国际及地区客货运航线达104条，国际及地区旅客量全年突破630万人次。","Shenzhen Airport operates 104 international and regional passenger and cargo routes, with annual passenger throughput exceeding 6.3 million."],[0,"深圳港集装箱吞吐量历史性突破3500万标箱，外贸集装箱吞吐量居大湾区港口首位。","The container throughput of Shenzhen Port has reached a historic high of over 35 million TEUs, ranking first among ports in the Greater Bay Area."],[0,"深圳森林覆盖率约40%，拥有1300多座公园，200公里沿着山脊线的鲲鹏径、260.5公里海岸线，拥有全球首个红树林保护跨国合作平台——国际红树林中心。","With an approximately 40% forest coverage rate, the city features more than 1,300 parks, a 200-kilometer Kunpeng Trail along mountain ridgelines, and a 260.5-kilometer coastline. It also hosts the world's first international cooperation platform for mangrove conservation — the International Mangrove Center."],[0,"深圳实现公交车、出租车100%纯电动化，万元GDP能耗、水耗、碳排放强度达到国际先进水平。","The city has achieved 100% electrification of its public buses and taxis. Its energy consumption, water consumption, and carbon emission intensity per 10,000 yuan of GDP have reached internationally advanced levels."]]},{"cid":"b2-p2-n2-1","title":"1. 景区景点","blocks":[[2,"（二）文化旅游","Tour in Shenzhen"],[3,"1. 景区景点","Scenic Spots"],[0,"莲花山公园：位于深圳中心区北端，是深圳最具象征意义的市政公园之一。山顶广场设有邓小平同志铜像，是重要的城市地标和政务接待点，公园集休闲、健身、纪念与城市形象展示功能于一体。","Lianhua Hill Park, located at the northern end of the central area of Shenzhen, stands as one of the city’s most iconic municipal parks. The mountaintop plaza in the park, which features a bronze statue of Deng Xiaoping, serves as an urban landmark and an important venue for official receptions. The park not only offers spaces for leisure, exercise, and commemoration, but also showcases the character and spirit of Shenzhen."],[0,"深圳湾公园：为我市标志性滨海休闲带，荣获多项国际设计大奖。13公里滨海径串联12个主题公园，集徒步骑行、观光游览、自然体验于一体，是展现深圳现代化滨海城市风貌的重要城市窗口。","Shenzhen Bay Park, as a landmark coastal leisure belt of the city, has received multiple international design awards. Its 13-kilometer coastal trail connects 12 themed parks, integrating activities such as hiking, cycling, sightseeing, and nature experiences. It serves as an important urban window showcasing Shenzhen's modern coastal cityscape."],[0,"深圳人才公园：坐落于南山区后海片区，总占地面积77万平方米，系全国首个以“人才”为主题的城市公园。公园将自然生态景观与城市精神内核有机融合，既是滨海休闲的优质公共空间，更生动彰显了深圳尊贤重才的城市品格与创新发展的坚定决心。","Shenzhen Talent Park, located in the Houhai area of Nanshan District, covers a total area of 770,000 square meters and is the first urban park in China themed around \"talent.\" The park harmoniously blends natural ecological landscapes with the city's spiritual core. It not only provides a high-quality public space for coastal leisure but also vividly reflects Shenzhen's respect for talent and its firm commitment to innovative development."],[0,"香蜜公园：位于福田区，是在原农科公园基础上升级建设的综合性市政公园。公园融合生态保护、公共服务和科普教育功能，是中心城区重要的高品质公共休闲空间。","Honey Park, located in Futian District, is a comprehensive municipal park upgraded on the site of the former Agricultural Science Research Center of the Agricultural Science Group. Integrating ecological conservation, public services, and science education functions, it serves as a premium public recreational space in downtown Shenzhen."],[0,"海上世界：位于蛇口片区，以明华轮为核心地标。该区域见证了深圳改革开放初期的重要历程，现已发展为具有国际化特色的文旅和商业集聚区。","Shenzhen Sea World is located in the Shekou area, with the Minghua cruise ship as its core landmark. The area witnessed the early phase of Shenzhen’s reform and opening-up and has since evolved into an international cultural, tourism, and commercial hub."],[0,"大鹏所城：始建于明代，是深圳“鹏城”名称的来源。其历史定位为南中国海防要塞，现为全国重点文物保护单位，是深圳重要的历史文化源头之一。","Dapeng Fortress was first built during the Ming Dynasty (1368–1644) and is the origin of Shenzhen’s nickname, \"Pengcheng\" (meaning \"City of the Roc\") . Historically positioned as a vital defense stronghold along China's southern coast, it is now designated as a national-level protected heritage site, standing as one of the city's important historical and cultural roots."],[0,"南头古城：是深圳历史最悠久的城区，是古代新安县治所在地。这里是深港澳地区共同的历史文化根源。经城市更新后，已成为历史文化与城市生活融合发展的示范区。","Nantou Ancient Town is the oldest urban area in Shenzhen, which once served as the administrative seat of Xin’an County in ancient times. It represents a shared historical and cultural origin for Shenzhen, Hong Kong, and Macao. Following urban renewal, it has been transformed into a model area showcasing the integrated development of historical heritage and contemporary urban life."],[0,"梧桐山：是深圳第一高峰，也是国家级风景名胜区。其高覆盖率天然植被构成深圳重要生态屏障，兼具生态保护、登山休闲和城市景观功能。","Wutong Mountain, the highest peak in Shenzhen, is designated as a national scenic area. Its extensive natural vegetation coverage forms a vital ecological barrier for the city, contributing to environmental conservation and urban landscape while also offering a picturesque space for recreational hiking."],[0,"欢乐港湾：依托128米巨型摩天轮“湾区之光”特色地标，打造集滨海风貌、商业消费与艺术体验于一体的城市文旅新地标。园区汇聚精品滨海餐饮、特色水秀演艺，常态化运营创意市集与潮流运动空间。市民游客徜徉其间，可尽览都市滨海夜景，沉浸式体验国际化、高品质的滨海休闲消费新场景。","OH Bay, featuring the 128-meter giant Ferris wheel \"Bay Glory\" as its signature landmark, has established itself as a new urban cultural and tourism landmark that integrates coastal scenery, commercial retail, and artistic experiences. It brings together premium coastal dining and distinctive water show performances, while hosting regular creative markets and dynamic sports spaces. Visitors strolling through the area can enjoy a panoramic view of the city's coastal nightscape and immerse themselves in an international, high-quality coastal leisure and consumption scene."],[0,"中英街：位于沙头角，是“一街两制”的独特历史街区。该区域具有明确的边境管理属性和爱国主义教育功能，是深圳极具辨识度的特殊人文景观。","Zhongying Street, located in Shatoujiao, represents a unique historical block under the \"One Street, Two Systems\" arrangement. Serving both a border management function and a role in patriotic education, it stands as a distinctive cultural landmark in Shenzhen."],[0,"盐田海滨栈道：全长19.5公里，被誉为深圳东部最美徒步海岸线。栈道串联中英街、大梅沙等核心景点，融合百年人文底蕴与滨海自然风光。沿线设有灯塔图书馆等特色点位，可尽览现代化港区壮阔景致，是兼具山海风貌与户外休闲功能的优质文旅目的地。","Yantian Seaside Boardwalk, stretching 19.5 kilometers, is renowned as the most beautiful hiking coastline in eastern Shenzhen. It connects key attractions such as Zhongying Street and Dameisha Beach, blending a century-old cultural heritage with natural coastal landscapes. Along the route, featured spots such as the Lighthouse Library offer sweeping views of the modern port area, making it a high-quality cultural tourism destination that combines mountain-and-sea vistas with outdoor leisure."]]},{"cid":"b2-p2-n2-2","title":"2. 文博场馆","blocks":[[3,"2. 文博场馆","Cultural & Art Facilities"],[0,"深圳图书馆：作为国家一级图书馆、“图书馆之城”核心场馆与特区文化高地，馆藏文献超千万册，服务指标位居全国前列。场馆兼具全民阅读推广与文献资源调配功能，是市民求知学习的重要阵地，也是彰显深圳人文魅力的城市名片。","Shenzhen Library, as a National First-Class Library, a core venue of the \"Library City\" initiative, and a cultural landmark of the Shenzhen Special Economic Zone, houses over 10 million volumes and ranks among the top in the country in terms of service indicators. The facility serves both as a hub for nationwide reading promotion and document resource allocation. It is a vital space for citizens' learning and knowledge acquisition, as well as an urban icon showcasing the humanistic charm of Shenzhen."],[0,"深圳音乐厅：位于福田中心区，是深圳专业化程度最高的音乐演出场所之一。音乐厅具备承接国际高水平交响乐和大型音乐活动的能力，是深圳高雅艺术传播和城市文化品位的重要象征。","Shenzhen Concert Hall, located in the central Futian District, is one of the most professionally equipped music performance venues in Shenzhen. Equipped to present world-class symphony concerts and large-scale musical events, it stands as a key platform for promoting fine arts and elevating the city's cultural sophistication."],[0,"深圳当代艺术与城市规划馆：位于福田中心区，采用“两馆一体”运营模式。场馆集当代艺术展示与城市规划展示于一体，是深圳重要的公共文化地标，建筑设计前卫，体现深圳创新型城市形象。","Shenzhen Museum of Contemporary Art and Urban Planning (SZ MoCAUP), located in the central Futian District, merges contemporary art and urban planning exhibitions into one integrated venue. As a key public cultural landmark in Shenzhen, its avant-garde architectural design reflects the city's identity as a hub of innovation."],[0,"深圳湾文化广场：位于后海片区，是深圳新时代重大文化设施之一。项目以“设计与科技融合”为核心定位，集展览、交流与公共文化活动于一体，是深圳面向全球展示创新设计能力的重要文化载体。","Shenzhen Bay Culture Square, located in the Houhai area, is one of the city's major cultural facilities for the new era. Focused on the integration of design and technology, it hosts exhibitions, exchange events, and public cultural activities, serving as a key platform to showcase the city's innovative design strength to the world."],[0,"深圳图书馆（北馆）：于2023年正式开馆，是深圳首批建成并投入使用的新时代重大文化设施。北馆总建筑面积约7.2万平方米，设计藏书量800万册，承担城市公共图书馆和全市文献调剂书库功能。","Shenzhen Library (North) officially opened in 2023 as one of the city's first major cultural facilities of the new era. Covering a floor area of approximately 72,000 square meters and a designed capacity of 8 million volumes, it functions as both a public library and a citywide document resource-sharing hub."],[0,"深圳美术馆（新馆）：位于深圳北站商务中心区，是深圳重要的国家级美术机构。新馆集展览、收藏、研究、公共教育和国际交流于一体，承担推动深圳建设区域文化中心城市的重要使命。","Shenzhen Art Museum (New Venue), located in the Shenzhen North Station CBD, is a major national-level art institution. Integrating a broad array of functions such as exhibition, collection, research, public education, and international exchange, the New Venue plays a vital role in advancing Shenzhen's goal of becoming a regional cultural center."],[0,"深圳科学技术馆：位于光明区科学公园核心区，是深圳重要的科普基础设施。展馆以“数字文明·创新·未来”为主题，突出科技体验与公众参与，承担提升全民科学素养和展示城市创新能力的重要功能。","Shenzhen Science & Technology Museum, located in the core area of the Science Park in Guangming District, is a key hub for science education in Shenzhen. Themed \"Digitalization Innovates the Future,\" the museum focuses on hands-on experiences and public participation, playing an important role in enhancing public scientific literacy and showcasing Shenzhen's innovation capability."],[0,"深圳珠宝博物馆：位于罗湖水贝片区，是国内首家以珠宝为主题的公共博物馆。博物馆突出“博物馆+产业”融合定位，服务深圳珠宝产业发展，是展示深圳珠宝产业实力的重要文化平台。","Shenzhen Jewelry Museum, located in the Shuibei area of Luohu District, is China's first public museum dedicated to jewelry. With a unique positioning that integrates the museum with the broader jewelry industry, it serves as an important cultural platform showcasing the strengths of Shenzhen's jewelry sector and advancing its development."]]},{"cid":"b2-p2-n2-3","title":"3. 会展场馆","blocks":[[3,"3. 会展场馆","Convention & Exhibition Venues"],[0,"深圳国际会展中心：位于宝安区福海街道，毗邻深圳机场，处于粤港澳大湾区核心区位。该项目是深圳打造国际会展之都的重要基础设施，建成后室内展览面积达50万平方米。作为超大型会展综合体，其承担国际展览、会议和重大活动功能。","Shenzhen World Exhibition & Convention Center is located in the Fuhai Subdistrict, Bao'an District and adjacent to the Shenzhen Airport. Standing at the core of the Greater Bay Area, it is an important facility supporting Shenzhen's ambition to become an international hub of conventions and exhibitions. Covering an indoor exhibition space of 500,000 square meters when fully completed, the center will serve as a mega complex capable of hosting international exhibitions, conventions, and other major events."],[0,"深圳会展中心：位于福田中心区，是由市政府投资建设的综合性会展场馆，于2004年投入使用。场馆集展览、会议和配套服务于一体，是深圳早期会展功能的核心承载地，长期服务高规格展会和会议活动，被誉为城市中心区的“水晶宫”。","Shenzhen Convention & Exhibition Center, located in central Futian District, is a comprehensive convention and exhibition venue funded by the municipal government. Commencing operation in 2004, it has long served as an essential venue for hosting high-level exhibitions and conventions, also providing supportive services. It is widely known as the \"Crystal Palace\" in the central area of Shenzhen."],[0,"深圳坪山燕子湖国际会展中心：位于坪山区，是深圳东部首个综合性会展中心，于2019年投入运营。场馆以“展览—会议—酒店”一体化运营为特色，服务产业型和专业型会展需求，与深圳国际会展中心、深圳会展中心共同构成深圳“一城三馆”会展格局。","Yanzi Lake International Convention and Exhibition Center, located in Pingshan District, is the first comprehensive convention and exhibition center in eastern Shenzhen. Commencing operation in 2019, the center integrates exhibition, convention, and hotel functions to serve both industrial and specialized needs. Together with Shenzhen World Exhibition & Convention Center and Shenzhen Convention & Exhibition Center, it forms a trio of major venues serving the city."]]},{"cid":"b2-p2-n3","title":"（三）商圈购物","blocks":[[2,"（三）商圈购物","Shopping in Business Districts"],[0,"深圳湾万象城：位于南山区，总建筑面积约8万平方米，是集时尚零售、艺术体验与文化消费于一体的高端城市商业综合体，是以高品质体验为导向的城市级商业地标。","MixC Shenzhen Bay, located in Nanshan District, covers a total floor area of approximately 80,000 square meters. This high-end urban complex integrates fashion retail, artistic experiences, and cultural consumption, serving as a city-level commercial landmark dedicated to delivering premium experiences."],[0,"深圳万象城：位于罗湖中心，是深圳最具代表性的高端城市购物中心之一。项目以“一站式”消费为核心，集购物、餐饮、娱乐与文化体验于一体，长期引领深圳商业升级和消费方式变革。","The MixC, located in the Luohu CBD, is one of the city's most iconic high-end shopping centers. Centered on a \"one-stop\" consumption experience, the complex integrates shopping, dining, entertainment, and cultural experiences, consistently shaping Shenzhen's commercial landscape and consumer lifestyle."],[0,"购物公园COCO Park：位于福田中心区，是深圳最具时尚与夜间活力的城市商业地标之一。项目融合购物、餐饮、休闲与酒吧街等多元业态，是深圳年轻消费文化的重要集聚地。","COCO Park, located in central Futian District, is one of the most fashionable urban landmarks and a vibrant nighttime destination in Shenzhen. This multi-purpose complex integrates shopping, dining, and recreational amenities—including a dedicated bar street—making it a major destination for young consumers."],[0,"平安国际金融中心：位于福田中心区，是深圳重要的金融地标建筑。项目建成后成为深圳第一高楼，象征城市金融实力与现代化水平，是深圳天际线和金融形象的重要代表。","Ping An International Financial Center, located in central Futian District, is a major financial landmark in Shenzhen. Upon its completion as the city's tallest building, it came to symbolize Shenzhen's financial strength and modern urban development."],[0,"卓悦中心：位于福田中心区，以街区式空间形态营造轻松休闲氛围，聚焦高品质餐饮与城市生活方式消费。约2.5万平方米餐饮空间汇集100余家餐饮品牌。","One Avenue, located in the heart of central Futian District, features a block-style layout designed for a relaxed and leisurely atmosphere, with a focus on high-quality dining and urban lifestyle consumption. Its approximately 25,000-square-meter dining area brings together over 100 restaurant brands."],[0,"深业上城：位于福田中心区，是集商业、办公、居住于一体的城市综合体。项目以“品牌街+商场+小镇”复合形态著称，体现深圳高密度城区的复合型城市生活方式。","UpperHills, located in central Futian District, is an urban complex combining commercial, office, and residential functions. Renowned for its \"brand street + mall + town\" composite model, it exemplifies the multifaceted urban lifestyle characteristic of Shenzhen's high-density communities."],[0,"华强北商圈：是以电子产业为核心的全国知名专业化商业街区。商圈业态高度集中，产业与商业深度融合，是深圳实体经济与市场活力的典型代表。","Huaqiangbei Pedestrian Street is a nationally renowned commercial street centered on the electronics industry. Featuring a high concentration of electronics-related businesses and deep integration of industry and commerce, it stands as a prominent example of Shenzhen's robust real economy and market vitality."],[0,"东门步行街：是深圳历史最悠久的商业区之一。改造后的步行街融合传统风貌与现代商业功能，是深圳城市商业记忆和大众消费的重要载体。","Dongmen Pedestrian Street is one of Shenzhen's oldest commercial areas. Following its renovation, it blends traditional features with modern commercial functions, preserving the city's commercial heritage while driving economic vibrancy."],[0,"欢乐海岸购物中心：位于深圳湾片区，是文旅与商业融合发展的代表项目。项目结合餐饮、休闲与滨水空间，是深圳重要的城市休闲目的地之一。","O’PLAZA, located in the Shenzhen Bay area, is a flagship complex exemplifying the integration of cultural tourism and commercial development. Combining dining, leisure, and waterfront spaces, it is a key destination for leisure and entertainment in Shenzhen."],[0,"壹方天地：位于龙华片区，是以“集群式商业”为特色的大型商业综合体。项目通过多主题版块构建完整商圈，服务区域型与青年消费需求。","Uniworld, located in the Longhua area, is a large commercial complex characterized by its \"clustered\" retail layout. Featuring various themed zones, it creates a complete business ecosystem that caters to young consumers and contributes to regional development."],[0,"前海壹方城：位于宝安中心区，是深圳单体规模最大的购物中心之一。项目集购物、社交、文化与家庭体验于一体，是前海—宝安片区的核心商业地标。","Uniwalk Qianhai, located in central Bao'an District, is one of Shenzhen's largest standalone shopping centers. Integrating shopping, social interaction, cultural experiences, and family-oriented activities, it stands as a core commercial landmark in the Qianhai-Bao'an area."],[0,"水贝国际珠宝城：位于罗湖水贝片区，是中国黄金珠宝产业核心交易平台之一。项目集交易、鉴定、展示与产业服务于一体，是深圳珠宝产业集聚和转型升级的重要载体。","Shuibei International Jewelry Trade Center, located in the Shuibei area of Luohu District, is a key platform for gold and jewelry trade in China. Integrating trading, appraisal, exhibition, and industry services, it serves as a vital hub for the clustering, transformation, and upgrading of Shenzhen’s jewelry industry."]]},{"cid":"b2-p2-n4","title":"（四）特色美食","blocks":[[2,"（四）特色美食","Local Specialties"],[0,"粤菜经典：","Classic Cantonese dishes:"],[0,"白切鸡：是粤菜中最具代表性的传统菜式之一，以“清、鲜、本味”为核心，强调对食材品质与火候的精准把控，体现粤菜“少调味、重原味”的饮食理念。","Boiled Chicken Slices is one of the most iconic traditional dishes in Cantonese cuisine. Known for its lightness, freshness, and authentic flavor, it emphasizes precise control over the quality of ingredients and the timing of cooking. The dish exemplifies the Cantonese culinary philosophy of minimal seasoning to highlight the natural taste of ingredients."],[0,"广式烧鹅：是粤菜烧腊体系中的经典品类，以皮脆肉嫩、香气浓郁著称，制作工艺成熟稳定，常作为粤菜对外展示的重要标志性菜式。","Cantonese Roasted Goose is a classic in the Cantonese roast meat tradition. Made with a well-established and consistent cooking process, the dish is known for its crispy skin, tender meat, and rich aroma. It is often featured as a signature dish when showcasing Cantonese cuisine to the world."],[0,"蜜汁叉烧：是广式烧腊中的代表菜品，以甜咸平衡和酱香层次见长，广泛应用于日常餐饮与宴席场景。","Honey-glazed Barbecue Pork is a typical dish in the Cantonese roast meat tradition. Celebrated for its balanced sweet-and-salty flavor and layered aroma of the glaze, it is widely served both in daily meals and in banquet settings."],[0,"清蒸东星斑：是高端粤菜宴席中的经典海鲜菜式，采用清蒸技法，突出鱼肉的细嫩与鲜甜，体现粤菜对顶级食材的尊重与克制处理。","Steamed Leopard Coral Grouper is a classic seafood dish in high-end Cantonese banquets. Prepared using the traditional steaming method, it highlights the delicate texture and natural flavor of the fish, reflecting how Cantonese cuisine respects and carefully processes premium ingredients to preserve their original freshness."],[0,"脆皮乳猪：是粤菜传统宴席中的重头菜式，以皮脆如纸、肉质细嫩为核心标准，多用于重要节庆和正式宴请场合。","Crispy Suckling Pig is a centerpiece in traditional Cantonese banquets. Known for its paper-thin crispy skin and tender, succulent meat, it is typically served during major celebrations and formal dining occasions."],[0,"老火靓汤：是粤菜饮食文化的重要组成部分，通过长时间慢火熬煮，强调食材本味与滋养属性，体现粤菜“以汤养人”的生活理念。","Slow-simmered Soup is a key element of Cantonese culinary culture. Prepared through long, gentle simmering, it emphasizes the natural flavors and nourishing qualities of the ingredients, reflecting the Cantonese culinary philosophy of using soup to promote health and well-being."],[0,"沙井生蚝：是深圳极具地域代表性的海产美食，以个大肥美、口感鲜甜著称，已成为深圳饮食文化的重要城市名片。","Shajing Oyster is a signature seafood delicacy of Shenzhen. Known for its large size and fresh and sweet flavor, it is served as an iconic dish of the city's culinary culture."]]},{"cid":"b2-p3-n1-1","title":"1. 问候寒暄","blocks":[[1,"Part 3 公务人员接待常用英文表达","Part 3 Common English Expressions for Official Receptions"],[2,"机场/口岸篇","Airport / Port"],[3,"1. 问候寒暄","Greetings and Small Talk"],[4,"（1）初次见面","First Meeting"],[0,"请问您是米歇尔先生/女士吗？","Are you Mr. Michel/Ms. Michelle?"],[0,"欢迎您来到深圳！一路辛苦了！","Welcome to Shenzhen! I hope you had a pleasant journey."],[0,"我是负责接您的工作人员！很高兴见到您。","I'm here to pick you up! It's a pleasure to meet you."],[0,"您还适应深圳的天气吗？","Are you comfortable with the weather here?"],[4,"（2）熟悉对象","Return Visit"],[0,"又见到您啦，欢迎再次来到深圳！","Nice to see you again. Welcome back to Shenzhen!"],[0,"旅途还顺利吗？","Did you have a good trip?"],[0,"希望此行能给您带来不一样的体验。","I hope you have another great experience here."]]},{"cid":"b2-p3-n1-2","title":"2. 协助通关","blocks":[[3,"2. 协助通关","Assisting with Customs Clearance"],[0,"我是协助您通关入境的工作人员。","I'm here to help you go through immigration and customs."],[0,"请准备好护照和签证证件，我帮您在手机上操作。","Your passport and visa, please. I'll help you complete the process on your phone."],[0,"我陪您走贵宾通道验核。","I'll take you through the fast-track channel for inspection."],[0,"请准备好护照，走边检/海关礼遇通道快速办理通关手续。","Please have your passport ready and go through the courtesy channel for faster clearance."]]},{"cid":"b2-p3-n1-3","title":"3. 提取行李","blocks":[[3,"3. 提取行李","Luggage Claim"],[4,"（1）行李区指引","Luggage Claim Guidance"],[0,"您有托运行李需要提取吗？","Do you have any checked luggage?"],[0,"请问同行人员都到齐了吗？","Is everyone here?"],[0,"我带大家提取行李。","I'll take you to collect your luggage."],[4,"（2）行李确认","Luggage Confirmation"],[0,"您的行李都齐了吗？有没有遗失或损坏？","Do you have all your luggage? Anything missing or damaged?"],[0,"请别着急，我马上联系工作人员查找。","Don't worry, I'll ask the staff right away to check."],[0,"请问这是您的行李箱吗？请核实。","Could you please check if this is your suitcase?"],[0,"您的行李比较多，我来帮您拿。","You have a lot of luggage. Let me help you."]]},{"cid":"b2-p3-n1-4","title":"4. 会议日程","blocks":[[3,"4. 会议日程","Meeting Schedule"],[0,"我先向您介绍本次会议的日程安排。","Let me go over the conference schedule with you."],[0,"请您先乘车抵达酒店办理入住。","Please take a car to the hotel and check in first."],[0,"会议当天有车辆送您抵达会场，我们会提前告知您乘车时间和地点。","A car will take you to the venue on the conference day. We'll let you know the pick-up time and place in advance."],[0,"会场有专人负责签到登记。","Staff at the venue will help you with registration."]]},{"cid":"b2-p3-n1-5","title":"5. 引导乘车","blocks":[[3,"5. 引导乘车","Guiding to Vehicle"],[4,"（1）专车引导","Private Car Transfer"],[0,"我带您前往专车通道乘车，请跟我来。","Let me take you to the pick-up lane. Please follow me."],[0,"专车已准备就绪，请在休息室稍作等候。","Your car is ready. Please wait in the lounge for a moment."],[0,"您的专车已到位，请带好随身行李，前往乘车点。","Your car has arrived. Please take your belongings to the pick-up point."],[0,"酒店位置已告知司机，会直接送您前往。","The driver already has the hotel address. He'll take you straight there."],[0,"上车时请留心脚下并系好安全带，司机会送您到会议中心。","Please watch your step as you get in and fasten your seat-belt. The driver will take you to the conference center."],[4,"（2）团体接驳车引导","Group Shuttle Bus Transfer"],[0,"各位代表，团体接驳车已在乘车点等候，请随我这边上车。","Dear delegates, the shuttle bus is waiting at the pick-up point. Please follow me."],[0,"乘车前我将核对代表名单和人数，感谢配合。","Before boarding, I'll check the name list to make sure everyone's here. Thank you for your cooperation."],[0,"请各位上车就座，系好安全带，车辆即将出发。","Please take your seats and fasten your seatbelts. The bus will depart soon."],[0,"让您久等了，我查询到您所在的代表团的接驳车已发车。","Sorry to keep you waiting. Your delegation's shuttle bus has already left."],[0,"别担心，下一班接驳车10分钟左右抵达，我安排您乘坐其他代表团的接驳车。","Don't worry, the next one will arrive in about 10 minutes. I'll find a seat for you on another shuttle bus."],[4,"（3）自行乘车引导","Self-Guided Transfer"],[0,"出租车","Taxi"],[0,"您可以按照多语种指引标识前往出租车站点。","You can follow the multilingual signs to the taxi stand."],[0,"我已经告诉司机目的地了，他会送您前往。","I've already told the driver your destination. He'll take you there."],[0,"可以现金支付，也可以使用微信、支付宝或银行卡支付。","You can pay by cash, WeChat, Alipay, or bank card."],[0,"下车时请带好随身物品。","Please take all your belongings when you get off."],[0,"网约车","Ride-Hailing"],[0,"出租车等候人员较多，您可以下载滴滴APP线上叫出租车。","Since there are many people waiting for taxis, you can download an app called Didi (DiDi Chuxing) to book one."],[0,"我来协助您操作，输入目的地，系统会安排就近车辆来接您。","Let me help you. Enter your destination, and the app will find a nearby car for you."],[0,"请提前绑定银行卡，行程结束后会自动结算。","Please make sure your bank card is linked to the app. The fare will be taken care of after your trip."],[0,"地铁","Subway"],[0,"如果担心拥堵，可以选择地铁出行，绿色出行是很不错的选择。","If you're worried about traffic, the subway is a great green option."],[0,"我来帮您查路线，附近就有地铁站，距离这里10分钟路程。","Let me check the route for you. There's a subway station nearby, just a 10-minute walk from here."],[0,"您可以乘坐2号线直达会议中心，大约需要20分钟。","You can take Line 2 straight to the conference center. It takes around 20 minutes."]]},{"cid":"b2-p3-n2-1","title":"1. 入住登记","blocks":[[2,"酒店篇","Hotel"],[3,"1. 入住登记","Check-In"],[0,"已到达您的入住酒店，我带您办理入住。这边请！","We've arrived at your hotel. Let me help you check in. This way, please."],[0,"请出示护照并填写登记表，如果需要，我可以为您翻译。","Please show your passport and fill out the registration form. I can help translate if needed."],[0,"谢谢您的配合，工作人员正在为您办理房卡，请稍等。","Thanks for your patience. The staff is preparing your room key. Please wait a moment."],[0,"请问您对房间楼层有偏好吗？工作人员可以优先为您安排。","Do you have a preferred floor? The staff can try to arrange it for you."]]},{"cid":"b2-p3-n2-2","title":"2.客房指引","blocks":[[3,"2.客房指引","Guest Room Directions"],[0,"这是您的房卡，请保管好。","Here is your room key. Please keep it safe."],[0,"工作人员已根据您的需求安排好房间。","Your room has been arranged based on your requests."],[0,"您的楼层比较高，可乘坐直达电梯。","Your room is on a high floor. The elevator will take you straight up."],[0,"祝您入住愉快。有任何需要，请随时联系。","Have a pleasant stay. If you need anything, just let us know."]]},{"cid":"b2-p3-n3-1","title":"1. 会前准备","blocks":[[2,"APEC会议中心篇","APEC Conference Center"],[3,"1. 会前准备","Pre-Meeting Preparation"],[4,"（1）签到登记","Sign-In and Registration"],[0,"马上就到会议中心了，还有5分钟路程。","We're almost at the conference center, about 5 minutes from here."],[0,"请这边走，会议中心的入口就在前面。","This way, please. The entrance is right ahead."],[0,"我陪您到签到处。请在签到表姓名旁空白处签字。","I'll walk you to the registration desk. Please sign next to your name."],[0,"请提供您所在代表团全称及您的姓名。","May I have your delegation's full name and your name?"],[0,"让您久等了，已核实到您的信息，请在此处签到。","Thanks for waiting. We've found your info. Please sign here."],[4,"（2）领取会议物料","Collecting Meeting Materials"],[0,"这是您的会议资料包，请收好。","Here's your conference kit. Please keep it with you."],[0,"里面是本次会议议程的相关资料，有深圳介绍，同时配有出行指南和美食介绍。","Inside you'll find the agenda, info about Shenzhen, a travel guide, and some food recommendations."],[0,"参会证请全程佩戴，凭此进入会场及茶歇区。","Please wear your badge at all times. You will need it to enter the conference venue and the coffee break area."]]},{"cid":"b2-p3-n3-2","title":"2. 会场区域","blocks":[[3,"2. 会场区域","Venue Areas"],[4,"（1）会场","Main Venue"],[0,"请拿好您的会议包及随身物品，我带您到会场门口，这边请。","Please take your conference kit and belongings. I'll lead you to the venue entrance. This way, please."],[0,"会场在2楼，我们乘坐这部电梯。请注意脚下台阶。","The venue is on floor 2. We’ll take this elevator. Please watch your step."],[0,"请佩戴好参会证，会场入口在左/右侧，我带您过去。","Please wear your badge. The entrance is on your left/right side. I'll take you there."],[0,"您的座位名牌已摆好，沿这个方向前行即可，请留意脚下。","Your name tag is on your seat. Just head this way, and please watch your step."],[0,"这是您的座位，请入座，会议即将开始。座位旁备有水和会议资料，可自行取用。","Here's your seat. Please go ahead and sit down. The event will begin shortly. You'll find water and the event materials next to you."],[0,"会议期间请将手机调至静音，感谢配合。","Please switch your phone to silent mode.  Thank you for your cooperation."],[4,"（2）洗手间","Restrooms"],[0,"会议中心各楼层均设有洗手间。","There are restrooms on every floor of the conference center."],[0,"距离您最近的洗手间在前方电梯的左/右侧。","The nearest is to the left/right of the elevator ahead."],[0,"需要我帮您照看物品吗？我在这里等您。","Would you like me to look after your belongings? I'll wait for you here."],[4,"（3）休息区","Lounge"],[0,"我带您去休息区，那里有水、咖啡和茶。","Let me show you to the lounge. Water, coffee, and tea are available there."],[0,"会议开始前，您可以在旁边的休息区等候。","Before the conference begins, you can relax in the lounge."],[0,"请乘坐左/右侧的电梯上二楼，按指示牌即可到达休息区。","Please take the left/right elevator to the second floor, and follow the signs to the lounge."],[4,"（4）祈祷室","Prayer Room"],[0,"会议中心有祈祷室，如您需要，我可以带您过去。","There is a prayer room in the conference center. I can take you there if you need it."],[0,"请随我前往祈祷室。","Please follow me to the prayer room."],[0,"如需使用祈祷室，可随时联系工作人员。","Please feel free to ask our staff if you need the prayer room."]]},{"cid":"b2-p3-n3-3","title":"3. 商务配套","blocks":[[3,"3. 商务配套","Business Support Facilities"],[4,"（1）商务服务","Business Services"],[0,"会议中心提供打印/复印/传真/网络等商务服务，如有需要可前往商务中心。","The conference center offers business services like printing, copying, faxing, and internet access. You can go to the business center if needed."],[0,"请问您需要连接会场Wi-Fi吗？我马上帮您连接。","Would you like to connect to Wi-Fi? I can help you set it up right away."],[4,"（2）会议设备","Conference Equipment"],[0,"请给我看一下充电插头，我为您提供转换插头。","Please show me your charger. I'll provide an adapter for you."],[0,"请问您是今天的发言嘉宾吗？我为您介绍会场设备的使用方法。","Are you one of today's speakers? Let me show you how to use the conference equipment."],[0,"您可以用这台电脑提前测试PPT，可以使用桌面上的麦克风或手持麦克风发言，也可以使用翻页笔演示PPT。","You can test your PPT on this laptop, and use the desktop or handheld microphone to speak. This is a page turner for your slides."],[0,"如果您需要播放视频或PPT，请提前提供给工作人员，我们将协助切换。","If you need to play a video or PPT, please provide it to the staff in advance, and we'll handle the switching for you."],[0,"现场也有备用电脑，可供您临时使用。","There are also spare laptops available for temporary use."],[4,"（3）同声传译设备","Simultaneous Interpretation Equipment"],[0,"会场门口两侧可领取同声传译设备。","Simultaneous interpretation headsets can be picked up on both sides of the conference hall entrance."],[0,"我们提供多语种同传服务。","We offer interpretation in multiple languages."],[0,"我教您操作，切换至所需语种。","Let me show you how to switch to your preferred language."],[0,"按下这个按钮，即可切换语言。","Press this button to switch languages."]]},{"cid":"b2-p3-n3-4","title":"4. 用餐指引","blocks":[[3,"4. 用餐指引","Dining Guidance"],[4,"（1）茶歇指引","Coffee / Tea Break Guidance"],[0,"会场外设有茶歇区，我带您过去。","There's a coffee break area outside the venue. Let me show you. This way, please."],[0,"茶歇备有中西式点心，冷热饮品、时令鲜果等。","There are Chinese and Western snacks, hot and cold drinks, and seasonal fresh fruits."],[0,"您可以根据自己的口味喜好，自行选取。","Please help yourself."],[4,"（2）正餐指引","Meal Guidance (Lunch/Dinner)"],[0,"我们已为您安排好就餐座位，请随我来。","We have arranged your dining seats. Please follow me."],[0,"今天为大家准备的是中式正餐，菜品会陆续呈上，请慢用。","We have prepared a Chinese meal today. Dishes will be served in sequence. Please enjoy."],[4,"（3）饮食禁忌","Dietary Restrictions"],[0,"我们为您安排了清真专用餐位，菜品均按照清真标准制作。","We have set up a halal table for you. All dishes are prepared according to halal standards."],[0,"请问除清真要求外，您还有其他饮食禁忌吗？","Besides Halal, do you have any other dietary restrictions?"],[0,"请问各位有饮食禁忌吗？如素食、忌辣、海鲜过敏等？","Does anyone have any dietary restrictions? For example, vegetarian, no spicy food, or seafood allergies?"],[0,"清真食品有明确标识，可以放心食用。","Halal food is clearly marked. Feel free to eat."],[4,"（4）席间提示","During-the-Meal Reminders"],[0,"餐具、纸巾、湿巾均在茶歇台，可自行取用。","Cutlery, napkins and wipes are available at the coffee break table. Please help yourself."],[0,"餐具回收区在茶歇台旁边，有工作人员协助回收。","Please return your cutlery next to the coffee break table. Our staff will collect it there."],[0,"有需要可随时联系现场工作人员。祝您用餐愉快。","If you need anything, just let us know. Enjoy your meal."],[4,"（5）餐后提示","Post-Meal Reminders"],[0,"距离下一场会议开始还有5分钟。请合理安排时间。","We have 5 minutes until the next session. Please plan your time."],[0,"用完茶歇的代表可陆续入场。","Delegates may now re-enter the venue after the break."],[0,"请留意脚下，工作人员将引导入座。","Please watch your step. Our staff will guide you to your seats."]]},{"cid":"b2-p3-n3-5","title":"5. 应急服务","blocks":[[3,"5. 应急服务","Emergency Services"],[4,"（1）物品遗失","Lost Items"],[0,"您别着急，我马上为您查找。","Don't worry, I'll look for it right away."],[0,"我马上联系签到处工作人员，请留下您的姓名和联系方式，找到后第一时间通知您。","I'll contact the registration staff. Your name and contact, please. We'll let you know as soon as we find it."],[0,"您去了哪些地方？我们将逐个地方帮您查找。","Can you tell me where you've been? We’ll check each place for you."],[0,"我们马上联系安保部门查看监控，请您稍等。","We'll contact security immediately to check the cameras. Please wait a moment."],[4,"（2）身体不适","Medical Discomfort"],[0,"请问您哪里不舒服？我先扶您到旁边的休息区坐一下。","Could you tell me where you're feeling unwell? Let me help you to the nearby lounge."],[0,"您现在感觉好一些了吗？有任何需要随时告诉我。","Are you feeling better now? Please let me know if you need anything."],[0,"需要喝杯温水吗？我给您倒一杯，请休息一下。","Would you like some warm water? I'll bring you a cup. Please take a rest."],[0,"您的情况需要专业医护人员帮助，我们马上联系附近的医护人员，请您放心。","Your condition requires professional medical assistance. Please rest assured. We will contact the medical staff nearby right away."],[0,"已经联系好了，我陪您前往，慢慢走，小心台阶。","It's already arranged. I’ll accompany you there. Take it easy and watch your step."],[4,"（3）设备故障","Equipment Malfunction"],[0,"别担心，我们马上检查线路和信号源。","Don't worry, we'll check the connection and signal right away."],[0,"请稍等，我马上为您更换话筒。","Please wait a moment, I'll replace the microphone for you."],[0,"请使用备用Wi-Fi，密码是12345678。","Please use the backup Wi-Fi, and the password is 12345678."],[0,"我们有备用插头和插线，我帮您重新连接。","We have spare plugs and cables. I'll help you reconnect."],[0,"我帮您重启设备并检查音频，很快就会恢复。","I'll restart the device and check the audio. It should be back soon."]]},{"cid":"b2-p3-n4-1","title":"1. 送别","blocks":[[2,"送别与会后联络篇","Farewell and Post-Event Follow-Up"],[3,"1. 送别","Farewell"],[4,"（1）会场送别","Farewell at the Venue"],[0,"非常感谢您来到深圳参会交流，期待未来继续深化合作，祝您一切顺利！","Thank you so much for visiting Shenzhen for this conference. We look forward to deepening our cooperation. Wish you all the best!"],[0,"期待后续保持紧密沟通，推进合作落地。祝您返程平安。","Let's stay in touch as we move forward with our cooperation. Safe travels!"],[0,"会议圆满结束，感谢您的参与配合，期待下次再会！","The conference has been successfully concluded. Thank you for your participation and cooperation. We look forward to seeing you again!"],[4,"（2）机场/口岸/高铁站送别","Farewell at the Airport / Port / High-Speed Rail Station"],[0,"请走这边专用办理通道。回国后如需资料对接或商务协助，可随时与我们联系。","Please use this special channel. If you need any information or business help after returning home, please feel free to contact us."],[0,"请走团体专用办理通道。感谢大家此行的到访与交流，祝大家返程顺利，期待再会。","Please use the group channel. Thank you all for your visit and exchange. I wish you a safe journey home and look forward to seeing you again."],[0,"口岸设有专用出境通道，请随我这边走。请检查出境证件是否带齐。","There's a special exit channel at the port. Please follow me and double-check that you have all your exit documents ready."]]},{"cid":"b2-p3-n4-2","title":"2. 会后联络","blocks":[[3,"2. 会后联络","Post-Event Contact"],[4,"（1）后续对接","Follow-Up Coordination"],[0,"您已抵达目的地了吗？再次感谢您的到访，如有任何需要，我们随时为您服务。","Have you arrived safely? Thank you again for your visit. We are here to help you if you need anything."],[0,"会后我们保持沟通，后续有任何问题可随时联系我。","Let's stay in touch afterward. Please feel free to contact me if you have any questions."],[0,"这是我的联系方式，希望我们保持联系，欢迎再次来访。","Here is my contact information. I hope we can stay in touch, and you are always welcome to visit again."],[4,"（2）合作邀约","Cooperation Invitation"],[0,"我们将尽快整理会议相关资料与您对接，期待进一步沟通合作。","We will organize the event materials and share them with you soon. We look forward to further communication and cooperation."],[0,"我会将会议资料和照片发给您，有任何需求请随时联系我。","I will send you the event materials and photos. Please feel free to contact me if you need anything."],[0,"我们非常重视本次会议成果，欢迎提出宝贵意见。期待未来深化合作。","We highly value the outcomes of this event and your valuable feedback is welcome. We look forward to deepening our cooperation in the future."]]},{"cid":"b2-p3-n5-1","title":"1. 信用卡","blocks":[[2,"支付指引篇","Payment Guidance"],[3,"1. 信用卡","Credit Card"],[0,"在深圳使用信用卡非常方便，酒店、餐厅和商场等场所均支持Visa、Mastercard、银联等信用卡支付。","It is very convenient to use credit cards in Shenzhen. Most hotels, restaurants, and malls take Visa, Mastercard, UnionPay, and other credit cards."],[0,"收银台或POS机上印有对应Logo，即可使用信用卡。","If you see the logo at the cashier or on the POS terminal, you can use your card there."],[0,"请您在POS机上刷卡/插卡并输入密码.","Please swipe or insert your card into the POS terminal and enter your PIN."],[0,"已扣款成功，请在单据上签名。","Payment completed. Please sign the receipt."]]},{"cid":"b2-p3-n5-2","title":"2. 支付宝/微信","blocks":[[3,"2. 支付宝/微信","Alipay & WeChat"],[0,"您也可以选择支付宝/微信支付，更加便捷。","You can also choose Alipay/WeChat, which is more convenient."],[0,"请先下载支付宝/微信APP，使用境外手机号注册国际版。","Please download the Alipay/WeChat app first and register for the international version with your overseas phone number."],[0,"请上传护照并完成人脸核验。进入“我的”-“银行卡”，添加银行卡并完成银行验证。","Please upload your passport and complete facial verification. Go to \"Me\" – \"Bank Cards,\" link your bank card, and complete verification."],[0,"绑定完成后，点击“付钱”向商家出示付款二维码，就可以支付了。","After linking your account, click \"Pay\" and show your payment code to the merchant."],[0,"也可以点击“扫一扫”，扫描商家二维码付款。","You can also click \"Scan\" to scan the merchant's QR code to pay."],[0,"境外手机号注册的微信、支付宝，目前主要用于消费支付，不支持转账和发红包功能。","WeChat and Alipay accounts registered with overseas phone numbers are currently mainly for consumer payments. Transfers and red packets are not supported."]]},{"cid":"b2-p3-n5-3","title":"3. 兑换现金","blocks":[[3,"3. 兑换现金","Currency Exchange"],[0,"您可以在有银联、Visa、Mastercard等标识的ATM机上提取人民币。我带您到最近的ATM机办理。","You can get RMB from any ATM with UnionPay, Mastercard, and Visa logos. I'll walk you to the nearest one."],[0,"ATM机取现手续费及限额以您的发卡行规定为准。","The withdrawal fee and limit depend on the policy of your card issuer."],[0,"请出示您的护照，告知工作人员兑换金额。","Please show your passport and tell the staff how much you would like to exchange."],[0,"根据当天的汇率来兑换结算。请问您确认兑换吗？","The exchange will be settled at today's rate. Would you like to confirm the exchange?"],[0,"这是您的人民币和兑换凭证，请收好。","Here is your RMB and exchange voucher. Please keep them."]]},{"cid":"b2-p3-n5-4","title":"4. 办理退税","blocks":[[3,"4. 办理退税","Tax Refund Application"],[4,"（1）退税流程","Tax Refund Procedure"],[0,"深圳有支持“即买即退”的商店，可以现场退税。","There are stores in Shenzhen that support \"Refund-Upon-Purchase\" service, where you can get your tax refund on the spot."],[0,"凭借发票、退税申请单，填写同意书后出示护照和信用卡（预授权担保）即可。","Present your invoice, tax refund application form, and a completed agreement form, along with your passport and credit card (pre-authorization guarantee)."],[0,"商店有“Tax Free”或退税商店标识的店铺，都可以办理退税。","Stores displaying \"Tax Free\" or a tax refund sign offer tax refund services."],[0,"离境时仍需到海关验核（17天内离境，商品未拆封），向海关出示退税物品、退税申请单、发票、护照。海关核对无误后会在申请单上盖章。","Upon departure, you still need to go to customs for verification (departure within 17 days, goods unopened and unused). Present the tax-refundable items, tax refund application form, invoice, and passport to customs. After verification, customs will stamp the application form."],[0,"需托运的商品，请先由海关验核，再办理托运。","For goods that need to be checked in, please have them cleared by customs first."],[0,"如未按时离境或未验核，退税金额将从信用卡中扣回。","If you do not depart on time or fail to verify, the refund amount will be deducted from your credit card."],[4,"（2）退税口岸","Tax Refund Ports"],[0,"深圳有6个口岸可办离境退税，深圳湾口岸、福田口岸、罗湖口岸、文锦渡口岸、蛇口邮轮母港和深圳宝安国际机场。营业时间为：9点至21点。","There are six ports in Shenzhen that offer tax refunds for departing tourists: Shenzhen Bay Port, Futian Port, Luohu Port, Wenjindu Port, Shekou Cruise Homeport, and Shenzhen Bao'an International Airport. The service hours are from 9:00 AM to 9:00 PM."],[4,"（3）退税提示","Tax Refund Tips"],[0,"免税商品、已开封/已使用商品、禁止/限制出境物品不能退税。","Duty-free, unpacked/used goods, and prohibited/restricted items are ineligible for tax refunds."],[0,"现金退税当场可办结；信用卡退税大约3-15个工作日。","Cash refunds can be processed on the spot; refunds to your credit card take about 3-15 business days."],[0,"部分退税机构支持支付宝/微信退税，以现场柜台为准。","Some tax refund agencies support Alipay and WeChat Pay refunds. Please check with the on-site counter for details."],[4,"（4）退税查询","Tax Refund Inquiry"],[0,"微信搜“i口岸”-离境退税-跳转“兴税通”，可预约、查商店、查口岸、看进度。","Search for \"i Port\" on WeChat - Departure Tax Refund – you'll be directed to \"GHBank Tax Refund Assistant\" (a tax service platform). You can make an appointment, check participating stores, ports of departure, and refund status."]]},{"cid":"b2-part-4","title":"Part 4 APEC重要词汇的缩写及中英文对照","blocks":[[1,"Part 4 APEC重要词汇的缩写及中英文对照","Part 4 Key APEC Terms – Abbreviations and Bilingual Glossary"],[0,"亚太经合组织","APEC  Asia-Pacific Economic Cooperation"],[0,"APEC领导人非正式会议","AELM  APEC Economic Leaders' Meeting"],[0,"APEC部长级会议","AMM  APEC Ministerial Meeting"],[0,"高官会","SOM  Senior Officials' Meeting"],[0,"非正式高官会","ISOM  Informal Senior Officials' Me 法语","Bon voyage."],[0,"日语","よいお旅を。"],[0,"越南语","Chúc bạn đi chơi vui vẻ."],[0,"马来语","Selamat jalan!"],[0,"泰语","ขอให้มีความสุขระหว่างการเดินทางครับ/ค่ะ"],[0,"印尼语","Selamat jalan!"]]},{"cid":"b2-part-6","title":"附录 APEC现有经济体的中英文对照","blocks":[[1,"附录 APEC现有经济体的中英文对照","APPENDIX English-Chinese Glossary of APEC Economies"],[0,"1.澳大利亚","1. Australia"],[0,"2.文莱","2. Brunei Darussalam"],[0,"3.加拿大","3. Canada"],[0,"4.智利","4. Chile"],[0,"5.中国","5. People’s Republic of China"],[0,"6.中国香港","6. Hong Kong, China"],[0,"7.印度尼西亚","7. Indonesia"],[0,"8.日本","8. Japan"],[0,"9.韩国","9. Republic of Korea"],[0,"10.马来西亚","10. Malaysia"],[0,"11.墨西哥","11. Mexico"],[0,"12.新西兰","12. New Zealand"],[0,"13.巴布亚新几内亚","13. Papua New Guinea"],[0,"14.秘鲁","14. Peru"],[0,"15.菲律宾","15. The Philippines"],[0,"16.俄罗斯","16. Russia"],[0,"17.新加坡","17. Singapore"],[0,"18.中国台北","18. Chinese Taipei"],[0,"19.泰国","19. Thailand"],[0,"20.美国","20. The United States"],[0,"21.越南","21. Viet Nam"]]}]},{"bookId":"b1","title":"公共服务行业人员实用英语手册","chapters":[{"cid":"b1-p1-n1","title":"APEC基础认知篇","blocks":[[1,"Part 1 APEC背景知识","Part 1 About APEC"],[2,"APEC基础认知篇","APEC Fundamentals"],[0,"1. APEC的全称是什么？","1. What is the full name of APEC?"],[0,"全称Asia-Pacific Economic Cooperation，中文译“亚太经合组织”，是亚太层级最高、领域最广、最具影响力的经济合作机制。","The full name is Asia-Pacific Economic Cooperation. It is the premier economic cooperation mechanism in the Asia-Pacific region, recognized for its highest-level dialogue, broadest scope, and most significant influence."],[0,"2. APEC是哪一年成立的？","2. In which year was APEC established?"],[0,"1989年11月5日至7日，澳大利亚、美国、日本、韩国、新西兰、加拿大及当时的东盟六国在澳大利亚首都堪培拉举行APEC首届部长级会议，标志APEC正式成立。","From November 5 to 7, 1989, Australia, the United States, Japan, the Republic of Korea, New Zealand, Canada, and the then six ASEAN countries held the first APEC Ministerial Meeting in Canberra, the capital of Australia, marking the official establishment of APEC."],[0,"3. APEC的主要宗旨是什么？","3. What is the primary goal of APEC?"],[0,"支持亚太区域经济可持续增长和繁荣，建设活力和谐的亚太大家庭，捍卫自由开放的贸易和投资，加速区域经济一体化进程，鼓励经济技术合作，保障人民安全，促进建设良好和可持续的商业环境。","The primary goal of APEC is to support sustainable economic growth and prosperity in the Asia-Pacific region. APEC is united in a drive to build a dynamic and harmonious Asia-Pacific community by championing free and open trade and investment, promoting and accelerating regional economic integration, encouraging economic and technical cooperation, enhancing human security, and facilitating a favorable and sustainable business environment."],[0,"4. APEC为什么重要？","4. Why is APEC important?"],[0,"APEC成员投资总额约占全球70%","APEC member economies account for approximately 70% of global investment"],[0,"经济总量约占全球60%","60% of global GDP"],[0,"贸易总量占全球50%","50% of global trade"],[0,"人口总量约占全球40%","40% of the world’s population"],[0,"5. APEC现有成员和观察员分别有哪些？","5. Who are the current member economies and observers of APEC?"],[0,"APEC现有21个成员，分别是澳大利亚、文莱、加拿大、智利、中国、中国香港、印度尼西亚、日本、韩国、墨西哥、马来西亚、新西兰、巴布亚新几内亚、秘鲁、菲律宾、俄罗斯、新加坡、中国台北、泰国、美国和越南。此外，APEC还有3个观察员，分别是东盟秘书处、太平洋经济合作理事会、太平洋岛国论坛秘书处。","APEC currently has 21 member economies: Australia; Brunei Darussalam; Canada; Chile; the People's Republic of China; Hong Kong, China; Indonesia; Japan; the Republic of Korea; Mexico; Malaysia; New Zealand; Papua New Guinea; Peru; the Philippines; Russia; Singapore; Chinese Taipei; Thailand; the United States; and Viet Nam. It also has three official observers: the ASEAN Secretariat, the Pacific Economic Cooperation Council, and the Pacific Islands Forum Secretariat."],[0,"6. APEC秘书处是如何设立的？","6. How was the APEC Secretariat established?"],[0,"APEC秘书处于1993年1月在新加坡设立，为APEC各层次的活动提供支持与服务。秘书处负责人为执行主任，2010年起设固定任期，任期三年。现任执行主任为爱德华多·佩德罗萨（Eduardo Pedrosa，菲律宾籍），于2025年1月就任，任期至2027年12月31日。","The APEC Secretariat was established in Singapore in January 1993 to provide support and services for APEC activities at all levels. The head of the Secretariat is the Executive Director, and since 2010, the position has had a fixed term of three years. The current Executive Director is Eduardo Pedrosa (Philippine nationality), who took office in January 2025 for a term ending on December 31, 2027."],[0,"7. APEC会议为什么是“非正式”的?","7. Why are APEC meetings described as “informal”?"],[0,"会议采取自主自愿和协商一致的合作方式。所作决定须经各成员一致同意。会议成果文件不具法律约束力，但各成员在政治上和道义上有责任尽力予以实施。","The meetings operate on the basis of voluntary participation and consensus-building. Decisions must be made with the agreement of all members. The resulting documents are not legally binding, but members have a political and moral responsibility to implement them to the best of their ability."],[0,"8. APEC会议的倡议成果都有哪些类型?","8. What types of outcomes or initiatives result from APEC meetings?"],[0,"包括“经济体领导人宣言”“部长级会议联合声明”等，以及具体倡议、行动计划和工作组报告。","These include the \"Economic Leaders' Declaration,\" \"Joint Ministerial Statements,\" as well as specific initiatives, action plans, and working group reports."]]},{"cid":"b1-p1-n2","title":"中国与APEC篇","blocks":[[2,"中国与APEC篇","China and APEC"],[0,"1. 中国是哪一年加入APEC的？","1. In which year did China join APEC?"],[0,"1991年11月，中国以主权国家身份，中国台北和香港（1997年7月1日起改为“中国香港”）以地区经济体名义，正式加入亚太经合组织。","China joined APEC in November 1991, along with Hong Kong and Chinese Taipei. China joined as a sovereign state, while Hong Kong (renamed \"Hong Kong, China\" since July 1, 1997) and Chinese Taipei joined as regional economies."],[0,"2. 中国加入APEC以来，担任过几次东道主？","2. Since joining APEC, how many times has China served as the host?"],[0,"2026年是第三次，前两次为 2001年上海、2014年北京。","2026 marks the third time. After Shanghai in 2001 and Beijing in 2014."]]},{"cid":"b1-p1-n3","title":"APEC深圳篇","blocks":[[2,"APEC深圳篇","APEC Shenzhen"],[0,"1. 2026年APEC领导人非正式会议将在哪个城市举行？","1. Where will the 2026 APEC Economic Leaders' Meeting be held?"],[0,"深圳","Shenzhen"],[0,"2. 2026年APEC领导人非正式会议将在什么时候举行？","2. When will the 2026 APEC Economic Leaders' Meeting be held?"],[0,"2026年11月18-19日，会议将同步举办多项配套活动。","It will be held on November 18-19, 2026, and the conference will concurrently host multiple supporting events."],[0,"3. 2026 APEC“中国年”会标有什么含义？","3. What is the meaning of the APEC China 2026 logo?"],[0,"会标主体由21根交织的羽翼共同构成展翅高飞的大鹏的形态，寓意着乘大势、共翱翔。会标生动阐释了APEC的精神，21个成员各具特色，但又相互依存、相互合作，也象征着亚太经济体携手构建亚太共同体的深远意义。","The logo features 21 interwoven feathers that take the form of a great roc spreading its wings and soaring into the sky, symbolizing the idea of seizing the momentum and flying together. The logo vividly captures the spirit of APEC — the 21 members, each unique in their own way, are mutually dependent and cooperative. It also signifies the profound meaning of Asia-Pacific economies working hand in hand to build an Asia-Pacific community."],[0,"4. 2026年APEC会议的主题是什么？","4. What is the theme of APEC 2026?"],[0,"会议主题为“构建亚太共同体、促进共同繁荣”，聚焦“开放、创新、合作”三大优先领域。","Themed \"Building an Asia-Pacific Community to Prosper Together,\" APEC 2026 will focus on three priorities: openness, innovation, and cooperation."]]},{"cid":"b1-p1-n4","title":"APEC经贸篇","blocks":[[2,"APEC经贸篇","APEC Economy and Trade"],[0,"1. APEC商务旅行卡是什么？","1. What is the APEC Business Travel Card?"],[0,"APEC商务旅行卡（以下简称“旅行卡”）是亚太经合组织为促进亚太地区贸易投资便利化所作的一项多边签证便利政策。申请人一次申办，五年有效，可多次入境，每次入境至少可停留60天。各经济体普遍为持卡人提供出入境通关便利。","The APEC Business Travel Card is a multilateral visa facilitation policy launched by APEC to boost trade and investment facilitation in the Asia-Pacific region. Applicants only need to submit one application for a five-year valid card that allows multiple entries, with a minimum stay of 60 days for each entry. All member economies generally provide entry and exit customs clearance conveniences for cardholders."],[0,"2. 使用APEC商务旅行卡可用于哪些活动？","2. What activities can the APEC Business Travel Card be used for?"],[0,"原则上只适用于以商务活动为目的的国际旅行，不能用于旅游、探亲、访友、看病等非商务目的的活动。","In principle, the card is intended for international business travel only and not for non-business purposes such as tourism, visiting family or friends, or medical purposes."]]},{"cid":"b1-part-2","title":"Part 2 深圳城市简介","blocks":[[1,"Part 2 深圳城市简介","Part 2 Introduction to Shenzhen"],[0,"深圳，总面积1997.47平方公里，常住人口1798.95万人，平均年龄32.5岁。","Shenzhen covers a total area of 1,997.47 square kilometers and has a permanent population of 17.9895 million, with an average age of 32.5 years."],[0,"深圳2025年经济总量达38731.8亿元，位居全国第三，2025年进出口总额达4.55万亿元人民币，居中国内地城市首位。","In 2025, Shenzhen's total economic output reached 3.87318 trillion yuan, ranking third in the country. In 2025, the city's total import and export volume reached 4.55 trillion yuan, the highest among all cities on the Chinese mainland."],[0,"深圳拥有国家高新技术企业2.5万家，国家级专精特新“小巨人”企业1333家，数量居全国城市首位。","Shenzhen is home to 25,000 national high-tech enterprises and 1,333 national-level specialized and sophisticated \"little giant\" enterprises—the highest number among Chinese cities."],[0,"深圳的PCT国际专利申请量连续22年居中国城市首位。","The city has topped all Chinese cities in PCT international patent applications for 22 consecutive years."],[0,"深圳拥有全球第四大集装箱港、亚洲最大综合性口岸、中国第三大航空港（按货邮吞吐量），与全球100多个国家和地区的300多个港口有贸易往来。","Shenzhen boasts the world's fourth-largest container port, Asia's largest comprehensive land port, and China's third-largest aviation hub (by cargo and mail throughput). It maintains trade links with over 300 ports from more than 100 countries and regions worldwide."],[0,"深圳机场国际及地区客货运航线达104条，国际及地区旅客量全年突破630万人次。","Shenzhen Airport operates 104 international and regional passenger and cargo routes, with annual passenger throughput exceeding 6.3 million."],[0,"深圳港集装箱吞吐量历史性突破3500万标箱，外贸集装箱吞吐量居大湾区港口首位。","The container throughput of Shenzhen Port has reached a historic high of over 35 million TEUs, ranking first among ports in the Greater Bay Area."],[0,"深圳森林覆盖率约40%，拥有1300多座公园，200公里沿着山脊线的鲲鹏径、260.5公里海岸线，拥有全球首个红树林保护跨国合作平台——国际红树林中心。","With an approximately 40% forest coverage rate, the city features more than 1,300 parks, a 200-kilometer Kunpeng Trail along mountain ridgelines, and a 260.5-kilometer coastline. It also hosts the world's first international cooperation platform for mangrove conservation — the International Mangrove Center."],[0,"深圳实现公交车、出租车100%纯电动化，万元GDP能耗、水耗、碳排放强度达到国际先进水平。","The city has achieved 100% electrification of its public buses and taxis. Its energy consumption, water consumption, and carbon emission intensity per 10,000 yuan of GDP have reached internationally advanced levels."]]},{"cid":"b1-p3-n1-1","title":"1.机场","blocks":[[1,"Part 3 公共服务行业人员常用英文表达","Part 3 Common English Expressions for Public Service Personnel"],[2,"交通出行篇","Transportation"],[3,"1.机场","Airport"],[4,"（1）值机指引","Check-In"],[0,"需要我帮您办理值机吗？请出示一下您的护照。","Would you like me to check you in? May I see your passport, please?"],[0,"您的航班在前面国际航班柜台办理值机。您也可以使用自助值机设备，会更快。","You can check in for your flight at the international counter just ahead. You can also use the self-service check-in for a quicker process."],[0,"请扫描您的护照，先核对下您的信息和航班，再选座，然后打印登机牌。","Please scan your passport. First, check your details and flight information, then select your seat and print your boarding pass."],[4,"（2）行李托运","Luggage Drop-off"],[0,"您有行李需要托运吗？您可以在值机柜台办理托运，也可以使用自助行李托运机。","Do you have any luggage to check in? You can check them in at the counter, or use the self-service luggage machine."],[0,"请把行李箱放在传送带上，切记贵重物品、充电宝、锂电池务必随身携带，不能托运。","Please put your luggage on the conveyor belt. Just a reminder: keep your valuables, power banks, and lithium batteries with you at all times. They cannot be checked in."],[0,"请勿放置超过100毫升的液体、尖锐物品或易燃易爆品。","Please do not pack liquids over 100 milliliters, sharp objects, or flammable and explosive items."],[0,"国际航班免费托运行李额通常是23公斤。","The free checked luggage allowance for international flights is usually 23 kilograms."],[4,"（3）安检指引","Security Check"],[0,"请从包里拿出笔记本电脑、平板、充电宝和所有液体物品。","Please take out your laptop, tablet, power bank, and all liquids from your bag."],[0,"每个液体容器都必须小于100毫升。","Each container of liquid must be less than 100 milliliters."],[0,"请把所有随身物品、手机、钥匙和金属饰品放进塑料托盘里。","Please put all your personal belongings, phone, keys, and metal items in the plastic tray."],[0,"通过安检门，检查结束后取回物品，您就可以前往登机口了。","Please walk through the security gate. Once the check is finished, collect your belongings, and you can head to the boarding gate."],[4,"（4）登机指引","Boarding"],[0,"请出示您的登机牌和护照，我帮您核对。","Please show your boarding pass and passport, and I'll check them for you."],[0,"这是您的登机口，现在已经开始检票登机了。","Your boarding gate is right here. Boarding has already started."],[0,"请提前准备好护照和登机牌，感谢配合。","Please have your passport and boarding pass ready. Thank you for your cooperation."],[0,"您的随身行李符合规格，可以携带。","Your carry-on luggage is within the size limit, so you can take it with you."],[4,"（5）延误通知","Delay Notification"],[0,"很抱歉通知您，您的航班延误了，新的预计起飞时间需要等机场通知。","I'm sorry to inform you that your flight has been delayed. We are waiting for the airport to announce the new departure time."],[0,"请您出示登机牌和护照，我为您查询航班状态，并及时向您更新相关信息。","Could I see your boarding pass and passport? I'll check the flight status for you and keep you updated."],[0,"延误期间，我们在登机口附近的服务台准备了免费茶点。","During the delay, we've prepared complimentary snacks and drinks at the service desk near the boarding gate."],[0,"如果延误时间未超过8小时，机场不提供酒店住宿服务，但会提供免费餐食。","If the delay is less than 8 hours, the airport does not provide hotel accommodation, but free meals will be offered."],[4,"（6）改签指引","Rebooking"],[0,"您的航班延误时间较长，可以办理改签。","Your flight has been delayed for quite a while, and you can change to another flight."],[0,"请按照现场指引牌前往改签柜台办理。","Please follow the signs to the rebooking counter to get it processed."],[0,"目前柜台办理可能较为拥挤，您也可以选择通过自助设备办理改签。","The counter might be a bit crowded right now. You can also use the self-service kiosk to change your flight."],[0,"我带您到最近的自助服务机，请按照屏幕提示操作。","Let me take you to the nearest kiosk. Just follow the instructions on the screen."],[0,"行李将由系统自动转运至改签后的航班，您无需额外操作。","Your luggage will be automatically transferred to the new flight, so you don’t need to do anything else."]]},{"cid":"b1-p3-n1-2","title":"2.高铁站","blocks":[[3,"2.高铁站","High-Speed Railway Station"],[4,"（1）行李协助","Luggage Assistance"],[0,"请把所有行李放在安检传送带上。","Please put all your luggage on the security conveyor belt."],[0,"请通过安检门，由工作人员进行安检。","Please walk through the security gate for a check by our staff."],[0,"安检结束后，请取回所有物品，前往检票区域候车。","After the check, please collect all your belongings and head to the waiting area to wait for your train."],[4,"（2）检票指引","Ticket Check"],[0,"请问您要检票乘车吗？请出示您的护照和电子客票/购票信息。","Do you need to have your ticket checked to board the train? Please show me your passport and e-ticket or booking information."],[0,"有自助闸机检票和人工检票口。您可以直接走人工通道，更方便。","There are self-service gates for ticket checking and manned ticket checking counters. You can go through the staffed channel directly for more convenience."],[0,"您也可以用自助闸机检票。请将护照放在扫描区感应，等待闸机开启后快速通过。","You can use the self-service gates for ticket checking. Please place your passport in the scanning area and wait for the gate to open. And then please quickly pass through."],[0,"检票完成后，请前往对应站台的候车区等候。","After ticket checking, please proceed to the waiting area on the corresponding platform."],[0,"您可以查看大屏幕提示或车票信息，上面会明确标注站台号。","You can check the large information screens or your ticket. The platform number is clearly marked."],[0,"登车前请核对车厢号和座位号，避免上错车厢。","Before boarding, please double-check the carriage number and seat number to avoid getting on the wrong carriage."]]},{"cid":"b1-p3-n1-3","title":"3.地铁","blocks":[[3,"3.地铁","Metro"],[4,"（1）安检指引","Security Check"],[0,"请问需要我协助您吗？我陪您办理相关手续。我们先前往安检通道。","Do you need any assistance? I will walk you through the check-in process. Let's head to the security checkpoint first."],[0,"请把您所有的行李放到传送带上进行安检。","Please place all your luggage on the conveyor belt for security screening."],[0,"请通过安检门，安检结束后取回行李，我带您去买票。","Please go through the security gate. After you claim your luggage from security, I'll take you to buy tickets."],[4,"（2）购票指引","Ticket Purchase"],[0,"自助售票机有英文界面，操作很简单。","The self-service ticket machines are user-friendly and offer an English interface."],[0,"请点击屏幕的“English”-选择路线-选择目的地-确认票价-完成支付。","Please click \"English\" on
