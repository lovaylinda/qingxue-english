,"请稍等，我导航一下目的地。","Just a moment, I'll set the navigation to our destination."],[0,"请坐稳，大概20分钟。","Please sit back and relax. It's about a 20-minute ride."],[4,"（3）付费指引","Payment"],[0,"我们全程打表计费，没有额外费用。","We use the taximeter to calculate the fare for the entire journey with no extra charges."],[0,"我们支持现金、微信、支付宝和境外信用卡支付。","Cash, WeChat Pay, Alipay, and overseas credit cards are all accepted."],[0,"计价器会显示费用，扫这个二维码就能支付。","The fare is shown on the meter. You can just scan this QR code to pay."],[4,"（4）下车提醒","Drop-off"],[0,"您的目的地已到达。请稍等，我帮您拿行李。","We have arrived at your destination. Just a moment, let me help you with your luggage."],[0,"请核对您的行李，带好随身物品。","Please check your luggage and make sure you have all your belongings with you."]]},{"cid":"b1-p3-n1-6","title":"6.轮渡/游船","blocks":[[3,"6.轮渡/游船","Ferry / Sightseeing Boat"],[4,"（1）购票指引","Ticket Purchase"],[0,"打扰一下，请问您需要购票乘船吗？","Excuse me, would you like to buy tickets for the ferry ride?"],[0,"您可以在人工售票窗口购票，也可以用手机扫二维码，在招商蛇口/航运小程序线上购票，更快捷。","You can purchase tickets at the manned ticket counter, or for a quicker option, scan the QR code with your phone to buy tickets online through the China Merchants Shekou/Shipping mini-program on WeChat."],[0,"下一班船15分钟后出发，全程约60分钟，沿途可以看到深圳湾大桥、蛇口港等地标。","The next ferry will depart in 15 minutes. The journey takes about 60 minutes, and you can see landmarks such as the Shenzhen Bay Bridge and Shekou Port along the way."],[0,"请您出示证件，线上支付或现金均可，请保管好船票/电子票，登船需要核验。","Please show me your passport. You can pay either online or with cash. Make sure to keep your ferry ticket/e-ticket safe, as it’ll be checked when boarding."],[4,"（2）验票/登船指引","Ticket Check / Boarding"],[0,"请随我到3号登船口等候，开船前5分钟开始检票，请提前准备好船票和证件。","Please follow me to Gate 3 for boarding. Tickets will be checked 5 minutes before departure. Please have your ticket and passport ready in advance."],[0,"登船前需要简单安检，请您配合完成。感谢您的理解。","A simple security check is required before boarding. Your cooperation is appreciated. Thank you for your understanding."],[0,"您可以在甲板上拍照，但请排队有序登船，注意脚下台阶，船体湿滑请小心行走。","You can take photos on the deck, but please line up and board in an orderly manner. Watch your step as you board. The deck might be slippery, so please walk carefully."],[4,"（3）游船提示","Boat Tour Reminders"],[0,"欢迎乘坐深圳观光游船！为了保障您的安全，请注意以下安全提示。","Welcome aboard the Shenzhen sightseeing boat! For your safety, please pay attention to the following safety reminders."],[0,"全程禁止吸烟，船舱内、甲板上均为无烟区域。","Smoking is prohibited throughout the journey. Both the cabin and the deck are smoke-free zones."],[0,"航行途中请勿倚靠、翻越船舷栏杆。","Please do not lean on or climb over the railings along the ship’s side during the voyage."],[0,"船只转弯、颠簸时，请抓好扶手，避免摔倒。","When the ship turns or rocks, please hold on to the handrails to avoid falling."],[4,"（4）下船指引","Disembarkation"],[0,"游船即将抵达码头，请带好随身物品。","The sightseeing boat is about to arrive at the dock. Please take all your belongings with you."],[0,"请等船身停稳、跳板固定后再起身离船，注意脚下安全，依次下船。","Please wait until the ship has come to a complete stop and the gangplank is secured. Please watch your step and leave the boat in an orderly manner."]]},{"cid":"b1-p3-n2-1","title":"1.入住登记","blocks":[[2,"酒店住宿篇","Hotel Accommodation"],[3,"1.入住登记","Check-In"],[4,"（1）确认预定","Reservation Confirmation"],[0,"欢迎光临！请问需要办理入住吗？","Welcome! Would you like to check in?"],[0,"我查一下您的预定：您预定了一间大床房，入住3晚，对吗？","Let me check your reservation. You've booked a king-size bed room for three nights, is that correct?"],[4,"（2）证件与登记","Passport & Registration"],[0,"根据酒店规定，入住需要登记有效身份证件，请您出示一下护照。","According to hotel regulations, valid identification is required for check-in. Please show me your passport."],[0,"谢谢您的配合。我马上帮您完成登记。","Thank you for your cooperation. I'll complete check-in for you right away."],[0,"您的护照已登记完成，请收好您的证件。请您核对下入住信息：姓名、房型和入住时长。","Your passport has been registered. Please keep your passport safe. Please confirm your check-in information: name, room type, and length of stay."],[4,"（3）押金与支付","Deposit & Payment"],[0,"接下来我为您办理房卡和押金手续。","Next, I'll handle the procedures for your room key and deposit."],[0,"押金为500元人民币，用于抵扣房费以外的费用。","The deposit is 500 RMB, reserved to cover any charges other than the room rate."],[0,"我们支持多种支付方式：信用卡预授权、微信/支付宝支付，以及境外银行卡。","We accept multiple payment methods: credit card pre-authorization, WeChat or Alipay, and international bank cards."],[0,"预授权最便捷，退房时无额外消费会自动退回。","Pre-authorization is the most convenient option. It will be automatically released when you check out if there are no extra charges."],[0,"请您刷卡/插卡，输入密码，在此签名。","Please swipe or insert your card, enter your PIN, and sign here."],[0,"预授权已办理成功，这是您的银行卡和收据，请收好。","Your pre-authorization has been processed. Here are your bank card and receipt, please keep them safe."],[4,"（4）房卡与入住须知","Room Key & Guest Information"],[0,"如无额外消费，押金会在退房后3-5个工作日退回您的银行卡。","If there are no additional charges, the deposit will be refunded to your bank card within 3-5 business days after check-out."],[0,"这是您的房卡，请收好。","Here's your room key. Please keep it safe."],[4,"（5）用餐指引","Dining"],[0,"早餐可以在一楼西餐厅享用，午餐在二楼中餐厅，提供粤菜及深圳本地特色小吃。","Breakfast is served in the Western restaurant on the first floor. For lunch, the Chinese restaurant on the second floor serves Cantonese cuisine and local Shenzhen specialties."],[0,"酒店还有24小时送餐服务，拨打内线可以点餐，直接送至房间。","We have 24-hour room service available. Just dial the internal line to order, and it will be delivered straight to your room."],[0,"请问还有其他可以帮您的吗？入住期间有任何需求，欢迎随时联系我们。","Is there anything else I can help you with? If you need anything during your stay, please feel free to contact us at any time."]]},{"cid":"b1-p3-n2-2","title":"2.客房服务","blocks":[[3,"2.客房服务","Room Services"],[4,"（1）打扫服务","Room Cleaning Service"],[0,"客房服务，请问可以进来打扫房间吗？","Housekeeping. May I come in to clean the room?"],[0,"我会尽快打扫，不会耽误您太久。","I'll clean it up as quickly as possible and won't take up too much of your time."],[0,"我来为您打扫房间，请问现在方便吗？","I’m here to clean your room. Is now a convenient time?"],[0,"等您方便时，请呼叫客房服务，我再来为您打扫房间。","Please call housekeeping when it's convenient for you, and I'll come back to clean the room."],[4,"（2）物品配送与报修","Item Delivery & Maintenance Request"],[0,"我马上把一双拖鞋和两瓶矿泉水给您送到房间。","I’ll bring a pair of slippers and two bottles of mineral water to your room right away."],[0,"非常抱歉给您带来不便！我马上上报工程部，维修人员10分钟内就会过来检修。","I'm so sorry for the inconvenience! I'll report to the engineering department immediately, and a maintenance worker will come to check it within 10 minutes."],[0,"空调已经修好了，您试试看，如果还有其他问题，请随时联系我们。","The air conditioner is fixed now. Would you like to give it a try? If there are any other issues, please feel free to contact us."],[0,"我马上帮您重新设置一下网络。Wi-Fi 已经恢复正常了，您可以试试。","I'll help you reset the internet right away. The Wi-Fi is back to normal now, you can give it a try."],[0,"我马上过去为您处理，给您换一盏新的床头灯。","I'll head over right away to handle it and replace the bedside lamp for you."],[4,"（3）叫醒服务","Wake-up Call Service"],[0,"请问您需要几点的叫醒服务？","May I know what time you'd like the wake-up call service?"],[0,"已帮您记录，我们会准时致电房间。如果需要我们会隔5分钟为您二次叫醒。","We've noted it down and will call your room on time. If needed, we can also provide a second wake-up call five minutes later."],[4,"（4）送洗服务","Laundry Service"],[0,"我们会按时收取您的衣服。","We'll collect your clothes as scheduled."],[0,"我们提供干洗和水洗服务。上午10点前收取，当晚9点前送回。","We offer dry cleaning and laundry services. Items collected before 10 AM will be returned by 9 PM the same day."],[0,"您可以根据房间送洗服务说明操作。","You can follow the laundry service instructions in your room."]]},{"cid":"b1-p3-n2-3","title":"3.礼宾服务","blocks":[[3,"3.礼宾服务","Concierge Services"],[4,"（1）行李协助","Luggage Assistance"],[0,"欢迎入住酒店，我来帮您拿行李。","Welcome to the hotel. Let me help you with your luggage."],[0,"这边请，我带您到前台办理入住手续。","This way, please. I'll take you to the front desk for check-in."],[0,"您在这里办理入住即可，我帮您看好行李。","You can proceed with the check-in here, and I'll keep an eye on your luggage for you."],[0,"完成入住后，行李会送到您的房间。","After you've completed the check-in, your luggage will be delivered to your room."],[4,"（2）交通指引","Transportation Guidance"],[0,"深圳的交通非常方便。您可以优先选择地铁，换乘便捷、不用出站，而且酒店附近就有地铁站。","The transportation in Shenzhen is super convenient. Subway could be your first choice. It's easy to transfer between lines without needing to exit the station, and there's a subway station right near our hotel."],[0,"酒店大堂门口也有出租车，打表计费，没有额外费用。","There are also taxis waiting right outside the hotel lobby. They charge by the meter with no extra fees."],[0,"您也可以用手机预约网约车，大多是新能源电动车，安静又环保。","You can also use your phone to book a ride-hailing car. Most of them are electric vehicles, so they're quiet and eco-friendly."],[4,"（3）周边咨询回复","Local Information & Inquiries"],[0,"酒店周边本地美食和商场特别多，我给您简单介绍一下。","There are plenty of local restaurants and shopping malls around the hotel. Let me give you a quick introduction."],[0,"本地美食有粤菜馆、海鲜店和深圳特色小吃，特别推荐粤式点心、烧鹅和海鲜粥，都是这边的招牌。","For local food, we have Cantonese restaurants, seafood places, and local Shenzhen specialties. I highly recommend the Cantonese dim sum, roasted goose, and seafood congee. They are all signature dishes here."],[0,"购物可以去深圳湾万象城，是大型高端商场，国际品牌和本土店铺都很齐全。","For shopping, you can go to MixC Shenzhen Bay, which is a large and upscale shopping mall with a great selection of international brands and local stores."],[0,"酒店旁边就是深圳湾公园，散步、看海、远眺香港都特别舒服。","Right next to the hotel is Shenzhen Bay Park. It's super relaxing for a stroll, enjoying the sea view, or catching a glimpse of Hong Kong in the distance."]]},{"cid":"b1-p3-n2-4","title":"4.退房结账","blocks":[[3,"4.退房结账","Check-out & Billing"],[0,"请出示您的房卡，并告知房号。","Your room key and room number, please."],[0,"我先回收房卡，同时通知客房部快速查房，大约3分钟。","I'll take back your room key first and notify the Housekeeping Department to check the room quickly. It'll take about 3 minutes."],[0,"查房已完成，这是您的账单明细，请您核对。","The room check is complete. Here is your bill breakdown. Please have a look."],[0,"请问您选择哪种支付方式？","How would you like to pay?"],[0,"请您刷卡/插卡，输入密码或在此签名。支付成功，这是您的支付小票。","Please swipe or insert your card, then enter your PIN or sign here. Payment successful. Here is your receipt."],[0,"您的押金在3-5个工作日内自动原路退回您的信用卡。","Your deposit will be automatically refunded to your credit card within 3-5 business days."],[0,"您的退房手续已办理完毕。","Your check-out is all set."]]},{"cid":"b1-p3-n2-5","title":"5.应急处理","blocks":[[3,"5.应急处理","Emergency Response"],[4,"（1）物品遗失","Lost Item"],[0,"我马上帮您在大堂、前台和电梯区域查找。","I'll help you check around the lobby, front desk, and elevator areas right away."],[0,"酒店有免费备用充电器（苹果/安卓），我先给您拿一个应急使用。","The hotel has free backup chargers (for both Apple and Android devices). Let me get you one for emergency use."],[4,"（2）医疗救助","Medical Assistance"],[0,"您先在原地慢慢坐下休息，我马上联系现场具备基础医疗知识的工作人员过来查看。","Please take a seat and rest right here. I'll contact a staff member with first aid training to come and check on you immediately."],[0,"如果需要，我们也可以协助您前往附近的医院。","If necessary, we can also assist you in getting to a nearby hospital."],[0,"我马上联系工作人员，他们会在5分钟内到达。","I'll contact staff right away. They will be here within 5 minutes."]]},{"cid":"b1-p3-n3-1","title":"1.导购服务","blocks":[[2,"商业零售篇","Retail & Commercial Services"],[3,"1.导购服务","Shopping Assistance"],[4,"（1）基础导购","Basic Shopping Guidance"],[0,"欢迎光临！请问有什么可以帮您吗？","Welcome! How can I help you today?"],[0,"我们是综合零售店，商品品类很齐全。日用品在进门左侧的货架上，洗护用品和旅行用品都在这。","There is a wide variety of goods in our retail store. Daily necessities are on the shelves to the left of the entrance, including toiletries and travel essentials."],[0,"数码配件区在右侧柜台展示区，充电器、充电宝、数据线和耳机都有。","Digital accessories are on the right-hand display counter. There are chargers, power banks, data cables, and earphones."],[0,"所有商品都有中英双语标价。我们支持多种支付方式。请放心购买。","All items have prices listed in both Chinese and English. Multiple payment methods are supported. Please feel free to take a look around."],[0,"我们店里现在正在做专场促销，需要我为您介绍一下吗？","We have a special promotion here. Would you like more information?"],[0,"我给您介绍一下：全场服饰都可以享受8 折优惠。","Sure, here it is: all clothing is 20% off."],[0,"而且本周是购物节，境外游客还能再享 9 折，优惠只限于本周，非常划算。","Plus, this is our shopping festival week, and overseas tourists can enjoy an additional 10% off! This offer is only valid this week. It’s a great deal."],[0,"单笔消费满 500 元减 50 元，而且可以和折扣叠加使用。","You get 50 yuan off for every 500 yuan spent in a single transaction, and this can be combined with other discounts."]]},{"cid":"b1-p3-n3-2","title":"2.无人零售","blocks":[[3,"2.无人零售","Unmanned Retail"],[0,"深圳有很多无人零售商店，非常方便。","There are many unmanned retail stores in Shenzhen, which are very convenient."],[0,"您可以扫码进门-自选商品-扫码付款-直接离开。","You can scan the code to enter, pick out what you want, scan the code to pay, and walk out."],[0,"店内也有自助收银台，自行扫商品，微信/支付宝/境外信用卡都可以支付，不用排队。","We also have self-checkout counters inside the store. You can scan the items yourself and pay with WeChat/Alipay/credit cards. No need to queue."],[0,"需要的话，我可以协助您操作。","I can help you if needed."]]},{"cid":"b1-p3-n3-3","title":"3.退税指引","blocks":[[3,"3.退税指引","Tax Refund Guidance"],[4,"（1）退税流程","Tax Refund Procedure"],[0,"深圳有支持“即买即退”的商店，可以现场退税。","There are stores in Shenzhen that support \"Refund-Upon-Purchase\" service, where you can get your tax refund on the spot."],[0,"凭借发票、退税申请单，填写同意书后出示护照和信用卡（预授权担保）即可。","Present your invoice, tax refund application form, and a completed agreement form, along with your passport and credit card (pre-authorization guarantee)."],[0,"商店有“Tax Free”或退税标识的店铺，都可以办理退税。","Stores displaying \"Tax Free\" or a tax refund sign offer tax refund services."],[0,"离境时仍需到海关验核（17天内离境，商品未拆封），向海关出示退税物品、退税申请单、发票、护照。海关核对无误后会在申请单上盖章。","Upon departure, you still need to go to customs for verification (departure within 17 days, goods unopened and unused). Present the tax-refundable items, tax refund application form, invoice, and passport to customs. After verification, customs will stamp the application form."],[0,"需托运的商品，请先由海关验核，再办理托运。","For goods that need to be checked in, please have them cleared by customs first."],[0,"如未按时离境或未验核，退税金额将从信用卡中扣回。","If you do not depart on time or fail to verify, the refund amount will be deducted from your credit card."],[4,"（2）退税口岸","Tax Refund Ports"],[0,"深圳有6个口岸可办离境退税，深圳湾口岸、福田口岸、罗湖口岸、文锦渡口岸、蛇口邮轮母港和深圳宝安国际机场。营业时间为：9点至21点。","There are six ports in Shenzhen that offer tax refunds for departing tourists: Shenzhen Bay Port, Futian Port, Luohu Port, Wenjindu Port, Shekou Cruise Homeport, and Shenzhen Bao’an International Airport. The service hours are from 9:00 AM to 9:00 PM."],[4,"（3）退税提示","Tax Refund Tips"],[0,"免税商品、已开封/已使用商品、禁止/限制出境物品不能退税。","Duty-free, unpacked or used goods, and prohibited or restricted items are ineligible for tax refunds."],[0,"现金退税当场可办结；信用卡退税大约3-15个工作日。","Cash refunds can be processed on the spot; refunds to your credit card take about 3-15 business days."],[0,"部分退税机构支持支付宝/微信退税，具体详情请咨询现场柜台。","Some tax refund agencies support Alipay and WeChat Pay refunds. Please check with the on-site counter for details."],[4,"（4）退税查询","Tax Refund Inquiry"],[0,"微信搜“i口岸”-离境退税-跳转“兴税通”，可预约、查商店、查口岸、看进度。","Search for \"i Port\" on WeChat - Departure Tax Refund – you'll be directed to \"GHBank Tax Refund Assistant\" (a tax service platform). You can make an appointment, check participating stores, ports of departure, and refund status."]]},{"cid":"b1-p3-n3-4","title":"4.包装/配送服务","blocks":[[3,"4.包装/配送服务","Packaging & Delivery Service"],[4,"（1）包装服务","Packaging"],[0,"您的商品已经准备好了，需要帮您包装吗？","Your goods are ready. Would you like us to pack them for you?"],[0,"我们有专门的礼品包装，易碎品也会做好防护。","We offer special gift wrapping, and fragile items will be well protected."],[0,"礼品包装和基础防震包装都是免费的，只有超大件需要木箱打包时才会收少量费用。","Gift-wrapping and basic shockproof packaging are free. A small fee is only charged for oversized items which require a wooden crate."],[0,"让您久等了，您的商品已经包装好了，请拿好。","Sorry to keep you waiting. It is packed. Here you are."],[4,"（2）配送服务","Delivery"],[0,"如果您不方便带着，我们能寄到您住的酒店。","If it's inconvenient for you to carry them, we can send them to your hotel."],[0,"我们提供同城配送、国内邮寄，也可以办理国际快递。","We offer same-city delivery, domestic delivery, and international express."]]},{"cid":"b1-p3-n3-5","title":"5.售后退换/维修服务","blocks":[[3,"5.售后退换/维修服务","After-sales Return, Exchange & Repair Service"],[0,"服饰凭原始购物小票，未使用、无损坏、吊牌完整可以7天无理由退换。","We offer a 7-day hassle-free returns policy. Just bring the original receipt and make sure the clothing is unused, undamaged, and has tags attached."],[0,"数码产品15天内出现非人为质量故障，支持免费更换或维修。","For digital products, if there's a non-human-caused quality defect within 15 days, we offer a free replacement or repair."],[0,"关于充电器质量问题，我们有两种方案：当场换新或维修服务。","If there's a quality issue with the charger, you can either get a new one on the spot or have it repaired."],[0,"非常抱歉给您带来不便！我马上为您更换全新的充电器。","We're very sorry for the inconvenience! I'll replace your charger with a brand new one right away."]]},{"cid":"b1-p3-n4-1","title":"1.入园核验","blocks":[[2,"文旅服务篇","Culture & Tourism Services"],[3,"1.入园核验","Entry Verification"],[4,"（1）购票与预约","Ticket Purchase & Reservation"],[0,"请问您需要购票或入园指引吗？","Hi there! Do you need help with tickets or getting into the park?"],[0,"深圳所有景区都需要实名制预约，也支持凭护照现场购票，操作很便捷。","All scenic spots in Shenzhen require real-name reservations, and they also support on-site ticket purchase with a passport — it's quick and easy."],[0,"您先扫这个二维码进入官方小程序，选择今天的入园时段。","Please scan this QR code to open the official mini-program and select your entry time slot for today."],[0,"然后填写护照号码，选择成人票，用微信、支付宝或信用卡完成支付，就会生成电子票二维码。","Then fill in your passport number, select an adult ticket, and pay with WeChat, Alipay, or credit card. You'll get an e-ticket QR code right away."],[0,"我带您到前面的闸机口验票安检，请这边走。","I'll take you to the gate ahead for ticket verification and security check. This way, please."],[4,"（2）验票与入园须知","Ticket Check & Entry Information"],[0,"请您打开电子票的二维码，同时出示护照，谢谢您的配合。","Please show your e-ticket QR code and your passport. Thank you for your cooperation."],[0,"请将二维码对准扫码器，闸机会自动开启。","Please scan the QR code and the gate will open."],[0,"您已验票通过。入园前，我为您介绍相关游览须知，方便您安全、顺利游览。","You're all set! Before you go in, let me give you a quick rundown to help you enjoy your visit."],[0,"请您先浏览入园须知，留意闭园时间，园内提供免费讲解服务，有任何需求可随时询问工作人员。","Please review the park admission information and note the closing time. Free guided tour services are available within the park. Feel free to ask the staff for any assistance."]]},{"cid":"b1-p3-n4-2","title":"2.景区导览/秩序维护","blocks":[[3,"2.景区导览/秩序维护","Tour Guiding & Crowd Management"],[4,"（1）路线指引","Route Guidance"],[0,"欢迎来到海上世界文化艺术中心，请问有什么需要我帮忙的？","Welcome to the Sea World Culture and Arts Center! How can I help you?"],[0,"请沿这条走廊直行，您会看到“主展厅 / Main Exhibition Hall”的中英文指示牌，按标识左转，再直行约2分钟即可到达。","Walk straight along this corridor and you will see the sign for \"Main Exhibition Hall\" in both Chinese and English. Follow it and turn left. Walk straight for about 2 minutes."],[0,"沿途均有中英文标识，请放心前往。","There are signs in both Chinese and English along the way, so please feel free to go."],[4,"（2）拍照规范","Photography Rules"],[0,"您可以在此拍照，请遵守景区相关规定。","Feel free to take photos here, but please follow the photography rules in the park."],[0,"室内展厅禁止使用闪光灯，以保护文物安全。","Flash photography is not allowed inside the exhibition hall for the protection of cultural relics."],[0,"请勿攀爬雕塑、建筑或景观拍照，以免发生危险。","Please do not climb on sculptures, buildings, or landscapes for photos. Danger may occur."],[0,"拍照时请勿堵塞通道，以免影响其他游客通行。","Please do not block walkways while taking photos so as to avoid affecting other visitors."],[4,"（3）限流与等候提醒","Crowd Control & Waiting Reminders"],[0,"为保障大家的安全和游览体验，避免场地过于拥挤，目前景区实施客流限制措施。","To ensure everyone's safety and an enjoyable visit, and to avoid overcrowding, the site is currently operating under crowd control measures."],[0,"大约需要排队等候15-20 分钟，我们会实时用中英双语广播播报等候时间，您可以留意一下。","The wait time is about 15-20 minutes. We will announce real-time updates in both Chinese and English. Please pay attention."],[0,"因为排队人数较多，请您在指定区域等候，和其他游客保持安全距离。","Please wait in the designated area and keep a safe distance from others."],[0,"如果只是短暂离开，可以跟我们工作人员说一声，但请务必按时回来，超时可能需要重新排队，请您理解。","If you need to step away briefly, please notify our staff. Please be sure to return on time. If you are late, you may have to requeue. Thank you for your understanding."],[0,"请您耐心等待，附近设有休息座椅和饮水区，可供使用。","Thank you for your patience. There are benches and water stations nearby for your use."]]},{"cid":"b1-p3-n4-3","title":"3.应急处理","blocks":[[3,"3.应急处理","Emergency Response"],[4,"（1）迷路/走失","Lost Person Assistance"],[0,"您是不是迷路了？需要帮忙吗？","Excuse me, are you lost? Do you need help?"],[0,"您还记得旅行团名称、导游名字或者集合地点吗？","Do you remember your tour group name, your tour guide's name, or the meeting point?"],[0,"我知道了，喷泉离这里不远。我陪您过去，也可以帮您联系导游。","Got it. The fountain isn't far. I'll go with you there and help you contact your guide."],[4,"（2）医疗","Medical Assistance"],[0,"您还好吗？先在这边休息一下，喝杯温水。请问您哪里不舒服？","Are you okay? Please rest here for a while and have some warm water. Are you feeling unwell?"],[0,"您先坐着休息，我马上拿医药箱过来，给您用清凉油缓解一下。","Please sit down and rest. I'll get the first-aid kit right away and bring you some medicated oil to ease your discomfort."],[0,"我们景区有24小时急救站，有专业医护人员。如果您还是不舒服，我可以马上叫医生过来检查，也可以陪您去附近医院。","We have a 24-hour emergency station in the scenic area with professional medical staff. If you still feel unwell, I can call a doctor to check on you immediately, or I can accompany you to a nearby hospital."],[0,"我就在旁边陪着您，有任何情况随时跟我说。","I'll stay here with you. Please let me know if you need anything."],[0,"保障每位游客的安全和健康是我们应该做的。","Your safety and health are our top priority."],[4,"（3）失物","Lost & Found"],[0,"请问您是在找东西吗？您别着急，我帮您一起找。","Are you looking for something? Don't worry, I'll help you."],[0,"请您说一下太阳镜的颜色、款式，大概是在哪里弄丢的？","Could you please tell me the color and style of your sunglasses, and where you lost them?"],[0,"我马上为您登记失物信息，安排工作人员现场查找，同时用中英双语广播帮您发布失物招领。","I'll register your lost item right away, arrange for staff to search for it in the surroundings, and make a lost and found announcement in both Chinese and English."],[0,"请您留下联系方式，找到后我们将第一时间通知您。","Please leave your contact information, and we'll call you as soon as we find it."],[4,"（4）天气提醒","Weather Alert"],[0,"我市刚发布了天气应急预警，根据气象预报，深圳很快会有短时大风和降雨，为了您的安全，需要做好应急避险。","A weather emergency alert has been issued. There will soon be strong winds and rain in Shenzhen. For your safety, please take precautions."],[0,"我们已经设置了安全避险区域，室内展馆和游客服务中心都可以避雨避风，请您前往最近的室内场所。","We have shelters set up for your safety. The indoor exhibition hall and visitor center are both open. Please go to the nearest one."],[0,"请注意脚下，地面湿滑，小心摔倒，也请保管好随身物品。","Please watch your step. The ground is slippery, so be careful not to fall. Please keep your belongings safe."],[0,"我市刚发布了天气应急预警，风雨期间，不要在大树、高楼、广告牌附近或露天广场停留。","Our city has issued a weather emergency alert. Please stay safe during the storm and avoid lingering near trees, tall buildings, billboards, or in open squares."],[0,"我们会及时通过中英双语广播更新天气情况，第一时间通知大家恢复游览。","We will update the weather information regularly in both Chinese and English and notify everyone as soon as the tour resumes."]]},{"cid":"b1-p3-n5-1","title":"1.迎宾","blocks":[[2,"餐饮服务篇","Dining Services"],[3,"1.迎宾","Greeting & Seating"],[4,"（1）引导等位","Waiting Queue Guidance"],[0,"欢迎光临！请问您是几个人就餐？","Welcome! How many in your party?"],[0,"非常抱歉，现在正是用餐高峰，餐厅已经满座，需要稍作等位。","I'm so sorry, it's peak dining hours right now, and the restaurant is full. You’ll need to wait a bit."],[0,"大概需要等候 20 分钟。请拿好这张等位号，有空位时我们会现场叫号。","It will take about 20 minutes. Here's your number. We will call you when a table's ready."],[0,"等位区有免费的饮用水、小零食和充电插座，您可以在那边休息等候。","We have free water, snacks, and charging stations in the waiting area. You can relax and wait there."],[0,"再等5分钟就有空位了，我们非常抱歉给您带来不便，为了表达歉意，您就餐时我们会给您赠送一份甜品。","A table should be free in about 5 minutes. Sorry to keep you waiting. As an apology, we'd like to offer you a free dessert with your meal."],[0,"感谢您的理解！我会尽快为您安排座位。","Thank you for your understanding! We'll get you seated as soon as we can."],[4,"（2）引导入座","Seating Guidance"],[0,"您好，欢迎光临！请问您几位用餐？","Hello, welcome! How many in your party?"],[0,"刚好有个靠窗的位置，请这边坐。","There's a window seat available. Please sit there."],[0,"我马上为您拿菜单和茶水，请稍等。","I'll get you the menu and tea right away. Please wait a moment."],[4,"（3）递菜单","Menu Presentation"],[0,"这是我们的中英文双语菜单，配有菜品图片。","This is our bilingual menu in Chinese and English, with pictures of the dishes."],[0,"我们店主营深圳本地菜和粤式特色菜。","Our restaurant specializes in local Shenzhen dishes and Cantonese specialties."],[0,"您慢慢看。需要点餐时，请随时叫我。","Please take your time checking the menu. Let me know when you’re ready to order."],[4,"（4）倒茶","Serving Tea"],[0,"打扰一下，给您倒杯茶。","Excuse me, here's a cup of tea for you."],[0,"这是我们本地的中式茶水，口感清香解腻。","This is our local Chinese tea; it's refreshing and helps cut the grease."],[0,"请小心，茶水很烫。","Please be careful. The tea is very hot."]]},{"cid":"b1-p3-n5-2","title":"2.点餐服务","blocks":[[3,"2.点餐服务","Order Taking Services"],[0,"点餐前我先跟您确认一下饮食偏好可以吗？","May I confirm your dietary preferences before ordering?"],[0,"请问您有食物过敏吗？比如海鲜、花生或者鸡蛋等。","Do you have any food allergies? For example, seafood, peanuts, or eggs?"],[0,"请问您是素食者吗？还有其他饮食禁忌吗？","Are you vegetarian? Any other dietary restrictions?"],[0,"我们这边的菜品都不辣，很适合您。","Our dishes are all non-spicy, so you'll be fine."],[0,"我特别推荐本店的招牌菜：清蒸鲈鱼和海鲜粥。","Here are our highly recommended dishes: steamed sea bass and seafood congee."],[0,"跟您确认一下：您点的是清蒸鲈鱼和海鲜粥，对吗？我马上为您下单。","Just to confirm: you ordered steamed sea bass and seafood congee, right? I'll place your order now."]]},{"cid":"b1-p3-n5-3","title":"3.席间服务","blocks":[[3,"3.席间服务","During-meal Services"],[4,"（1）上菜","Serving Dishes"],[0,"清蒸鲈鱼和海鲜粥，都是我们的特色菜。","Steamed sea bass and seafood congee are both our specialties."],[0,"菜品很烫，请小心用餐。","It's very hot. Please take care."],[0,"您的菜品上齐了，请您慢用。","Your dishes are all served. Enjoy your meal!"],[4,"（2）席间提示","Table Service Reminders"],[0,"打扰一下，请问您用得惯筷子和勺子吗？如果不习惯的话，我可以为您更换刀叉。","Excuse me, are you comfortable using chopsticks and spoons? If not, we have knives and forks available."],[0,"请问您需要添加茶水和纸巾吗？","Would you like more tea and napkins?"],[0,"我马上为您续茶。","I'll refill your tea right away."],[4,"（3）追加菜品","Additional Order"],[0,"请问您用餐还满意吗？","Hello! How's everything so far?"],[0,"如果您需要加菜可以随时叫我。","Please feel free to call me if you'd like to order more."],[0,"我推荐马蹄糕，是粤式点心，清甜不腻。跟您确认一下：加一份马蹄糕，对吗？","I recommend water chestnut cake. It's a Cantonese dim sum, sweet but not greasy. I just want to confirm: would you like to order one portion of water chestnut cake?"],[0,"这道点心大约10分钟就好，请您稍等。","This dim sum will be ready in about 10 minutes. Please wait a moment."]]},{"cid":"b1-p3-n5-4","title":"4.结账支付","blocks":[[3,"4.结账支付","Bill Settlement & Payment"],[0,"请稍等，我马上为您核对账单。","Please wait a moment. I'll check your bill right away."],[0,"这是您的账单明细，请您核对一下金额。","Here is your bill. Please check the amount."],[0,"我们支持现金、银行卡、支付宝和微信支付，都很方便。您扫这个二维码付款就可以了。","We accept cash, bank card, Alipay, and WeChat Pay, all very convenient. You can pay by scanning this QR code."],[0,"请您稍等，我这边确认一下。已收到您的付款，这是您的小票。","Just a moment, please. Let me confirm. Your payment has been received. Here is your receipt."]]},{"cid":"b1-p3-n5-5","title":"5.打包/外卖服务","blocks":[[3,"5.打包/外卖服务","Takeout & Delivery Service"],[4,"（1）打包","Food Packaging"],[0,"我马上给您拿打包盒，请稍等。","I'll get you some to-go boxes right away. Please wait a moment."],[0,"所有菜品都打包好了。","All packed up."],[4,"（2）外卖服务","Delivery Service"],[0,"我们支持美团、淘宝闪购两大外卖平台点餐，您手机上就可以点餐。","We accept orders from both Meituan and Taobao Instant Commerce delivery platforms. You can order directly from your phone."],[0,"您也可以直接在餐厅柜台点外卖，打包好就能带走。","You can also order delivery directly at the counter. It will be packed and ready to take away."],[0,"柜台打包免费，平台外卖会有少量配送费，手机点餐时会有费用明细。","Packing at the counter is free. However, there is a small delivery fee for platform orders. You'll see the details clearly when you order via your phone."]]},{"cid":"b1-p3-n6-1","title":"1.志愿者U站服务","blocks":[[2,"志愿服务篇","Volunteer Services"],[3,"1.志愿者U站服务","Volunteer U-Station Services"],[4,"（1）便民服务","Convenience Services"],[0,"欢迎来到深圳，我是U站的志愿者，请问需要帮忙吗？","Welcome to Shenzhen. I'm a volunteer from the U Station. Do you need any help?"],[0,"这里离酒店不远。您可以到附近地铁站坐4号线，换乘1号线，在香蜜湖站下车就到了。也可以直接在这里打车过去。","It's not far from here. You can take Line 4 from the nearby subway station, transfer to Line 1, and get off at Xiangmihu Station. You can also take a taxi from here."],[0,"U站还提供免费饮用水、手机充电器、深圳中英文地图，还有简易急救用品。","The U Station also provides free water, phone chargers, Shenzhen maps in both Chinese and English, and basic first-aid supplies."],[0,"这份地图标注了深圳所有知名景点和地铁线路。","This map shows all the famous attractions and subway lines in Shenzhen."],[4,"（2）城市文明引导","Public Etiquette Promotion"],[0,"我是城市文明宣导志愿者，请问有什么可以帮您？","I\\m a volunteer promoting public etiquette here. Can I help you?"],[0,"草坪为城市公共绿地，请勿踩踏，您可在旁侧步道拍照。感谢您的理解与配合。","The lawn is a public green space. Please don't step on it. You're welcome to take photos from the path nearby. Thank you for your understanding and cooperation."],[0,"请自觉进行垃圾分类，保持环境整洁。公共场合请轻声交谈、有序排队，不随地吐痰。","Please sort your trash and keep the environment clean. In public places, please speak softly, queue in an orderly manner, and avoid spitting."],[0,"这是一份中英双语文明出游指引，里面有深圳景区、地铁、餐厅的文明提示。","This is a bilingual guide for responsible travel in Shenzhen. It includes etiquette tips for scenic spots, subways, and restaurants."]]},{"cid":"b1-p3-n6-2","title":"2.交通场站指引","blocks":[[3,"2.交通场站指引","Transportation Hub Guidance"],[4,"（1）购票指引","Ticket Purchase"],[0,"我是机场/高铁站/地铁志愿者，请问需要帮忙吗？","I'm a volunteer here. Do you need any help?"],[0,"我来教您操作，非常简单便捷。","Let me show you how it works. It's very easy."],[0,"您先在这台自助售票机上买票，点击屏幕选择英文模式，目的地选广州，再选合适的发车时间。","First, please buy your ticket at this self-service ticket machine. Click on the screen to select English, choose Guangzhou as your destination, and then select a suitable departure time."],[0,"您可以用支付宝、微信或者银行卡支付，在这里扫码或插卡就行。","You can use Alipay, WeChat Pay, or your bank card. Just scan the code or insert your card here."],[4,"（2）安检指引","Security Check"],[0,"我带您去安检，请这边走。","I'll take you to the security check. Please, this way."],[0,"这里是安检入口，请有序排队。","This is the security checkpoint. Please queue in an orderly manner."],[0,"安检前请把包里的充电器、笔记本电脑和液体物品取出来。","Please take out your charger, laptop, and liquids from your bag before going through security."],[0,"把行李放在传送带上，再过安检门就可以了。","Place your luggage on the conveyor belt and then go through the security gate."],[0,"过安检后，按照指示牌前往登机口/检票口就行。","After security check, you can follow the signs to your boarding gate or ticket gate."],[4,"（3）行李协助","Luggage Assistance"],[0,"欢迎来到深圳宝安国际机场/深圳北高铁站！您的行李比较多，需要我帮您拿吗？","Welcome to Shenzhen Bao'an International Airport/ Shenzhen North Railway Station! You have a lot of luggage. Would you like me to help you?"],[0,"您接下来要去哪里？我来帮您搬这个大行李箱。","I'll help you with this large suitcase. Where are you going next?"],[0,"行李车就在那边角落，我带您去取。","The luggage cart is over there in the corner. I'll take you to get it."],[0,"行李已经帮您放好了，现在带您去机场大巴乘车点。","Your luggage has been taken care of. Now I'll take you to the airport bus stop."],[0,"请您保管好行李和随身物品，以免丢失。","Please keep your luggage and belongings safe."]]},{"cid":"b1-p3-n6-3","title":"3.口岸通关指引","blocks":[[3,"3.口岸通关指引","Border Clearance Guidance"],[0,"我是口岸的志愿者，请问您带好有效护照或香港入境签注了吗？","I'm a volunteer here at the port. Do you have your valid passport or Hong Kong entry permit with you?"],[0,"我陪您完成整个流程，非常便捷。","I'll guide you through the whole process; it's very convenient."],[0,"您用手机扫这个二维码，选择英文模式，简单填写信息就可以。","Scan this QR code with your phone, select English, and fill in the required information."],[0,"现在我们选择通关通道，外国游客可以走那边的人工查验通道。","Now we'll choose customs clearance channel. Foreign tourists can use the manual inspection channel over there."],[0,"轮到您时，请向工作人员出示护照，听从指引操作即可。边检验证后，需要过安检。","When it's your turn, please show your passport to the staff and follow their instructions. After border inspection, you’ll need to go through security."]]},{"cid":"b1-p3-n6-4","title":"4.景区指引","blocks":[[3,"4.景区指引","Scenic Spot Guidance"],[0,"请问需要购票或入园指引吗？","Do you need any help with buying tickets or entering the park?"],[0,"深圳所有景区都需要实名制预约，也可以凭护照现场预约购票，操作很方便。","All scenic spots in Shenzhen require real-name reservations. You can also book on-site with your passport — it's quick and easy."],[0,"先扫这个二维码，打开官方小程序，选择今天的入园时段。","Please scan this QR code to open the official mini-program and select your entry time slot for today."],[0,"填写您的护照号码，选择成人票，用微信、支付宝或信用卡付款，就能生成电子票二维码。","Then fill in your passport number, select an adult ticket, and pay with WeChat, Alipay, or credit card. You’ll get an e-ticket QR code right away."],[0,"我带您到前面的闸机口验票安检，请这边走。","I'll take you to the gate ahead for ticket verification and security check. This way, please."]]},{"cid":"b1-p3-n6-5","title":"5.客流疏导","blocks":[[3,"5.客流疏导","Crowd Management"],[0,"我是现场志愿者。当前客流较大，我引导您前往安全分流通道。","I'm a volunteer here. There are a lot of people now. Let me guide you through the diversion route."],[0,"请跟我来，靠右侧通行。这边是分流通道，人流较少。","Please follow me and keep to the right. This is the diversion route, so it's less crowded."],[0,"请慢行，不要在通道中间停留、聚集，避免挡住其他游客通行。","Please walk slowly. Do not stop or gather in the middle of the passageway, so as not to block other visitors."],[0,"我们志愿者全程在岗，如遇人流拥挤，可随时向我们求助。","We volunteers are always here. In case of crowding, please feel free to ask us for help."]]},{"cid":"b1-p3-n6-6","title":"6.无障碍服务","blocks":[[3,"6.无障碍服务","Accessibility Services"],[0,"我是现场志愿者，请问需要无障碍通道指引吗？","I'm a volunteer here. Are you looking for the accessible route?"],[0,"无障碍通道在前方。如需协助推行轮椅，请随时告知。","The accessible route is straight ahead. Would you like me to help push your wheelchair? It's safer with assistance."],[0,"我会平稳推行，请您注意扶稳坐好。","I will push the wheelchair smoothly. Please hold onto the handrail."],[0,"这是专用无障碍通道，坡度平缓，无台阶，便于轮椅通行。","This is an accessible route. It has a gentle slope and no steps, very safe for wheelchair users."],[0,"深圳公共场所均配备无障碍设施，方便有需要的人士使用。","All public areas in Shenzhen are equipped with accessible facilities for those in need."]]},{"cid":"b1-p3-n6-7","title":"7.医疗服务","blocks":[[3,"7.医疗服务","Medical Services"],[0,"您还好吗？留意到您不太舒服，我是这里的志愿者，我来帮您。","Are you alright? I noticed you weren't feeling well. I'm a volunteer here. Let me help you."],[0,"我先扶您到旁边的长椅上休息一下。请慢慢坐，深呼吸。","Let me help you to the bench over there to rest. Please sit down slowly and take deep breaths."],[0,"我给您倒杯水，缓解一下。那您就在这安心休息，不用急着起身。","I'll get you some water to help you feel better. Please rest here and take your time."],[0,"我这里还有清凉油，也能帮您缓解头晕。您现在感觉怎么样？好一点了吗？","I also have some cooling balm here. It can help relieve your dizziness. How are you feeling now? Are you feeling better?"],[0,"现场志愿者全程在岗，如遇突发情况或身体不适，请及时联系工作人员。","If you feel unwell or need assistance, please contact us immediately."]]},{"cid":"b1-p3-n7-1","title":"1.信用卡","blocks":[[2,"支付指引篇","Payment Guidance"],[3,"1.信用卡","Credit Card"],[0,"在深圳使用信用卡非常方便，酒店、餐厅和商场等场所均支持Visa、Mastercard、银联等信用卡支付。","It is very convenient to use credit cards in Shenzhen. Most hotels, restaurants, and malls take Visa, Mastercard, UnionPay, and other credit cards."],[0,"收银台或POS机上印有对应Logo，即可使用信用卡。","If you see the logo at the cashier or on the POS terminal, you can use your card there."],[0,"请您在POS机上刷卡/插卡并输入密码.","Please swipe or insert your card into the POS terminal and enter your PIN."],[0,"已扣款成功，请在单据上签名。","Payment completed. Please sign the receipt."]]},{"cid":"b1-p3-n7-2","title":"2.支付宝/微信","blocks":[[3,"2.支付宝/微信","Alipay & WeChat"],[0,"您也可以选择支付宝/微信支付，更加便捷。","You can also choose Alipay/WeChat, which is more convenient."],[0,"请先下载支付宝/微信APP，使用境外手机号注册国际版。","Please download the Alipay/WeChat app first and register for the international version with your overseas phone number."],[0,"请上传护照并完成人脸核验。进入“我的”-“银行卡”，添加银行卡并完成银行验证。","Please upload your passport and complete facial verification. Go to \"Me\" – \"Bank Cards,\" link your bank card, and complete verification."],[0,"绑定完成后，点击“付钱”向商家出示付款二维码，就可以支付了。","After linking your account, click \"Pay\" and show your payment code to the merchant."],[0,"也可以点击“扫一扫”，扫描商家二维码付款。","You can var BIZ_BOOKS = window.BIZ_BOOKS || [];   /* 商务英语阅读书架：biz_books.js，结构与 APEC_BOOKS 相同 */


/* words.json v2：单词表只存 key，词条本身全库只存一份。这里展开成 {words:[...]}，
   上层的 s.words[i] 访问方式完全不用改（数组元素是同一个对象引用，不额外占内存）。 */
function prepareWordData(d){
  if(!d) return [];
  if(d.v === 2 && d.sets){
    var IDX = d.idx || {};
    for(var j=0;j<d.sets.length;j++){
      var s = d.sets[j];
      /* 已并入「母语大全」的老表：只留 keys 供旧进度迁移时反查词形，不展开、不上页面 */
      if(s.hidden){ s.words = []; continue; }
      if(s.keys){
        var arr = new Array(s.keys.length);
        for(var i=0;i<s.keys.length;i++) arr[i] = IDX[s.keys[i]] || ['', '', '', 0];
        s.words = arr;
        delete s.keys;
      }
    }
    return d.sets;
  }
  return d;   // v1 兼容
}

/* ================= 状态与持久化 ================= */
var STORE_KEY = 'lqyy_v1';
var memWarn = false;
function defaultState(){
  /* kw: 学习状态，键是「词」本身 → {l:1 已学, t:最近一次, n:复习档位}
     hk: 难词本，键是「词」本身 → 1
     words / review / hard：旧版按「表 + 序号」存，只用于一次性迁移（见 migrateState） */
  return {kw:{}, hk:{}, words:{}, pods:{}, podPos:{}, apec:{}, review:{}, hard:{}};
}
var state = defaultState();
function loadState(){
  try{
    var raw = localStorage.getItem(STORE_KEY);
    if(raw){ state = JSON.parse(raw) || defaultState(); }
  }catch(e){ memWarn = true; }
  // 补齐字段
  state.kw = state.kw || {};
  state.hk = state.hk || {};
  state.words = state.words || {};
  state.pods = state.pods || {};
  state.podPos = state.podPos || {};
  state.apec = state.apec || {};
  state.review = state.review || {};
  state.hard = state.hard || {};
}
function saveState(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }
  catch(e){ memWarn = true; }
}
/* ===== 词的全局唯一键 =====
   14 张单词表其实是同一批词的 14 种切法（59160 条记录只有 14587 个不同的词）。
   所以学习状态按「词」存，不按「表 + 序号」存：
   在任何一个词表里标记已学，所有词表里的同一个词都算已学，天然不会重复出现。
   句子表 / 短语表不跨表合并，用 slug#idx 作为键。 */
var KEY_SETS = null;        // 词 -> 出现在哪些词表（slug 数组）
function wordKey(x){
  return String(x).toLowerCase().replace(/[\u2018\u2019]/g, "'").replace(/\s+/g, ' ').trim();
}
function buildKeySets(){
  KEY_SETS = {};
  if(!WORD_DATA) return;
  for(var j=0;j<WORD_DATA.length;j++){
    var s = WORD_DATA[j];
    if((s.kind || 'word') !== 'word') continue;
    for(var i=0;i<s.words.length;i++){
      var w = s.words[i];
      if(!w) continue;
      var k = w._k || (w._k = wordKey(w[0]));
      var arr = KEY_SETS[k] || (KEY_SETS[k] = []);
      if(arr.indexOf(s.slug) === -1) arr.push(s.slug);
    }
  }
}
function keyOf(slug, idx){
  var s = findWordSet(slug);
  if(s && (s.kind || 'word') === 'word'){
    var w = s.words && s.words[idx];
    if(w) return w._k || (w._k = wordKey(w[0]));
    /* 合并后的老表没有 words，只有 keys：旧进度迁移靠这里还原词形 */
    if(s.keys && s.keys[idx] !== undefined) return s.keys[idx];
  }
  return slug + '#' + idx;
}
function setsOfKey(k){ return (KEY_SETS && KEY_SETS[k]) || []; }

function isLearned(slug, idx){
  var r = state.kw[keyOf(slug, idx)];
  return !!(r && r.l);
}
function toggleWord(slug, idx){
  var k = keyOf(slug, idx);
  if(state.kw[k] && state.kw[k].l){ delete state.kw[k]; }        // 撤销：排期一起清掉
  else{ state.kw[k] = { l:1, t: Date.now(), n: 0 }; }            // 首次学：1 天后进待复习
  invalidateDone();
  saveState();
  return !!(state.kw[k] && state.kw[k].l);
}
var _doneCache = null;
function invalidateDone(){
  _doneCache = null;
  /* invalidateLearnedTexts 定义在语伴模块闭包里（可能尚未初始化），要防未定义 */
  if(typeof invalidateLearnedTexts === 'function') invalidateLearnedTexts();
  else if(window.invalidateLearnedTexts) window.invalidateLearnedTexts();
}
/* 每张表「已学」多少条：含在其他专题学过的同一个词（用户选择「隐藏但计入」） */
function doneMap(){
  if(_doneCache) return _doneCache;
  var m = {};
  for(var k in state.kw){
    if(!Object.prototype.hasOwnProperty.call(state.kw, k)) continue;
    var r = state.kw[k];
    if(!r || !r.l) continue;
    var arr = setsOfKey(k);
    if(!arr.length){
      /* 句子表 / 短语表用的是 slug#idx，不在 KEY_SETS 里，直接从前缀取表名 */
      var p = k.indexOf('#');
      if(p > 0) arr = [k.slice(0, p)];
    }
    for(var i=0;i<arr.length;i++) m[arr[i]] = (m[arr[i]] || 0) + 1;
  }
  _doneCache = m;
  return m;
}
function wordDoneCount(slug){ var m = doneMap(); return m[slug] || 0; }
/* 全局已掌握的不同单词数 / 词库不同单词总数 */
function learnedTotal(){
  var n = 0;
  for(var k in state.kw){
    if(!Object.prototype.hasOwnProperty.call(state.kw, k)) continue;
    var r = state.kw[k];
    if(r && r.l && setsOfKey(k).length) n++;
  }
  return n;
}
function uniqueWordTotal(){ return KEY_SETS ? Object.keys(KEY_SETS).length : 0; }
/* 句子/短语表（kind 不是 word）的条目用「表名#序号」存，不计入 KEY_SETS，
   所以「已掌握单词」永远是 0 增长。这里单独算一份，首页总进度才不会被漏掉。 */
function sentenceSlugs(){
  var out = {};
  if(!WORD_DATA) return out;
  for(var i=0;i<WORD_DATA.length;i++){
    var s = WORD_DATA[i];
    if(!s.hidden && (s.kind || 'word') !== 'word') out[s.slug] = 1;
  }
  return out;
}
function sentenceTotal(){
  var n = 0;
  if(!WORD_DATA) return 0;
  for(var i=0;i<WORD_DATA.length;i++){
    var s = WORD_DATA[i];
    if(!s.hidden && (s.kind || 'word') !== 'word') n += s.words.length;
  }
  return n;
}
function learnedSentence(){
  var map = sentenceSlugs(), n = 0;
  for(var k in state.kw){
    if(!Object.prototype.hasOwnProperty.call(state.kw, k)) continue;
    var r = state.kw[k];
    if(!r || !r.l) continue;
    var p = k.indexOf('#');
    if(p > 0 && map[k.slice(0, p)]) n++;
  }
  return n;
}
/* 清空本专题：删掉本表所有词的学习状态。与其他专题共用的词会一起变回未学 */
function resetWords(slug){
  var s = findWordSet(slug);
  if(!s) return 0;
  var n = 0;
  for(var i=0;i<s.words.length;i++){
    var k = keyOf(slug, i);
    if(state.kw[k]){ delete state.kw[k]; n++; }
    /* 难词本也一起清：否则重置后难词本里还留着「已经没学过」的词，
       点进去复习反而给它们重新排期 */
    if(state.hk[k]){ delete state.hk[k]; }
  }
  invalidateDone();
  saveState();
  return n;
}

/* ================= 复习队列（间隔重复，纯本地） =================
   标记"已学"时立即排期，间隔 1/3/7/15/30/60 天；到期才出现在"待复习"里。
   "记得"→ 进下一档；"忘了"→ 退回第 1 档，明天再见。
   排期同样挂在「词」上：同一个词无论在几个词表里出现，只复习一次，不会重复排 13 遍。 */
var SRS_DAYS = [1, 3, 7, 15, 30, 60];
var DAY_MS = 86400000;
function dueState(r){
  if(!r || !r.l) return -1;
  var n = Math.min(r.n || 0, SRS_DAYS.length - 1);
  var at = (r.t || 0) + SRS_DAYS[n] * DAY_MS;
  return Date.now() >= at ? at : -1;
}
function dueKeys(){
  var out = [];
  for(var k in state.kw){
    if(!Object.prototype.hasOwnProperty.call(state.kw, k)) continue;
    var at = dueState(state.kw[k]);
    if(at >= 0) out.push({ key:k, at:at });
  }
  out.sort(function(a, b){ return a.at - b.at; });
  return out;
}
function dueCount(slug){
  var s = findWordSet(slug);
  if(!s) return 0;
  var n = 0, seen = {};
  for(var i=0;i<s.words.length;i++){
    var k = keyOf(slug, i);
    if(seen[k]) continue;
    seen[k] = 1;
    if(dueState(state.kw[k]) >= 0) n++;
  }
  return n;
}
function dueTotal(){ return dueKeys().length; }
function gradeReview(k, ok){
  var r = state.kw[k] || { l:1, t: Date.now(), n: 0 };
  r.l = 1;
  r.n = ok ? Math.min((r.n || 0) + 1, SRS_DAYS.length - 1) : 0;
  r.t = Date.now();
  state.kw[k] = r;
  invalidateDone();
  saveState();
}

/* ================= 难词本（同样按「词」去重） ================= */
function isHard(slug, idx){ return !!state.hk[keyOf(slug, idx)]; }
function toggleHard(slug, idx){
  var k = keyOf(slug, idx);
  if(state.hk[k]) delete state.hk[k];
  else state.hk[k] = 1;
  saveState();
  return !!state.hk[k];
}
function hardCount(slug){
  var s = findWordSet(slug);
  if(!s) return 0;
  var n = 0, seen = {};
  for(var i=0;i<s.words.length;i++){
    var k = keyOf(slug, i);
    if(seen[k]) continue;
    seen[k] = 1;
    if(state.hk[k]) n++;
  }
  return n;
}
function hardTotal(){
  var t = 0;
  for(var k in state.hk){ if(state.hk[k]) t++; }
  return t;
}
/* 旧版状态迁移：把「表 + 序号」里的已学/排期/难词搬到「词」上。词库就绪后执行一次。 */
function migrateState(){
  if(state.kwMigrated) return;
  var w = state.words, rv = state.review, hd = state.hard, moved = 0;
  for(var slug in w){
    if(!Object.prototype.hasOwnProperty.call(w, slug)) continue;
    var arr = w[slug] || [];
    for(var i=0;i<arr.length;i++){
      var k1 = keyOf(slug, arr[i]);
      if(!state.kw[k1]) state.kw[k1] = { l:1, t: Date.now(), n: 0 };
      moved++;
    }
  }
  for(var sl in rv){
    if(!Object.prototype.hasOwnProperty.call(rv, sl)) continue;
    var m = rv[sl] || {};
    for(var idx in m){
      if(!Object.prototype.hasOwnProperty.call(m, idx)) continue;
      var k2 = keyOf(sl, +idx);
      var rec = state.kw[k2] || (state.kw[k2] = { l:1, t: Date.now(), n: 0 });
      if(m[idx] && m[idx].t) rec.t = m[idx].t;
      if(m[idx] && typeof m[idx].n === 'number') rec.n = m[idx].n;
    }
  }
  for(var s3 in hd){
    if(!Object.prototype.hasOwnProperty.call(hd, s3)) continue;
    (hd[s3] || []).forEach(function(i){ state.hk[keyOf(s3, i)] = 1; });
  }
  state.words = {}; state.review = {}; state.hard = {};
  state.kwMigrated = 1;
  invalidateDone();
  saveState();
  if(moved) console.log('[轻学] 已把 ' + moved + ' 条旧进度迁移到按词存储');
}

/* ---- 「实用口语」重排后的一次性索引迁移 ----
   2026-10 把全部语料整理进「实用口语」后，表内顺序变了，
   而句子表的进度键是 spokens#序号，所以按 words.json 里带的 migrate 映射
   把老进度搬到新位置，避免「已学」标记错位到别的句子上 */
function migrateSpokens(){
  if(state.spMig2) return;
  var s = findWordSet('spokens');
  if(!s || !s.migrate){ state.spMig2 = 1; saveState(); return; }
  var m = s.migrate, moved = 0, hardMoved = 0;
  Object.keys(state.kw).forEach(function(k){
    var hit = /^spokens#(\d+)$/.exec(k);
    if(!hit) return;
    var to = m[hit[1]];
    if(to === undefined) return;
    var nk = 'spokens#' + to;
    if(nk === k) return;
    var rec = state.kw[k], prev = state.kw[nk];
    /* 两个旧序号并到同一新位置时，保留复习档位更靠后的那条 */
    if(!prev || (rec && (rec.n || 0) > (prev.n || 0))) state.kw[nk] = rec;
    delete state.kw[k];
    moved++;
  });
  Object.keys(state.hk).forEach(function(k){
    var hit = /^spokens#(\d+)$/.exec(k);
    if(!hit) return;
    var to = m[hit[1]];
    if(to === undefined) return;
    var nk = 'spokens#' + to;
    state.hk[nk] = 1;
    if(nk !== k) delete state.hk[k];
    hardMoved++;
  });
  state.spMig2 = 1;
  invalidateDone();
  saveState();
  if(moved || hardMoved) console.log('[轻学] 实用口语重排：迁移学习进度 ' + moved + ' 条、难词 ' + hardMoved + ' 条');
}

/* 朗读：使用浏览器自带的语音合成（TTS），离线可用 */
function speak(text){
  if(!text) return;

/* ================= 阅读朗读（商务 / 手册） =================
 * 音色固定 athena（微软 en-US-JennyNeural）——经字节级比对确认，与 APEC 手册预生成
 * mp3 是同一个声音。走 worker 的 /edge 合成（Edge 音色手机浏览器直连会被 403），
 * 结果存进语伴同一个持久缓存（Cache Storage 'tts-v1'，key 格式一致可互通），
 * 同一句话第二次朗读零等待、零额度。合成失败退回手机自带朗读。 */
var READ_VOICE = 'athena';
var readAudioUrls = {};               /* text -> blobURL，让「再点一次=停止」和重复朗读复用 */
var readPlayingText = '';             /* 当前正在朗读的句子（用于再点停止） */
var readToken = 0;                    /* 朗读请求令牌：换句后旧请求作废 */
function readCacheUrl(text){ return 'https://tts-cache.local/' + encodeURIComponent(READ_VOICE + '|' + text); }
function readCachePut(text, blob){
  if(!window.caches || !caches.open) return;
  caches.open('tts-v1').then(function(c){
    return c.put(readCacheUrl(text), new Response(blob, { headers: { 'Content-Type': 'audio/mpeg' } }));
  }).then(function(){ return caches.open('tts-v1'); }).then(function(c){
    return c.keys().then(function(keys){
      var over = keys.length - 300;
      for(var i=0;i<over;i++){ try{ c.delete(keys[i]); }catch(e){} }
    });
  }).catch(function(){});
}
function speakRead(text){
  if(!text) return;
  var conf = window.__TTS_BRIDGE;
  if(!(conf && conf.url && conf.play && window.fetch)){ speak(text); return; }
  /* 再点同句 = 停止 */
  if(readPlayingText === text){ readPlayingText = ''; conf.stop(); return; }
  readPlayingText = text;
  var myToken = ++readToken;                 /* 换句后旧请求作废，防止旧音晚到抢播 */
  if(readAudioUrls[text]){
    conf.play(readAudioUrls[text]);
    return;
  }
  /* 第一时间出声：系统朗读必须在点击手势内【同步】调用，异步调 iOS 会静音拦截。
     云端好声音在后台取，到了之后若系统还在念就无缝切换，念完了就只入缓存。 */
  speak(text);
  var ctrl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
  var timer = ctrl ? setTimeout(function(){ try{ ctrl.abort(); }catch(e){} }, 12000) : null;
  fetch(conf.url + '/edge', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'X-App-Key': conf.key },
    body: JSON.stringify({ text: text, voice: READ_VOICE }),
    signal: ctrl ? ctrl.signal : undefined
  }).then(function(res){
    if(!res.ok) throw new Error('HTTP ' + res.status);
    return res.blob();
  }).then(function(b){
    if(timer) clearTimeout(timer);
    if(!b || !b.size || (b.type && b.type.indexOf('audio') === -1)) throw new Error('不是音频');
    readCachePut(text, b);
    var url = URL.createObjectURL(b);
    readAudioUrls[text] = url;
    if(readToken !== myToken) return;
    var upgrading = false;
    try{ upgrading = window.speechSynthesis && window.speechSynthesis.speaking; }catch(e){}
    if(upgrading){ conf.stop(); conf.play(url); }   /* 无缝升级成手册同款好声音 */
  }).catch(function(){
    if(timer) clearTimeout(timer);
    if(readToken !== myToken || readCloudWarned) return;
    readCloudWarned = true;
    toast('云端好声音暂时连不上，先用手机朗读；网络恢复后点同一句会自动升级音色');
  });
}

/* 全局声音管理：同一时刻只播一个（mp3 或系统朗读），再点同句=停止 */
var curAud = null;
var curAudUrl = null;
function stopSound(){
  curAudUrl = null;
  if(curAud){
    try{ curAud.pause(); curAud.onended = null; curAud.onerror = null; }catch(e){}
    curAud = null;
  }
  if('speechSynthesis' in window){ try{ window.speechSynthesis.cancel(); }catch(e){} }
}
function playMp3OrSpeak(url, fallbackText){
  if(curAudUrl === url){ stopSound(); return; } // 同句正在播放时再点=停止
  stopSound();
  var aud = new Audio(url);
  curAud = aud;
  var fb = false;
  function fbSpeak(){
    if(fb) return; fb = true;
    if(curAud === aud){ curAud = null; curAudUrl = null; speak(fallbackText); }
  }
  aud.onerror = fbSpeak;
  aud.onended = function(){ if(curAud === aud){ curAud = null; curAudUrl = null; } };
  aud.play().then(function(){ if(curAud === aud){ curAudUrl = url; } }).catch(fbSpeak);
}

/* 返回导航：pushState 管理应用内层级，系统返回键按层后退（最深→列表→主页→退出） */
function nav(h){

/* 拦截站内 #/ 链接，统一走 nav（pushState），保证返回键可逐层后退 */
document.addEventListener('click', function(ev){
  if(ev.defaultPrevented) return;
  var el = ev.target;
  while(el && el !== document){
    if(el.tagName === 'A'){
      var h = el.getAttribute('href');
      if(h && h.charAt(0) === '#'){
        var cur = location.hash || '#/';
        if(h !== cur){ userNav = true; ev.preventDefault(); nav(h); }
        return;
      }
    }
    el = el.parentNode;
  }
});

       + '<span class="backup-hint">备份：点「备份到手机」存成一个 .json 文件（安卓存到「下载 / Download」，iPhone 存到「文件」App）。恢复：点「从文件恢复」选那个文件即可。</span></div>';
  $('app').innerHTML = html;
  $('btnBackup').onclick = saveFullBackupFile;
  $('btnRestore').onclick = pickRestoreFile;
  $('btnBackupMore').onclick = openBackupPanel;
  var bw = $('btnBkWarn');
  if(bw) bw.onclick = openBackupPanel;
}

/* ================= 视图：单词学习 ================= */
var curIdx = 0;
var studyShowAll = false;   // 浏览模式：不跳过已学（本专题全部学完后可进入）
var _studySlug = null;   // 记录上次渲染的词表，用于判断「翻词」还是「换词表」
var searchTimer = null;

/* 某条是否已学（内部用：直接拿表对象，避免重复查找） */
function learnedAt(s, i){
  var w = s.words[i];
  var k = ((s.kind || 'word') === 'word')
    ? (w ? (w._k || (w._k = wordKey(w[0]))) : s.slug + '#' + i)
    : s.slug + '#' + i;
  var r = state.kw[k];
  return !!(r && r.l);
}
function firstUnlearned(slug){
  var s = findWordSet(slug);
  if(!s) return 0;
  for(var i=0;i<s.words.length;i++){ if(!learnedAt(s, i)) return i; }
  return -1;          // -1 = 本专题已经全部学过
}
/* 从 from 起沿 dir 方向找最近一个未学词；全部已学则返回 -1 */
function nextUnlearned(slug, from, dir){
  var s = findWordSet(slug);
  if(!s) return from;
  var n = s.words.length;
  if(studyShowAll) return (from + dir + n) % n;
  for(var step=1; step<=n; step++){
    var i = (from + dir*step + n) % n;
    if(!learnedAt(s, i)) return i;
  }
  return -1;
}

/* 卡片正文（学习页复用） */
function cardBody(kind, w){
  if(kind === 'word'){
    return '<div class="word">' + esc(w[0]) + '</div>'
         + (w[1] ? '<div class="ph">/' + esc(w[1]) + '/</div>' : '')
         + (w[3]===1 ? '<div class="grp">核心词</div>' : '')
         + '<div class="def">' + esc(w[2]) + '</div>';
  }
  if(kind === 'sentence'){
    return '<div class="word big-sentence">' + esc(w[0]) + '</div>'
         + (w[2] ? '<div class="grp">' + esc(w[2]) + '</div>' : '')
         + '<div class="def">' + esc(w[1]) + '</div>';
  }
  return '<div class="word big-phrase">' + esc(w[0]) + '</div>'
       + (w[4] ? '<div class="grp">' + esc(w[4]) + '</div>' : '')
       + '<div class="def">' + esc(w[1]) + '</div>'
       + '<div class="ex"><div class="ex-en">' + esc(w[2]) + '</div>'
       + (w[3] ? '<div class="ex-cn">' + esc(w[3]) + '</div>' : '') + '</div>';
}
/* 复习卡：正面只给词/句，背面给释义 */
function wordFace(kind, w){
  if(kind === 'sentence') return '<div class="word big-sentence">' + esc(w[0]) + '</div>';
  if(kind === 'phrase') return '<div class="word big-phrase">' + esc(w[0]) + '</div>';
  if(kind === 'word' || !kind){
    return '<div class="word">' + esc(w[0]) + '</div>' + (w[1] ? '<div class="ph">/' + esc(w[1]) + '/</div>' : '');
  }
  return '<div class="word big-phrase">' + esc(w[0]) + '</div>';
}
function wordBack(kind, w){
  if(kind === 'sentence') return '<div class="def">' + esc(w[1]) + '</div>';
  if(kind === 'word' || !kind){
    return '<div class="def">' + esc(w[2]) + '</div>' + (w[3]===1 ? '<div class="grp">核心词</div>' : '');
  }
  return '<div class="def">' + esc(w[1]) + '</div>'
       + '<div class="ex"><div class="ex-en">' + esc(w[2]) + '</div>'
       + (w[3] ? '<div class="ex-cn">' + esc(w[3]) + '</div>' : '') + '</div>';
}

function studyCardHtml(s, kind, w, learned, hardOn){
  return '<div class="flashcard anim">'
       + (learned ? '<span class="done-mark">已学</span>' : '')
       + '<div class="pos">' + (curIdx+1) + ' / ' + s.words.length + '</div>'
       + cardBody(kind, w)
       + '<div style="display:flex;gap:8px;justify-content:center;margin-top:14px">'
       + '<button class="mini-btn" id="btnSound">🔊 朗读</button>'
       + '<button class="mini-btn' + (hardOn ? ' on' : '') + '" id="btnHard">' + (hardOn ? '⭐ 已收进难词本' : '⭐ 太难') + '</button>'
       + '</div></div>';
}
function bindCard(s, w){
  var bs = $('btnSound');
  if(bs) bs.onclick = function(){ stopSound(); speak(w[0]); };
  var bh = $('btnHard');
  if(bh) bh.onclick = function(){
    toggleHard(s.slug, curIdx);
    toast(isHard(s.slug, curIdx) ? '已收进难词本' : '已从难词本移除');
    paintCard();
    var hn = document.querySelector('#app .subbar a[href="#/hard"] .num');
    if(hn) hn.textContent = hardTotal();
  };
}
/* 只替换卡片本身，不重建整页：滚动位置不动、搜索框里输入的字不丢、没有闪屏 */
function paintCard(){
  var s = findWordSet(route.slug);
  if(!s) return;
  var kind = s.kind || 'word';
  if(typeof curIdx !== 'number' || isNaN(curIdx) || curIdx < 0) curIdx = 0;
  if(curIdx >= s.words.length) curIdx = 0;
  var w = s.words[curIdx];
  if(!w) return;
  var learned = isLearned(s.slug, curIdx), hardOn = isHard(s.slug, curIdx);
  var old = document.querySelector('#app .flashcard');
  if(old){
    var tmp = document.createElement('div');
    tmp.innerHTML = studyCardHtml(s, kind, w, learned, hardOn);
    var fresh = tmp.firstElementChild;
    if(fresh) old.parentNode.replaceChild(fresh, old);
  }
  var mk = $('btnMark');
  if(mk){ mk.className = 'btn-mark' + (learned ? ' off' : ''); mk.textContent = learned ? '撤销已学' : '标记已学'; }
  var dn = document.querySelector('#app .subbar a[href^="#/review"] .num');
  if(dn) dn.textContent = dueCount(s.slug);
  var hs = $('studyHint');
  if(hs && !studyShowAll) hs.innerHTML = studyHintHtml(s);
  bindCard(s, w);
  ssSetPos('w', s.slug, curIdx);
}
/* 学习页公用部分：搜索框 + 重置进度 + 浏览模式（正常状态和「已全部学过」状态都要绑） */
function bindSearch(s, kind){
  var q = $('q');
  if(!q) return;
  function matchOf(ww, v){
    if(kind==='word'){ return ww[0].toLowerCase().indexOf(v)!==-1 || (ww[2]||'').toLowerCase().indexOf(v)!==-1; }
    if(kind==='sentence'){ return ww[0].toLowerCase().indexOf(v)!==-1 || (ww[1]||'').toLowerCase().indexOf(v)!==-1; }
    return ww[0].toLowerCase().indexOf(v)!==-1 || (ww[1]||'').toLowerCase().indexOf(v)!==-1
        || (ww[2]||'').toLowerCase().indexOf(v)!==-1 || (ww[3]||'').toLowerCase().indexOf(v)!==-1;
  }
  q.addEventListener('input', function(){
    var box = $('sres');
    var v = this.value.trim().toLowerCase();
    if(!v){ box.style.display='none'; box.innerHTML=''; return; }
    var hits = [];
    for(var i=0;i<s.words.length && hits.length<50;i++){
      if(matchOf(s.words[i], v)) hits.push(i);
    }
    box.style.display='block';
    if(!hits.length){ box.innerHTML = '<div class="empty">无匹配</div>'; return; }
    var h = '';
    hits.forEach(function(i){
      var ww = s.words[i];
      h += '<button data-i="'+i+'"><strong>' + esc(ww[0]) + '</strong>';
      if(kind==='word'){ h += (ww[1]?' <span style="color:var(--faint)">/' + esc(ww[1]) + '/</span>':'') + '<div class="def">' + esc(ww[2]) + '</div>'; }
      else if(kind==='sentence'){ h += '<div class="def">' + esc(ww[1]) + '</div>'; }
      else{ h += '<div class="def">' + esc(ww[1]) + (ww[2]?' · ' + esc(ww[2]):'') + '</div>'; }
      if(learnedAt(s, i)) h += '<span class="tag">✓ 已学</span>';
      h += '</button>';
    });
    box.innerHTML = h;
    var btns = box.querySelectorAll('button');
    btns.forEach(function(b){
      b.onclick = function(){ curIdx = +b.getAttribute('data-i'); $('q').value=''; box.style.display='none'; renderStudy(); };
    });
  });
}
function bindStudyShell(s, kind){
  var rs = $('btnReset');
  if(rs) rs.onclick = function(){
    var n = wordDoneCount(s.slug);
    if(!n){ toast('本专题还没有已学记录'); return; }
    if(confirm('确定清空本专题的已学进度（' + n + ' 条）？\n\n注意：与其他专题共用的词会一起变回未学。')){
      resetWords(s.slug); curIdx = 0; studyShowAll = false; renderStudy(); toast('进度已重置');
    }
  };
  var sa = $('btnShowAll');
  if(sa) sa.onclick = function(){ studyShowAll = true; curIdx = 0; renderStudy(); };
  var lm = $('lnkStudyMode');
  if(lm) lm.onclick = function(){ studyShowAll = false; curIdx = 0; renderStudy(); };
  bindSearch(s, kind);
}
function studyHintHtml(s){
  var dd = wordDoneCount(s.slug), ll = s.words.length - dd;
  return '← → 切换（自动跳过已学）· 空格 / 回车 标记已学 · 本专题已学 <b>'
       + dd.toLocaleString() + ' / ' + s.words.length.toLocaleString() + '</b>，还剩 ' + ll.toLocaleString() + ' 条';
}
function studyEmptyHtml(s){
  return '<div class="empty">本专题 ' + s.words.length.toLocaleString() + ' 条已全部学过 ✓<br>'
       + '同一个词在别的专题学过，这里也不会再出现。<br><br>'
       + '<button class="chip-btn" id="btnShowAll">浏览全部词</button> '
       + '<a class="chip-btn" href="#/review">去复习</a></div>';
}
function renderStudy(){
  var s = findWordSet(route.slug);
  if(!s){ redirectTo('#/'); return; }
  if(_studySlug !== s.slug) studyShowAll = false;
  var fi = firstUnlearned(s.slug);
  if(typeof curIdx !== 'number' || isNaN(curIdx) || curIdx < 0) curIdx = (fi >= 0 ? fi : 0);
  /* 同一词表内翻词时保留滚动位置，避免换卡瞬间页面跳动（表现为「闪一下」）；
     切换词表才回到顶部 */
  var keepScroll = (_studySlug === s.slug);
  var prevY = window.pageYOffset || 0;
  _studySlug = s.slug;
  var kind = s.kind || 'word';
  var d = wordDoneCount(s.slug), left = s.words.length - d;
  var html = '';
  html += '<div class="study-head">'
       + '<a class="mini-btn" href="#/">返回</a>'
       + '<span class="title">' + esc(s.title) + '</span>'
       + '<button class="mini-btn danger" id="btnReset">重置进度</button></div>';
  var ph = kind==='word' ? '在本专题内搜索单词或释义…'
         : kind==='sentence' ? '搜索英文句子或中文释义…'
         : '搜索短语 / 中文 / 例句…';
  html += '<div class="searchbox"><input id="q" type="search" placeholder="' + esc(ph) + '"></div>';
  html += '<div class="search-results" id="sres" style="display:none"></div>';
  var dueN = dueCount(s.slug), hardNall = hardTotal();
  html += '<div class="subbar">'
       + '<a class="chip-btn' + (dueN ? ' on' : '') + '" href="#/review/' + s.slug + '">🔁 本专题待复习 <span class="num">' + dueN + '</span></a>'
       + '<a class="chip-btn' + (hardNall ? ' on' : '') + '" href="#/hard">⭐ 难词本（全部）<span class="num">' + hardNall + '</span></a>'
       + '</div>';

  /* 句子表按场景分了类：给一个分类跳转，避免必须从头翻到某个场景 */
  if(kind === 'sentence' && (s.groups || 0) > 1){
    if(!s._grpMap){
      s._grpMap = {}; s._grpOrder = [];
      s.words.forEach(function(x, i){
        var g = x[2] || '日常·通用';
        if(!s._grpMap[g]){ s._grpMap[g] = 0; s._grpOrder.push(g); }
        s._grpMap[g]++;
      });
    }
    var curG = (s.words[curIdx] && s.words[curIdx][2]) || '';
    var gopts = '<option value="">全部场景（' + s.words.length.toLocaleString() + ' 条）</option>';
    s._grpOrder.forEach(function(g){
      gopts += '<option value="' + esc(g) + '"' + (g === curG ? ' selected' : '') + '>' + esc(g) + '（' + s._grpMap[g] + '）</option>';
    });
    html += '<div class="subbar"><select id="grpSel" style="flex:1 1 100%;min-width:0;padding:9px 10px;'
         + 'border:1px solid var(--hair);border-radius:10px;background:var(--surface);color:inherit;font-size:13px;">'
         + gopts + '</select></div>';
  }
  if(!studyShowAll && left <= 0){
    $('app').innerHTML = html + studyEmptyHtml(s);
    bindStudyShell(s, kind);
    window.scrollTo(0, 0);
    return;
  }

  var w = s.words[curIdx];
  if(!w){ curIdx = 0; w = s.words[0]; }
  var learned = isLearned(s.slug, curIdx);
  var hardOn = isHard(s.slug, curIdx);
  html += studyCardHtml(s, kind, w, learned, hardOn);

  html += '<div class="controls">'
       + '<button class="btn-nav" id="btnPrev">上一个</button>'
       + '<button class="btn-mark ' + (learned?'off':'') + '" id="btnMark">' + (learned?'撤销已学':'标记已学') + '</button>'
       + '<button class="btn-nav" id="btnNext">下一个</button></div>';
  if(studyShowAll){
    html += '<div class="hint" id="studyHint">浏览模式（不跳过已学）· <a href="javascript:;" id="lnkStudyMode">回到学习模式</a></div>';
  }else{
    html += '<div class="hint" id="studyHint">' + studyHintHtml(s) + '</div>';
  }
  $('app').innerHTML = html;
  /* 翻词时维持滚动位置；换词表时回到顶部。
     在下一帧再校一次，避免内容高度变化后浏览器把滚动位置夹回顶部（表现为闪动） */
  function restoreScroll(y){
    var el = document.documentElement;
    var max = Math.max((el.scrollHeight || 0) - window.innerHeight, 0);
    window.scrollTo(0, Math.max(0, Math.min(y, max)));
  }
  if(keepScroll && prevY > 0){
    restoreScroll(prevY);
    /* 新内容刚插入时高度可能还没算完，补两次校正，避免被夹回顶部 */
    setTimeout(function(){ restoreScroll(prevY); }, 0);
    setTimeout(function(){ restoreScroll(prevY); }, 60);
  }else if(!keepScroll){
    window.scrollTo(0, 0);
  }

  $('btnPrev').onclick = function(){
    var nx = nextUnlearned(s.slug, curIdx, -1);
    if(nx < 0){ toast('本专题已经全部学完 ✓'); return; }
    curIdx = nx; paintCard();
  };
  $('btnNext').onclick = function(){
    var nx = nextUnlearned(s.slug, curIdx, 1);
    if(nx < 0){ toast('本专题已经全部学完 ✓'); return; }
    curIdx = nx; paintCard();
  };
  var gsel = $('grpSel');
  if(gsel) gsel.onchange = function(){
    var g = gsel.value, start = -1, first = -1;
    if(!g){ curIdx = 0; }
    else{
      for(var i2=0;i2<s.words.length;i2++){
        if((s.words[i2][2] || '') !== g) continue;
        if(first < 0) first = i2;
        if(!learnedAt(s, i2)){ start = i2; break; }
      }
      curIdx = start >= 0 ? start : (first >= 0 ? first : 0);
    }
    renderStudy();
    setTimeout(function(){ window.scrollTo(0, 0); }, 40);
  };
  bindCard(s, w);
  $('btnMark').onclick = function(){
    var on = toggleWord(s.slug, curIdx);
    var nx = -1;
    if(on) nx = nextUnlearned(s.slug, curIdx, 1);
    if(on && nx < 0){
      toast('已标记 · 本专题已全部学完 ✓');
      renderStudy();          // 切到「已学完」总览
      return;
    }
    toast(on ? '已标记' : '已撤销（各专题同步）');
    if(on) curIdx = nx;
    paintCard();
  };
  bindStudyShell(s, kind);
  ssSetPos('w', s.slug, curIdx);
  // 滚动到当前词条：恢复/切换后停留在离开时的位置
  setTimeout(function(){
    var el = document.querySelector('.flashcard');
    if(el){ el.scrollIntoView({block:'center'}); }
  }, 60);
}

/* ================= 视图：复习（间隔重复） ================= */
var revQueue = null, revPos = 0, revKey = null, revShown = false;
/* 一个词在多个词表里出现，复习队列里只排一次（按词去重），取第一次出现的位置展示 */
function startReview(slug){
  revQueue = []; revPos = 0; revShown = false;
  var seen = {}, now = Date.now();
  function collect(s){
    for(var i=0;i<s.words.length;i++){
      var k = keyOf(s.slug, i);
      if(seen[k]) continue;
      var r = state.kw[k];
      var at = dueState(r);
      if(at < 0) continue;
      seen[k] = 1;
      revQueue.push({ slug: s.slug, idx: i, key: k, at: at });
    }
  }
  if(slug){
    var s0 = findWordSet(slug);
    if(!s0) return;
    collect(s0);
  }else{
    for(var j=0;j<WORD_DATA.length;j++) collect(WORD_DATA[j]);
  }
  revQueue.sort(function(a, b){ return a.at - b.at; });
}
function renderReview(){
  var q = revQueue || [];
  var head = '<div class="study-head">'
           + '<a class="mini-btn" href="#/">返回</a>'
           + '<span class="title">🔁 复习</span>'
           + (route.slug ? '<a class="mini-btn" href="#/review">全部专题</a>' : '')
           + '</div>';
  if(!q.length){
    $('app').innerHTML = head + '<div class="empty">今天没有到期的复习。<br>标记「已学」的词会按 1 / 3 / 7 / 15 / 30 / 60 天的间隔回来找你。</div>';
    return;
  }
  if(revPos >= q.length){
    $('app').innerHTML = head + '<div class="empty">这一批复习完了 ✓<br>共 ' + q.length + ' 条，明天见。<br><br>'
      + '<a class="chip-btn" href="#/">回首页</a> <a class="chip-btn" href="#/review">再看一遍待复习</a></div>';
    return;
  }
  var it = q[revPos], s = findWordSet(it.slug);
  if(!s){ revPos++; renderReview(); return; }
  var w = s.words[it.idx], kind = s.kind || 'word';
  if(!w){ revPos++; renderReview(); return; }
  var hardOn = isHard(it.slug, it.idx);
  var html = head
    + '<div class="subbar"><span class="chip-btn">' + esc(s.title) + '</span>'
    + '<span class="chip-btn">' + (revPos+1) + ' / ' + q.length + '</span></div>'
    + '<div class="flashcard">'
    + '<div class="pos">先回想，再看释义</div>'
    + wordFace(kind, w)
    + '<div style="margin-top:16px;padding-top:16px;border-top:1px solid var(--hair);min-height:52px">'
    + (revShown ? wordBack(kind, w) : '<div style="text-align:center;color:var(--faint);font-size:13px;padding-top:10px">这个词/句是什么意思？</div>')
    + '</div>'
    + '<div style="display:flex;gap:8px;justify-content:center;margin-top:14px">'
    + '<button class="mini-btn" id="rvSound">🔊 朗读</button>'
    + '<button class="mini-btn' + (hardOn ? ' on' : '') + '" id="rvHard">⭐</button>'
    + '</div></div>';
  html += revShown
    ? '<div class="rev-controls"><button class="btn-forgot" id="rvForgot">忘了</button><button class="btn-remember" id="rvRemember">记得</button></div>'
    : '<div class="rev-controls"><button class="btn-reveal" id="rvShow">显示释义</button></div>';
  html += '<div class="rev-meta">记得 → 间隔拉长（1→3→7→15→30→60 天）· 忘了 → 明天再来</div>';
  $('app').innerHTML = html;

  $('rvSound').onclick = function(){ stopSound(); speak(w[0]); };
  $('rvHard').onclick = function(){ toggleHard(it.slug, it.idx); renderReview(); };
  if($('rvShow')) $('rvShow').onclick = function(){ revShown = true; renderReview(); };
  if($('rvRemember')) $('rvRemember').onclick = function(){ gradeReview(it.key, true); revPos++; revShown = false; renderReview(); };
  if($('rvForgot')) $('rvForgot').onclick = function(){ gradeReview(it.key, false); revPos++; revShown = false; renderReview(); };
}

/* ================= 视图：难词本 ================= */
var pendingWord = null;
function renderHard(slug){
  var sets = slug ? [findWordSet(slug)] : WORD_DATA;
  var total = 0, body = '', seen = {};
  sets.forEach(function(s){
    if(!s) return;
    var isW = (s.kind || 'word') === 'word', cnt = 0, rows = '';
    for(var i=0;i<s.words.length;i++){
      var w = s.words[i];
      if(!w) continue;
      var k = isW ? (w._k || (w._k = wordKey(w[0]))) : (s.slug + '#' + i);
      if(!state.hk[k] || seen[k]) continue;   // 按词去重：同一个词只出现一次
      seen[k] = 1;
      cnt++;
      var kind = s.kind || 'word';
      var def = kind === 'word' ? (w[2] || '') : (w[1] || '');
      rows += '<div class="hard-row" data-slug="' + esc(s.slug) + '" data-idx="' + i + '">'
            + '<div class="hw"><b>' + esc(w[0]) + '</b><span>' + esc(def) + '</span></div>'
            + '<span class="src">' + (kind==='word'?'词':'句/短语') + '</span>'
            + '<button class="kill" data-kill="1" aria-label="移出难词本">✕</button></div>';
    }
    if(cnt){
      total += cnt;
      body += '<div class="sect-title">' + esc(s.title) + ' · ' + cnt + ' 条</div>' + rows;
    }
  });
  var html = '<div class="study-head">'
           + '<a class="mini-btn" href="#/">返回</a>'
           + '<span class="title">⭐ 难词本</span>'
           + (slug ? '<a class="mini-btn" href="#/hard">全部专题</a>' : '')
           + '</div>';
  html += total ? body : '<div class="empty">难词本还是空的。<br>学习时点「⭐ 太难」就会收进来，之后可在这里集中攻克。</div>';
  $('app').innerHTML = html;

  document.querySelectorAll('#app .hard-row').forEach(function(row){
    row.onclick = function(ev){
      var kill = ev.target.closest ? ev.target.closest('[data-kill]') : null;
      var sl = row.getAttribute('data-slug'), ix = +row.getAttribute('data-idx');
      if(kill){
        ev.stopPropagation();
        toggleHard(sl, ix);
        renderHard(route.slug || null);
        toast('已移出难词本');
        return;
      }
      pendingWord = { slug: sl, idx: ix };
      nav('#/words/' + sl);
    };
  });
}

function levelBadge(e){
  // e = [n,title,level,duration,size,url,category]
  var lv = (e[2]||'').trim();
  if(!lv && e[6] && /^level\s*\d+$/i.test(e[6].trim())){
    return '<span class="tag">级别 ' + esc(e[6].trim().replace(/^level\s*/i,'')) + '</span>';
  }
  if(lv){ return '<span class="tag">' + esc(lv) + '</span>'; }
  if(e[6]){ return '<span class="tag gray">' + esc(e[6]) + '</span>'; }
  return '';
}
function renderPodList(){
  var p = findPod(route.src);
  if(!p){ redirectTo('#/'); return; }
  var d = podDoneCount(p.source);
  var html = '';
  html += '<div class="study-head">'
       + '<a class="mini-btn" href="#/">返回</a>'
       + '<span class="title">' + esc(p.title) + '</span>'
       + '<button class="mini-btn danger" id="btnResetP">重置进度</button></div>';
  html += '<div class="overall"><span class="meta">已听 ' + d + ' / ' + p.episodes.length + ' 集</span>'
       + '<span class="pbar"><i style="width:' + pct(d,p.episodes.length) + '%"></i></span></div>';

  p.episodes.forEach(function(e, idx){
    var heard = isHeard(p.source, idx);
    var dur = e[3] || '—', size = e[4] || '—';
    html += '<div class="ep ' + (heard?'heard':'') + '" data-i="' + idx + '">'
         + '<button class="chk" data-chk="' + idx + '" aria-label="切换已听">' + (heard?'✓':'') + '</button>'
         + '<div class="body">'
         + '<a class="tt" href="' + esc(e[5]) + '" target="_blank" rel="noopener">' + e[0] + '. ' + esc(e[1]) + '</a>'
         + '<div class="meta">' + levelBadge(e)
         + '<span>' + esc(dur) + '</span><span>' + esc(size) + '</span></div>'
         + '</div></div>';
  });
  $('app').innerHTML = html;

  $('btnResetP').onclick = function(){
    if(confirm('确定清空本来源全部已听进度？')){ resetPods(p.source); state.podPos[p.source]=0; renderPodList(); toast('进度已重置'); }
  };
  var rows = document.querySelectorAll('.ep');
  rows.forEach(function(r){
    r.querySelector('[data-chk]').onclick = function(ev){
      ev.preventDefault(); ev.stopPropagation();
      var i = +r.getAttribute('data-i');
      togglePod(p.source, i);
      state.podPos[p.source] = i;
      renderPodList();
    };
  });
  // 恢复上次浏览位置
  var last = state.podPos[p.source] || 0;
  if(last > 3){
    setTimeout(function(){
      var el = document.querySelector('.ep[data-i="' + last + '"]');
      if(el){ el.scrollIntoView({block:'center'}); }
    }, 60);
  }
  // 记录滚动位置（节流：滚停 400ms 只写一次，避免边滚边写 localStorage）
  var podScrollT = null;
  window.onscroll = function(){
    if(route.view !== 'podlist' || podScrollT) return;
    podScrollT = setTimeout(function(){
      podScrollT = null;
      if(route.view !== 'podlist') return;
      var rowsNow = document.querySelectorAll('.ep');
      for(var i=0;i<rowsNow.length;i++){
        var r = rowsNow[i];
        if(r.getBoundingClientRect().bottom > 80){
          var v = +r.getAttribute('data-i');
          if(state.podPos[p.source] !== v){ state.podPos[p.source] = v; saveState(); }
          break;
        }
      }
    }, 400);
  };
}
