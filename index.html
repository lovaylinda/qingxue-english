/* ================= 视图：章节双语学习流 ================= */
var apecCur = 0;
function renderChapterFlow(){
  var bk = findBook(route.slug);
  if(!bk){ redirectTo('#/'); return; }
  var c = findChapter(bk, route.chap);
  if(!c){ redirectTo('#/books/' + bk.bookId); return; }
  var bl = apecBilingualList(c.blocks); // blocks 下标序列
  var arr = apecArr(bk.bookId, c.cid);
  // 自动定位第一个未学
  var firstUn = 0;
  for(var i=0;i<bl.length;i++){ if(arr.indexOf(i)===-1){ firstUn = i; break; } }
  if(typeof apecCur !== 'number' || isNaN(apecCur)) apecCur = firstUn;
  apecCur = Math.max(0, Math.min(apecCur, bl.length-1));

  var done = arr.length;
  var html = '';
  html += '<div class="study-head">'
       + '<a class="mini-btn" href="#/books/' + bk.bookId + '">章节列表</a>'
       + '<span class="title">' + esc(c.title) + '</span>'
       + '<button class="mini-btn danger" id="btnResetChap">重置本章</button></div>';
  html += '<div class="overall"><span class="meta">本章进度：' + done + ' / ' + bl.length + ' 条 · ' + esc(bk.title) + '</span>'
       + '<span class="pbar"><i style="width:' + pct(done,bl.length) + '%"></i></span></div>';

  // 渲染 blocks 流
  var k = -1; // bilingual 序号
  var sayTexts = []; // 双语英文文本，供朗读按钮按序号取用
  html += '<div class="flow">';
  c.blocks.forEach(function(b, bi){
    var kind = b[0];
    if(kind === 0){
      k++;
      sayTexts.push(b[2]);
      var learned = arr.indexOf(k)!==-1;
      html += '<div class="biling ' + (learned?'done':'') + (k===apecCur?' active':'') + '" data-k="' + k + '">'
            + (learned ? '<span class="done-mark">已学</span>' : '')
            + '<div class="b-cn">' + esc(b[1]) + '</div>'
            + '<div class="b-en">' + esc(b[2]) + '</div>'
            + '<button class="mini-btn sayb" data-bi="' + (sayTexts.length-1) + '" style="margin-top:8px">🔊 朗读</button></div>';
    }else{
      html += '<div class="hsep h' + kind + '"><span class="hcn">' + esc(b[1]) + '</span><span class="hen">' + esc(b[2]) + '</span></div>';
    }
  });
  html += '</div>';

  html += '<div class="controls">'
       + '<button class="btn-nav" id="btnPrev">上一条</button>'
       + '<button class="btn-mark ' + (arr.indexOf(apecCur)!==-1?'off':'') + '" id="btnMark">' + (arr.indexOf(apecCur)!==-1?'撤销已学':'标记已学') + '</button>'
       + '<button class="btn-nav" id="btnNext">下一条</button></div>';
  html += '<div class="hint">← → 切换 · 空格 / 回车 标记已学 · 当前第 ' + (apecCur+1) + ' / ' + bl.length + ' 条</div>';
  $('app').innerHTML = html;

  document.querySelectorAll('.flow .sayb').forEach(function(btn){
    btn.onclick = function(){
      var i = +btn.getAttribute('data-bi');
      if(!sayTexts[i]) return;
      /* 商务阅读没有预生成 mp3：直接用手机自带朗读（同步调用，点击即响） */
      if(String(bk.bookId).indexOf('biz') === 0){ stopSound(); speak(sayTexts[i]); }
      else playMp3OrSpeak('./_audio/' + bk.bookId + '_' + c.cid + '_' + i + '.mp3', sayTexts[i]);
    };
  });

  function go(idx){ apecCur = idx; renderChapterFlow(); }
  /* 章节前后跳转：本章到头/到尾时自动进上一章/下一章，不用回目录 */
  function chapIndex(){
    for(var i=0;i<bk.chapters.length;i++){ if(bk.chapters[i].cid === c.cid) return i; }
    return -1;
  }
  function goChapter(delta, toEnd){
    var i = chapIndex() + delta;
    if(i < 0 || i >= bk.chapters.length) return false;
    var nc = bk.chapters[i];
    var nbl = apecBilingualList(nc.blocks);
    var target = toEnd ? Math.max(0, nbl.length - 1) : 0;
    ssSetPos('a', bk.bookId + '|' + nc.cid, target);   // 先存位置，render 会读它
    apecCur = target;
    nav('#/books/' + bk.bookId + '/' + nc.cid);
    toast((delta > 0 ? '已进入下一章：' : '已回到上一章：') + nc.title);
    return true;
  }
  /* 点击任意一句 = 选中该句并显示外框（与「下一条」等效） */
  function paintActive(){
    document.querySelectorAll('.flow .biling').forEach(function(r){
      r.classList.toggle('active', (+r.getAttribute('data-k')) === apecCur);
    });
    var mk = document.getElementById('btnMark');
    if(mk){
      var dn = arr.indexOf(apecCur) !== -1;
      mk.className = 'btn-mark' + (dn ? ' off' : '');
      mk.textContent = dn ? '撤销已学' : '标记已学';
    }
    var h = document.querySelector('.hint');
    if(h) h.textContent = '← → 切换 · 空格 / 回车 标记已学 · 当前第 ' + (apecCur+1) + ' / ' + bl.length + ' 条';
    ssSetPos('a', bk.bookId + '|' + c.cid, apecCur);
  }
  document.querySelectorAll('.flow .biling').forEach(function(r){
    r.onclick = function(ev){
      var isSay = ev && ev.target && ev.target.closest && ev.target.closest('.sayb');
      var k2 = +r.getAttribute('data-k');
      if(isNaN(k2)) return;
      if(k2 === apecCur){ if(!isSay) return; }
      else { apecCur = k2; paintActive(); }
      if(!isSay && r.scrollIntoView){ r.scrollIntoView({block:'nearest', behavior:'smooth'}); }
    };
  });
  $('btnPrev').onclick = function(){
    if(apecCur > 0){ go(apecCur - 1); return; }
    if(!goChapter(-1, true)) toast('已经是第一章的第一条');
  };
  $('btnNext').onclick = function(){
    if(apecCur < bl.length - 1){ go(apecCur + 1); return; }
    if(!goChapter(1, false)) toast('已经是最后一章的最后一条');
  };
  $('btnMark').onclick = function(){
    var wasDone = arr.indexOf(apecCur)!==-1;
    apecToggle(bk.bookId, c.cid, apecCur);
    toast(wasDone ? '已撤销' : '已标记');
    if(!wasDone){
      ssSetPos('a', bk.bookId + '|' + c.cid, apecCur);
      if(apecCur < bl.length-1){ go(apecCur + 1); return; }
      if(goChapter(1, false)) return;   // 本章最后一条：自动进下一章
    }
    renderChapterFlow();
  };
  $('btnResetChap').onclick = function(){
    if(confirm('确定清空本章全部已学进度？')){ apecResetChap(bk.bookId, c.cid); apecCur = 0; renderChapterFlow(); toast('本章进度已重置'); }
  };
  // 滚动到当前卡片
  setTimeout(function(){
    var el = document.querySelector('.biling.active');
    if(el){ el.scrollIntoView({block:'center'}); }
  }, 60);
  ssSetPos('a', bk.bookId + '|' + c.cid, apecCur);
}

/* ================= 总渲染 ================= */
function render(){
  if(!WORD_DATA){ renderBootSplash(); return; }   // 词库还没加载完，先显示外壳
  parseHash();
  ssSaveHash(location.hash);
  stopSound(); // 切换视图时停止正在播放的声音
  readPlayingText = ''; readToken++;          /* 商务云端朗读一并停掉 */
  if(window.__TTS_BRIDGE && window.__TTS_BRIDGE.stop){ try{ window.__TTS_BRIDGE.stop(); }catch(e){} }
  window.onscroll = null;
  var homeTarget = null;
  if(route.view !== 'review') revKey = null;
  if(route.view === 'words' && route.slug){
    var ws = findWordSet(route.slug);
    var svw = ws ? ssGetPos('w', route.slug) : null;
    curIdx = (typeof svw === 'number' && svw >= 0 && svw < ws.words.length) ? svw : firstUnlearned(route.slug);
    if(pendingWord && pendingWord.slug === route.slug){ curIdx = pendingWord.idx; pendingWord = null; }
    renderStudy();
  }else if(route.view === 'review'){
    var rk = 'rev:' + (route.slug || '');
    if(revKey !== rk){ revKey = rk; startReview(route.slug || null); }
    renderReview();
  }else if(route.view === 'hard'){
    renderHard(route.slug || null);
  }else if(route.view === 'pods' && route.src){
    renderPodList();
  }else if(route.view === 'books' && route.slug && route.chap){
    var sva = ssGetPos('a', route.slug + '|' + route.chap);
    apecCur = (typeof sva === 'number' && !isNaN(sva)) ? sva : NaN;
    renderChapterFlow();
  }else if(route.view === 'books' && route.slug){
    renderBookChapters();
  }else if(route.view === 'coach'){
    if(typeof window.renderCoach === 'function'){ window.renderCoach(); }
  }else if(route.view === 'write'){
    if(typeof window.renderWrite === 'function'){ window.renderWrite(); }
  }else{
    if(route.view === 'words') homeTarget = 'sec-words';
    else if(route.view === 'pods') homeTarget = 'sec-pods';
    else if(route.view === 'books') homeTarget = 'sec-books';
    else if(route.view === 'biz') homeTarget = 'sec-biz';
    renderHome();
  }
  if(homeTarget){ scrollToSection(homeTarget); }
  else if(route.view === 'home'){
    var hy = ssGetHomeY();
    if(hy){ window.scrollTo(0, hy); } else { window.scrollTo(0,0); }
  }
  // 学习页由各自视图负责定位到当前条目（scrollIntoView），此处不再强制置顶
  if(route.view === 'home'){
    var hyt = null;
    window.onscroll = function(){
      if(hyt) return;
      hyt = setTimeout(function(){ hyt = null; ssSetHomeY(window.scrollY); }, 150);
    };
  }
}

/* 键盘快捷键（学习页 / 章节流） */
document.addEventListener('keydown', function(ev){

  if(tag === 'INPUT' || tag === 'TEXTAREA') return;
  if(route.view === 'review'){
    if(!revShown){
      if(ev.key === ' ' || ev.key === 'Enter' || ev.key === 'ArrowRight'){ ev.preventDefault(); if($('rvShow')) $('rvShow').click(); }

    }

  }
  if(route.view === 'words' && route.slug){

/* ============ 会话恢复：离开后重载回到原视图与原位置 ============ */
var SS_KEY = 'qingxue-ss';
function ssRead(){
  try{
    var raw = localStorage.getItem(SS_KEY);
    if(raw){
      var o = JSON.parse(raw);
      return (o && typeof o === 'object' && !Array.isArray(o)) ? o : {};
    }
  }catch(e){}
  return {};
}
function ssWrite(o){
  try{ localStorage.setItem(SS_KEY, JSON.stringify(o)); }catch(e){}
}
function ssSaveHash(h){
  var o = ssRead(); o.hash = h; ssWrite(o);
}
function ssGetPos(kind, key){
  var o = ssRead(); var m = o[kind];
  return (m && typeof m[key] === 'number') ? m[key] : null;
}
function ssSetPos(kind, key, val){
  var o = ssRead(); o[kind] = o[kind] || {}; o[kind][key] = val; ssWrite(o);
}
function ssSetHomeY(y){
  var o = ssRead(); o.homeY = (typeof y === 'number' && y > 0) ? y : 0; ssWrite(o);
}
function ssGetHomeY(){
  var o = ssRead(); return (typeof o.homeY === 'number' && o.homeY > 0) ? o.homeY : null;
}
function ssRestoreView(){
  var o = ssRead();
  if(!location.hash && o && o.hash){
    var h = o.hash;
    // 恢复站内 hash：二级视图（#/words/slug、#/pods/source、#/books/...）与
    // 主页区块锚点（#/words、#/pods、#/books）都恢复，离开时在哪就在哪；
    // 无效路由由 render() 优雅回落主页；纯主页（#/、#、空）无需恢复。
    if(h.charAt(0) === '#' && h !== '#/' && h !== '#'){ location.hash = h; }
  }
}

/* ============ 备份 / 恢复（整站一份文件，直接存手机本地） ============ */
var LAST_BACKUP_KEY = 'qingxue_last_backup';
var PRE_RESTORE_KEY = 'qingxue_pre_restore';
var STORE_PREFIX = /^(lqyy_|qingxue|coach_)/;

function nowStamp(){
  var d = new Date(), p = function(n){ return n < 10 ? '0' + n : '' + n; };
  return d.getFullYear() + p(d.getMonth()+1) + p(d.getDate()) + '-' + p(d.getHours()) + p(d.getMinutes());
}
function collectStore(){
  var out = {};
  try{
    for(var i=0;i<localStorage.length;i++){
      var k = localStorage.key(i);
      if(!k || k === LAST_BACKUP_KEY || k === PRE_RESTORE_KEY) continue;
      if(STORE_PREFIX.test(k)) out[k] = localStorage.getItem(k);
    }
  }catch(e){}
  return out;
}
function backupCounts(){
  var c = { words:0, hard:0, diary:0, coachMsgs:0, mem:0, sent:0 };
  try{
    for(var k in state.kw){ if(Object.prototype.hasOwnProperty.call(state.kw,k) && state.kw[k] && state.kw[k].l) c.words++; }
    for(var h in state.hk){ if(Object.prototype.hasOwnProperty.call(state.hk,h) && state.hk[h]) c.hard++; }
    c.sent = learnedSentence();
  }catch(e){}
  try{
    var w = JSON.parse(localStorage.getItem('qingxue_write_v1') || '[]');
    c.diary = Array.isArray(w) ? w.length : 0;
  }catch(e){}
  try{
    ['nicole','mike','stan','otis','traveler','ahmet'].forEach(function(r){
      var hh = JSON.parse(localStorage.getItem('qingxue-coach-hist-' + r) || 'null');
      var arr = hh && hh.history ? hh.history : (Array.isArray(hh) ? hh : []);
      c.coachMsgs += arr.length;
      var mm = JSON.parse(localStorage.getItem('qingxue-coach-mem-' + r) || '[]');
      c.mem += Array.isArray(mm) ? mm.length : 0;
    });
  }catch(e){}
  return c;
}
function hasAnyData(){
  var c = backupCounts();
  return (c.words + c.diary + c.coachMsgs + c.mem) > 0;
}
function buildFullBackup(){
  return {
    app: 'qingxue-english',
    type: 'full-backup',
    version: 2,
    exportedAt: new Date().toISOString(),
    counts: backupCounts(),
    data: collectStore()
  };
}
function lastBackupDaysAgo(){
  try{
    var t = +(localStorage.getItem(LAST_BACKUP_KEY) || 0);
    if(!t) return null;
    return Math.floor((Date.now() - t) / 86400000);
  }catch(e){ return null; }
}
function markBackedUp(){
  try{ localStorage.setItem(LAST_BACKUP_KEY, String(Date.now())); }catch(e){}
}
function downloadText(text, fname){
  var blob = new Blob([text], {type:'application/json;charset=utf-8'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = fname; a.style.display = 'none';
  document.body.appendChild(a);
  a.click();
  setTimeout(function(){ URL.revokeObjectURL(url); if(a.parentNode) a.parentNode.removeChild(a); }, 1500);
}
function saveFullBackupFile(){
  var text = JSON.stringify(buildFullBackup(), null, 2);
  var fname = '轻学英语备份-' + nowStamp() + '.json';
  if(window.showSaveFilePicker){

function afterRestoreOk(msg, delay){
  toast(msg || '恢复成功，正在刷新…');
  setTimeout(function(){ location.reload(); }, delay || 600);

var _snapOk = true;
function snapshotBeforeRestore(){
  /* 返回是否真的存下了：存储快满时这一步会失败，
     若默默失败，用户在「回滚」里会发现没有快照，那时数据已经被覆盖了 */
  try{
    localStorage.setItem(PRE_RESTORE_KEY, JSON.stringify(collectStore()));
    _snapOk = true;
    return true;
  }catch(e){
    try{ localStorage.removeItem(PRE_RESTORE_KEY); }catch(e2){}
    _snapOk = false;
    return false;
  }
}
function applyFullBackup(o){
  if(!o || typeof o !== 'object' || Array.isArray(o)) return '文件内容不是有效的备份';
  if(o.app !== 'qingxue-english') return '不是「轻学英语」的备份文件';

  /* 兼容旧格式：只有学习进度 */
  if(o.type === 'progress-backup'){
    if(!o.state || typeof o.state !== 'object') return '进度字段缺失';
    snapshotBeforeRestore();
    try{ localStorage.setItem(STORE_KEY, JSON.stringify(o.state)); }
    catch(e){ return '写入失败：本地存储不可用'; }
    if(o.ss){ try{ localStorage.setItem(SS_KEY, JSON.stringify(o.ss)); }catch(e){} }
    return null;
  }
  /* 兼容旧格式：只有日记 */
  if(o.type === 'write-diary'){
    if(!Array.isArray(o.entries)) return '日记备份格式不对';
    snapshotBeforeRestore();
    try{ localStorage.setItem('qingxue_write_v1', JSON.stringify(o.entries)); }
    catch(e){ return '写入失败：本地存储不可用'; }
    return null;
  }
  if(o.type !== 'full-backup' || !o.data || typeof o.data !== 'object') return '备份格式不对（缺少 data）';
  var keys = Object.keys(o.data), n = 0;
  snapshotBeforeRestore();
  try{
    keys.forEach(function(k){
      if(!STORE_PREFIX.test(k)) return;
      var v = o.data[k];
      if(typeof v !== 'string') return;
      localStorage.setItem(k, v); n++;
    });
  }catch(e){ return '写入失败：本地存储不可用（可能空间不足）'; }
  if(!n) return '备份里没有可恢复的数据';
  return null;
}
function restoreFromText(text){
  var o = null;
  try{ o = JSON.parse(text); }catch(e){ toast('恢复失败：不是有效的备份文本'); return; }
  var err = applyFullBackup(o);
  if(err){ toast('恢复失败：' + err); return; }
  if(!_snapOk){
    afterRestoreOk('恢复成功，但当前数据快照没存下（空间不足），这次「回滚」用不了', 2600);
    return;
  }
  afterRestoreOk();
}
function pickRestoreFile(){
  var inp = document.createElement('input');
  inp.type = 'file';
  // iOS 注意：① input 不能 display:none，否则点击不弹选择器（须移出屏幕但可见）
  //          ② accept=".json" 会让 .json 文件在 iOS 选择器里变灰不可选，故 iOS 上不限制类型
  var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  if(!isIOS) inp.accept = '.json,application/json';
  inp.style.cssText = 'position:fixed;left:-9999px;top:0;width:1px;height:1px;opacity:0;';
  document.body.appendChild(inp);
  inp.onchange = function(){
    var f = inp.files && inp.files[0];
    if(!f){ if(inp.parentNode) inp.parentNode.removeChild(inp); return; }
    var c = backupCounts();
    if(!confirm('用「' + f.name + '」覆盖当前数据？\n\n当前：已学 ' + c.words + ' 条（含口语/短语） · 日记 ' + c.diary + ' 篇 · 语伴对话 ' + c.coachMsgs + ' 条\n\n恢复前会自动存一份当前数据的快照，可在「更多方式 → 回滚」里找回。')) {
      if(inp.parentNode) inp.parentNode.removeChild(inp);
      return;
    }
    var rd = new FileReader();
    rd.onload = function(){ restoreFromText(String(rd.result || '')); };
    rd.onerror = function(){ toast('读取文件失败'); };
    rd.readAsText(f);
    setTimeout(function(){ if(inp.parentNode) inp.parentNode.removeChild(inp); }, 0);
  };
  inp.click();
}
function rollbackPreRestore(){
  var raw = null;
  try{ raw = localStorage.getItem(PRE_RESTORE_KEY); }catch(e){}
  if(!raw){ toast('没有可回滚的快照'); return; }
  var o = null;
  try{ o = JSON.parse(raw); }catch(e){ toast('快照已损坏'); return; }
  if(!o || typeof o !== 'object'){ toast('快照已损坏'); return; }
  snapshotBeforeRestore();
  try{
    Object.keys(o).forEach(function(k){ if(typeof o[k] === 'string') localStorage.setItem(k, o[k]); });
  }catch(e){ toast('回滚失败：本地存储不可用'); return; }
  afterRestoreOk('已回滚到恢复前的数据，正在刷新…');
}

          return alt.then(function(b){

  function coachSpeak(text, onDone){
    if(!ttsOn){ if(onDone) onDone(); return; }
    if(!text) { if(onDone) onDone(); return; }
    var c = companion(state.role) || {};
    var uv = getUserVoice(state.role);
    var voice = uv ? uv.id : (c.voice || '');
    var speed = uv ? uv.speed : (c.voiceSpeed || 1);
    /* 真正送进语音引擎的是「朗读版」文本（去掉 haha / *laughs* / emoji 那些念出来很假的） */
    var parts = groupUtterances(splitUtterances(ttsText(text)));
    if(!(configured && voice && window.fetch)){
      /* 没有云端：直接整段交给手机朗读，别拆——手机上拆句反而磕巴 */
      speakBrowser(parts.join(' '), onDone, voice, speed);
      return;
    }
    var my = ++speakToken;
    var finished = false;
    function finish(){ if(finished) return; finished = true; if(onDone) onDone(); }
    function alive(){ return my === speakToken && !finished; }
    var gotUrl = {}, pending = {}, lockP = null;
    /* 整段回复锁定一个引擎，第一句谁先回来就定谁，后面几句跟着走；
       「上次谁赢」会记住，下一次直接沿用——不然每段回复都白跑一路请求。
       规则：上次成功的优先（能用的那个），没有记录才用你手动选的偏好。 */
    var EngineLock = lastGoodEngine || ((ttsEnginePref === 'auto') ? null : ttsEnginePref);
    function lockTo(e){
      if(!e) return;
      if(lastGoodEngine !== e){
        lastGoodEngine = e;
        try{ localStorage.setItem('coach_tts_last', e); }catch(err){}
      }
      EngineLock = e;
    }
    /* 只提前取一句：等待时间够短，又不会为了抢时间把额度一次打光 */
    function prep(i){
      if(i >= parts.length) return null;
      if(gotUrl[i] !== undefined) return Promise.resolve(gotUrl[i]);
      if(pending[i]) return pending[i];
      /* 后续句子等第一句定完引擎再发，避免两条路同时跑、音色打架 */
      var start = (i === 0) ? Promise.resolve() : (lockP || Promise.resolve());
      pending[i] = start.then(function(){
        return ttsFetchOne(parts[i], voice, alive, EngineLock);
      }).then(function(r){
        var url = r ? r.url : null;
        if(r && r.engine) lockTo(r.engine);
        /* 第一句直接命中缓存（没引擎信息）：沿用上次成功的那一级，没有就默认 Cloudflare */
        if(i === 0 && !EngineLock) lockTo(lastGoodEngine || 'cloud');
        gotUrl[i] = url;
        return url;
      });
      if(i === 0) lockP = pending[0];
      return pending[i];
    }
    var pos = 0;
    function next(){
      if(!alive()) return;
      if(pos >= parts.length) return finish();
      var i = pos++;
      var cur = prep(i);
      prep(i + 1);                       /* 播这句的同时，下一句已经在路上 */
      cur.then(function(url){
        if(!alive()) return;
        var carry = function(){
          if(!alive()) return;
          /* 系统不让我们出声（没解锁音频），继续排下一句只会一句句静默失败 */
          if(lastPlayBlocked) return finish();
          setTimeout(next, SPEAK_GAP_MS);
        };
        if(url) playTtsUrl(url, carry, speed, i > 0);
        else speakBrowser(parts[i], carry, voice, speed);
      });
    }
    next();
  }

      rec.onend = function(){ /* 单次收听结束，不自动重启 */ };
      rec.onerror = function(ev){
        if(ev.error === 'not-allowed'){
          stopListening();
          toast('没有麦克风权限，请在浏览器设置里允许后重试');
        }
      };
      rec.start();
      micOn = true;
      setMicUI();

  function toggleMic(){

      }else if(vel){

      }
    }else{
      /* AI 正在说话时不许开麦：防止把 AI 的声音录成你的话（老问题的入口） */
      var synthSpeaking = window.speechSynthesis && window.speechSynthesis.speaking;
      if(aiBusy && !currentAudio && !synthSpeaking){
        toast('AI 正在回复，等它说完再点 🎤');
        return;

      if(aiBusy || currentAudio || synthSpeaking){
        stopCurrentTTS();
        aiBusy = false;   // 语音已手动停掉，别让"播完"回调一直挂着
      }
      finalText = '';

        if(vel2){ vel2.textContent = '🎙️ 在听…说完点一下🎤结束'; vel2.classList.add('on'); }
      }
    }
  }

  /* ---- 话题标签渲染（多选 + EnglishPod 场景可搜索） ---- */
  function topicRecommended(role, name){
    var c = companion(role);
    return c.topics && c.topics.indexOf(name) >= 0;
  }
  function sortRecommended(role, arr){
    return arr.slice().sort(function(a,b){
      var ra = topicRecommended(role,a) ? 0 : 1, rb = topicRecommended(role,b) ? 0 : 1;
      return ra - rb;
    });
  }
  function buildTopicGroups(role){
    var html = '';
    THEME_GROUPS.forEach(function(g){
      var chips = sortRecommended(role, g.topics).map(function(t){
        var on = state.topics.indexOf(t) >= 0;
        return '<button class="ctopic' + (on?' active':'') + (topicRecommended(role,t)?' rec':'') + '" data-topic="' + esc(t) + '">' + esc(t) + '</button>';
      }).join('');
      html += '<div class="tgroup"><div class="tgroup-name">' + esc(g.name) + '</div><div class="ctopic-row">' + chips + '</div></div>';
    });
    return html;
  }
  function buildSceneChips(filter){
    var kw = (filter||'').toLowerCase();
    var pool = kw ? SCENES.filter(function(s){ return (s.en.toLowerCase().indexOf(kw) >= 0) || String(s.n).indexOf(filter) >= 0; }) : SCENES;
    var shown = pool.slice(0, 60);
    return {
      html: shown.map(function(s){
        var on = state.topics.indexOf(s.en) >= 0;
        return '<button class="ctopic cscene' + (on?' active':'') + '" data-topic="' + esc(s.en) + '" title="#' + s.n + '">' + esc(s.en) + '</button>';
      }).join('') + (pool.length > 60 ? '<span class="cscene-more">… ' + (pool.length-60) + ' 集未显示，输入关键词筛选</span>' : ''),
      count: pool.length
    };
  }

  function syncTopicChips(){
    // 严格一对一：只高亮 state.topics 里实际被选中的那个标签，不做任何子话题/大标签连带
    document.querySelectorAll('#app button[data-topic]').forEach(function(b){

  function coachToggleTopic(t){

    var idx = state.topics.indexOf(t);

    else {
      state.topics.push(t);
      /* 勾了话题就退出自动匹配：自动模式下 coachPickTopics 只按关键词挑 1 个话题，

  /* ---- 场景化新会话启动：输入场合背景 → 匹配话题 → 语伴先开口 ---- */
  function sceneMatchTopics(scene){
    if(!scene || !scene.trim()) return [];
    var kw = scene.toLowerCase(), hits = [];
    Object.keys(TOPIC_KW).forEach(function(t){
      var score = 0;
      (TOPIC_KW[t] || []).forEach(function(k){ if(kw.indexOf(k.toLowerCase()) >= 0) score++; });
      if(score > 0) hits.push({ t: t, s: score });
    });
    LIFE_TOPICS.concat(THEME_FLAT, Object.keys(BIG_TAG)).forEach(function(t){
      if(scene.indexOf(t) >= 0) hits.push({ t: t, s: 2 });
    });
    hits.sort(function(a,b){ return b.s - a.s; });
    return hits.slice(0, 3).map(function(m){ return m.t; });
  }
  function sceneOpener(role, scene){
    var c = companion(role);
    if(role === 'traveler'){
      var tid = getTravelerId();
      var h = 'Hey! I\u2019m ' + tid.name + ', from ' + tid.nation + '. Nice to meet you.';
      return scene ? (h + ' So let\u2019s talk about what you have in mind — where shall we start?') : (h + ' Where are you off to today?');
    }
    if(role === 'ahmet'){
      var cp = state.sessionScene ? state.sessionScene.trim() : '';
      if(cp){
        var who = (cp.match(/[A-Za-z][A-Za-z .'\-]*/) || [''])[0].trim() || (cp.split(/[\s，,、]/)[0] || 'your client');
        return 'Hello! I\u2019m ' + who + '. Good to finally connect — so, let me get straight to our business today.';
      }
      return scene ? 'Hello, I\u2019m an overseas buyer for dental tools. Nice to talk with you — let\u2019s get into the details.' : 'Hello, I\u2019m an overseas buyer for dental tools. So — where are we with our order today?';
    }
    var head = welcomeFor(role);
    return scene ? (head + ' I\u2019m all ears — tell me about it and let\u2019s dig in.') : head;
  }
  function startNewSession(scene, openBy){
    state.history = [];
    state.sessionScene = (scene || '').slice(0, 800);
    var matched = sceneMatchTopics(state.sessionScene);
    matched.forEach(function(t){ if(state.topics.indexOf(t) < 0) state.topics.push(t); });
    if(!matched.length && !state.topics.length) state.topics = ['通用日常'];
    persistSession(); syncTopicChips(); updateDialogueStatus(); rebuildChat();
    // 外贸客户固定由用户先开口；其余语伴按用户在面板选择的开场方式
    var userFirst = (state.role === 'ahmet') ? true : (openBy === 'user');
    if(userFirst){
      // 用户先开口：语伴不自动说，聚焦输入框（"在线了，你先说第一句吧"由 rebuildChat 显示）
      toast(state.role === 'ahmet' ? '客户背景已就位，请你说第一句' : '好，由你先说第一句');
      var _ct = document.getElementById('coachText');
      if(_ct) _ct.focus();

    }
    var opener = sceneOpener(state.role, state.sessionScene);
    var chatBox = document.getElementById('coachChat');
    if(chatBox) chatBox.innerHTML = '';   // 去掉"你先说第一句"的占位，避免和开场白重复
    coachAppend('ai', opener);
    lastAIText = opener;

        var hist = [];
        lines.forEach(function(l){
          l = l.trim(); if(!l) return;
          if(l.indexOf('我:') === 0) hist.push({ role:'user', content: l.slice(2).trim() });
          else {
            var i = l.indexOf(':');
            if(i > 0 && l.slice(0,i).trim()) hist.push({ role:'assistant', content: l.slice(i+1).trim() });
          }
        });
        if(!hist.length){ toast('没有识别到可恢复的对话记录'); return; }

        persistSession();

        close();
      }
    });
  }

      +     '<button class="cbtn cbtn-ghost" id="coachReplay" title="再听一遍 AI 刚才的话，跟着读">🔊 再听一遍</button>'
      +     '<button class="cbtn cbtn-ghost" id="coachReview" title="聊完让 AI 挑几处更地道的说法（会消耗一次对话额度）">📝 课后点评</button>'
      +   '</div>'
      +   '<div class="coach-input">'
      +     '<button class="cbtn mic-btn" id="coachHands" title="点一下开始说话；再点一下结束（识别结果进输入框，核对后点发送）">🎤</button>'
      +     '<textarea id="coachText" rows="2" placeholder="点🎤说话，或直接打字；核对无误后点发送 · Enter 发送，Shift+Enter 换行"></textarea>'
      +     '<button class="cbtn" id="coachSend">发送</button>'
      +   '</div>'
      +   '<div class="ctip" id="coachTip"></div>'
      + '</div>';

    // 欢迎语 / 恢复历史
    resetChatUI();
    updateDialogueStatus();
    renderStats();

    // 绑定事件
    document.getElementById('coachRoles').addEventListener('click', function(e){
      var b = e.target.closest ? e.target.closest('[data-role]') : null;
      if(b){ coachSetRole(b.getAttribute('data-role')); }
    });
    var topicsRoot = document.getElementById('coachTopics');
    document.getElementById('coachSend').addEventListener('click', function(){
      var inp = document.getElementById('coachText');
      coachSend(inp.value).catch(coachSendFail); inp.value='';
    });
    var ct = document.getElementById('coachText');
    ct.addEventListener('keydown', function(ev){
      if(ev.key === 'Enter' && !ev.shiftKey){ ev.preventDefault(); coachSend(this.value).catch(coachSendFail); this.value=''; autoGrowText(); }
      // Shift+Enter 由浏览器默认插入换行
    });
    function autoGrowText(){ ct.style.height = 'auto'; ct.style.height = Math.min(ct.scrollHeight, 130) + 'px'; }
    ct.addEventListener('input', function(){
      autoGrowText();
      finalText = ct.value;   // 你手动改过输入框后，以你改的为准，识别结果在你改的基础上追加
    });
    document.getElementById('coachHands').addEventListener('click', toggleMic);
    /* iOS 音频解锁：进语伴后任何一次点击/触摸都算手势，提前解锁常驻 audio，
       这样「开始对话」的开场白和后续 AI 回复都能自动出声，不用先手点一次 */
    if(!window.__qxUnlockBound){
      window.__qxUnlockBound = true;
      ['click','touchend'].forEach(function(ev){
        document.addEventListener(ev, function(){ unlockAudioForIOS(); }, {passive:true});
      });
    }
    document.getElementById('coachAuto').addEventListener('click', toggleAuto);
    var _relBtn = document.getElementById('coachRel');
    if(_relBtn) _relBtn.addEventListener('click', openRelPanel);
    var hintBtn = document.getElementById('coachHint');
    if(hintBtn) hintBtn.addEventListener('click', coachHint);
    var reBtn = document.getElementById('coachRehear'); if(reBtn) reBtn.addEventListener('click', coachRehear);
    var rtBtn = document.getElementById('coachRetract'); if(rtBtn) rtBtn.addEventListener('click', coachRetract);
    var rpBtn = document.getElementById('coachReplay'); if(rpBtn) rpBtn.addEventListener('click', coachReplay);
    var rvBtn = document.getElementById('coachReview'); if(rvBtn) rvBtn.addEventListener('click', coachReview);
    var vpBtn = document.getElementById('coachVoicePicker');
    if(vpBtn) vpBtn.addEventListener('click', openVoicePicker);
    bindSceneFilter();

    // 用代理统一处理所有话题 chips（生活 + 主题 + EnglishPod）；重渲染前先移除旧处理器
    app.removeEventListener('click', app._coachTopicHandler);
    app._coachTopicHandler = function(e){
      var b = e.target.closest ? e.target.closest('button[data-topic]') : null;
      if(!b) return;
      e.preventDefault();
      coachToggleTopic(b.getAttribute('data-topic'));
    };
    app.addEventListener('click', app._coachTopicHandler);
    // 手动模式：不自动启动监听，等用户点麦克风按钮
    // 进入版块不自动弹背景框；点击某个语伴时才弹出（由 coachSetRole 触发）
  };

  /* ---- 调试钩子（本地端到端验证用）：暴露自动选话题 / 检索 / 跨源索引 ---- */
  window.__coachDebug = {
    pick: function(m){ return coachPickTopics(m || ''); },
    /* 测试用：强制切到手动选话题（coachPickTopics 在自动模式下会忽略传入的 tags，
       直接传 tags 给 retrieve 是按当前模式走的，所以要先固定住话题） */
    setTopics: function(list){ state.auto = false; state.topics = (list || []).slice(); return state.topics.slice(); },
    setAuto: function(on){ state.auto = !!on; return state.auto; },
    /* 测试用：清掉增量标记后强制重建跨源索引（排查「源已加载但索引为空」用） */
    rebuildIndex: function(){ _crossBuilt = {}; _crossIndex = {}; buildTopicIndex(); return Object.keys(_crossIndex).length; },
    retrieve: function(tags, m){ return coachRetrieve((tags && tags.length) ? tags : state.topics, m || ''); },
    indexCount: function(t){ var e = _crossIndex[t]; return e ? e.list.length : 0; },
    indexFams: function(t){ var e = _crossIndex[t]; return e ? Object.keys(e.fam).sort() : []; },
    indexSample: function(t, n){ return (_crossIndex[t] ? _crossIndex[t].list : []).slice(0, n || 8).map(function(it){ return '(' + it.label + ') ' + it.en; }); },
    indexTopics: function(){ return Object.keys(_crossIndex).sort(); },
    /* 每个来源族在各话题下实际入索引的条数（审计语料归属用，只读） */
    indexDump: function(){
      var out = {};
      Object.keys(_crossIndex).forEach(function(t){ out[t] = JSON.parse(JSON.stringify(_crossIndex[t].fam)); });
      return out;
    },
    loaded: loadedSet,
    /* 手动触发一次朗读（排查音色用）：默认读当前语伴，也可传 voiceId 临时指定 */
    say: function(t){ return coachSpeak(t || 'Voice test.', function(){}); },
    resetTtsWarn: function(){ ttsWarned = false; },
    /* 查看一段文字会怎样被朗读（排查「念出 haha / 星号」这类问题用） */
    spoken: function(t){ return ttsText(t); },
    /* 查看一段回复会被切成几段来播 */
    chunks: function(t){ return groupUtterances(splitUtterances(ttsText(t))); },
    stop: function(){ stopCurrentTTS(); }
  };
})();
/* 单词学习页：左右滑屏翻页（左滑=下一个，右滑=上一个，与按钮等效）
   只在 #/words/xxx 页面生效；横向位移 ≥60px 且明显大于纵向才触发，不影响正常上下滚动 */
(function(){
  var tSX = 0, tSY = 0, tST = 0, tArm = false;
  document.addEventListener('touchstart', function(e){
    tArm = (typeof route !== 'undefined' && route.view === 'words' && route.slug);
    if(!tArm) return;
    tSX = e.touches[0].clientX; tSY = e.touches[0].clientY; tST = Date.now();
  }, {passive:true});
  document.addEventListener('touchend', function(e){
    if(!tArm) return;
    tArm = false;
    var dx = e.changedTouches[0].clientX - tSX;
    var dy = e.changedTouches[0].clientY - tSY;
    if(Date.now() - tST > 900) return;
    if(Math.abs(dx) < 60 || Math.abs(dx) < Math.abs(dy) * 1.5) return;
    var b = document.getElementById(dx < 0 ? 'btnNext' : 'btnPrev');
    if(b) b.click();
  }, {passive:true});
})();
/* 启动：先显示外壳，词库 words.json 加载完成后进入应用。
   好处：index.html 只有 ~400KB，浏览器立刻渲染页面框架，不用等 4MB 数据解析完。 */
function renderBootSplash(){
  var app = document.getElementById('app');
  if(app && !app.querySelector('.boot-splash')){
    app.innerHTML = '<div class="boot-splash" style="padding:56px 16px;text-align:center;color:#5B6B6C;font-size:15px;">'
      + '<div style="font-size:34px;margin-bottom:10px;">📚</div>'
      + '正在加载词库，首次约需 1~3 秒…<br><span style="font-size:12px;opacity:.7;">断网时也能打开（页面缓存），但词库需要联网或已有缓存</span></div>';
  }
}
(function(){
  renderBootSplash();
  var retried = false;
  function load(){
    return fetch('./words.json').then(function(r){
      if(!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    }).then(function(d){
      WORD_DATA = prepareWordData(d);
      _setMap = null;
      buildKeySets();
      migrateState();          // 旧版「表+序号」进度 → 按词存储（只需一次）
      migrateSpokens();        // 「实用口语」重排后，旧序号 → 新序号（只需一次）
      render();
    });
  }
  load().catch(function(e){
    window.__loadErr = String((e && e.stack) || e).slice(0, 600);
    if(retried){ return; }
    retried = true;
    // 网络抖动重试一次；仍失败则提示
    load().catch(function(){
      /* 不把首页渲染成空表：那样看起来像「词表全没了」，而且没地方点。
         给一个明确的错误页 + 重试按钮，重试就重新拉一次 words.json */
      WORD_DATA = null;
      var app = document.getElementById('app');
      if(app){
        app.innerHTML = '<div class="boot-splash" style="padding:48px 20px;text-align:center;color:#5B6B6C;font-size:15px;line-height:1.7;">'
          + '<div style="font-size:38px;margin-bottom:12px;">📡</div>'
          + '<strong style="color:#17312f;">词库没加载成功</strong><br>'
          + '<span style="font-size:13px;">请先确认网络正常，再点下面的按钮重试。<br>'
          + '如果一直失败：需通过 http(s) 网址访问（不能双击打开本地文件）。</span>'
          + '<div style="margin-top:18px;"><button id="bootRetry" style="padding:10px 26px;border:0;border-radius:10px;background:#0F766E;color:#fff;font-size:15px;">重新加载</button></div>'
          + '</div>';
        var rb = document.getElementById('bootRetry');
        if(rb) rb.onclick = function(){
          rb.disabled = true;
          rb.textContent = '正在重新加载…';
          load().catch(function(){
            rb.disabled = false;
            rb.textContent = '还是失败，再试一次';
          });
        };
      }
      toast('词库加载失败：请检查网络；需通过 http(s) 网址访问（不能直接双击打开文件）');
    });
  });
})();
</script>
